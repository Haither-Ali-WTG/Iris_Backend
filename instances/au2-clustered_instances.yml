---
# TODO figure out how to spread the definition over multiple files
clustered_instances:
  hosts:
    au1prodfrontend1:
      # per-clustered-instance settings (overrides) go here, for example:
      proxy:
        maxconn: 20000
      clustered_instance_machines:
        au2_machine2: ~
        # per-machine settings (overrides) would go here
        #  haproxy_version: x.y.z
        au2_machine3: ~
      iis_servers:
        - au2wt-sweb-001.test.wisecloud.zone
        - au2wt-sweb-002.test.wisecloud.zone
      certificates:
        - ahwprd-webtracker-carozplus-com
        - customers-commercialcustoms-com-au
        - star-cargowise-com
        - star-wisegrid-net
      cipher:
        ciphers_TLSv1_3:
          - TLS_AES_256_GCM_SHA384
        ciphers_upto_TLSv1_2:
          - ECDHE-RSA-CHACHA20-POLY1305
          - DHE-RSA-AES256-GCM-SHA384

    au2prodceph1:
      # per-clustered-instance settings (overrides) go here, for example:
      proxy:
        maxconn: 20000
      clustered_instance_machines:
        au2_machine1: ~
        # per-machine settings (overrides) would go here
        #  haproxy_version: x.y.z
        au2_machine2: ~
      iis_servers:
        - au2wt-sweb-003.test.wisecloud.zone
        - au2wt-sweb-004.test.wisecloud.zone
      certificates:
        - ahwprd-webtracker-carozplus-com
        - customers-commercialcustoms-com-au
        - star-cargowise-com

    au2corprdg:
      # per-clustered-instance settings (overrides) go here, for example:
      proxy:
        maxconn: 20000
      clustered_instance_machines:
        au2_machine1: ~
        au2_machine3: ~
      iis_servers: []
      certificates: []
