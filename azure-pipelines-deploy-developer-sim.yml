---
# Configuration for Azure DevOps build pipeline
trigger: none

variables:
  - template: artifacts.yml
  - name: user
    value: dante
  - name: azure_kv_name
    value: kv-wtg-iris-prod
  - name: mgmt_keyvault_name
    value: kv-wtg-dante-sim
  - name: s3_host
    value: au2s3-1.wtg.ws
  - name: use_cicd_pool
    value: true
  - name: hall
    value: A

stages:
  - stage: Simulations
    pool: cicd
    jobs:
      - job: Simulation
        steps:
          - checkout: self

          - task: AzureKeyVault@2
            displayName: 'Get secret to authenticate to key vault from ansible'
            inputs:
              azureSubscription: 'sc-azuredevops2dante-vaults'
              KeyVaultName: kv-wtg-dante-sim
              SecretsFilter: secretAppIdDf4b4604e176

          - script: |
              set -euxo pipefail
              pip install -r requirements.txt
            displayName: 'Install requirements'

          - script: |
              set -euxo pipefail
              cp ansible/ansible.cfg .
            displayName: 'Prepare to run playbooks'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download dante artifact'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # dante build artifact pipeline Id
              pipeline: 26
              buildVersionToDownload: 'specific'
              buildId: '$(dante_build_id)'
              path: $(Build.SourcesDirectory)

          - task: CopyFiles@2
            displayName: 'Merge artifacts to a single roles folder'
            inputs:
              sourceFolder: nested_virt
              targetFolder: ansible

          - task: InstallSSHKey@0
            displayName: 'Install an SSH key'
            inputs:
              knownHostsEntry: 'StrictHostKeyChecking no'
              sshKeySecureFile: 'id_rsa'

          - task: Ansible@0
            displayName: 'Calculate simulation host to use'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/calculate_available_host.yaml'
              failOnStdErr: false
              args: >-
                -u $(user) --diff -e="simulation_hosts=$(simulation_hosts)" -e="username=$(Build.QueuedBy)"
                -e="build_id=$(Build.BuildId)"

          - task: Ansible@0
            displayName: 'Deploy hypervisor'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/simulation_setup_circle1.yaml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff -e="pool=/mnt/data1/test_pool"
                -e="@ansible/hypervisor.yaml" -e="@ansible/build_id.yaml"
                -e="use_cicd_pool=$(use_cicd_pool)"
                -e="key_vault_name=$(key_vault_name)"
                -e="cpu=$(cpu)" -e="ram=$(ram)"
                -e="s3_host=$(s3_host)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

          - task: Ansible@0
            displayName: 'Check and save certificates'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/check_and_save_certificates.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="simulation=true" -e="azure_kv_name=$(azure_kv_name)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

          - task: Ansible@0
            displayName: 'Test haproxy'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/test_haproxy.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="simulation=true" -e="azure_kv_name=$(mgmt_keyvault_name)"
                -e="ceph_proxy_host=192.168.255.254" -e="ceph_proxy_port=3128"
                -e="s3_host=$(s3_host)"
                -e="target_dc=$(simulation_dc)"
                -e="@ansible/hypervisor.yaml"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

          - task: Ansible@0
            displayName: 'Unregister nodes'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/unregister_nodes.yaml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="simulation=true" -e="azure_kv_name=$(mgmt_keyvault_name)"
                -e="target_dc=$(simulation_dc)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
            condition: always()
