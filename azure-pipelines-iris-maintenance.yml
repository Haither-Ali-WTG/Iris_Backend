---
# Configuration for Azure DevOps Iris Maintenance Pipeline
# Description:
#   - This pipeline rebuilds the entire Iris host with pre and post checks.

# NOTE: This is a destructive playbook / operation. Take care.

trigger: none

schedules:
  - cron: "0 0 * * Fri"
    # AU2 sand cluster maintenance at 10am or 11am Sydney Time every Friday
    displayName: "AU2 sand cluster maintenance"
    always: true
    branches:
      include:
        - master
  - cron: "0 0 * * Sun"
    # AU2 prod cluster maintenance at 10am or 11am Sydney Time every Sunday
    displayName: "AU2 prod cluster maintenance"
    always: true
    branches:
      include:
        - master
  - cron: "0 21 * * Sat"
    # DE1 and US2 prod cluster maintenance at 7am or 8am Sydney Time every Sunday
    displayName: "DE1 and US2 prod cluster maintenance"
    always: true
    branches:
      include:
        - master

# Pipeline variables:
# - hosts: The Iris hosts will be rebuilt. By default this is empty.
#   If it's set, the following "xxx_enabled" variables will be ignored.
# - (IRIS_cluster_name)_enabled:
#   If a cluster is enabled, the earliest host in that cluster will be rebuilt.
#   This variable is disabled by default.
variables:
  - template: artifacts.yml
  - name: host_delay
    value: 3600
  - name: key_vault_name
    value: kv-wtg-dante-prod
  - name: maintenance_period
    value: 3  # hours
  - name: host_delay
    value: 2400
  - name: ad_domain
    value: CORP
  - name: comments
    value: Iris - Host Maintenance Pipeline

  - name: au2_pure_host
    value: au2s3-2.wtg.ws
  - name: us2_pure_host
    value: us2s3-2.wtg.ws
  - name: de1_pure_host
    value: de1s3-2.wtg.ws

jobs:
  - job: Iris_Maintenance_Per_Cluster
    strategy:
      matrix:
        au2-prod-frontend-1:
          enabled: $(au2-prod-frontend-1_enabled)
          dc: AU2
          hall: A
          xcc_user: $(au2_xcc_user)
          iso_url_base: $(au2_iso_url_base)
          specific_host: $(hosts)
          s3_region: AU
          s3_host: $(au2_pure_host)
        au2-prod-internal-1:
          enabled: $(au2-prod-internal-1_enabled)
          dc: AU2
          hall: A
          xcc_user: $(au2_xcc_user)
          iso_url_base: $(au2_iso_url_base)
          specific_host: $(hosts)
          s3_region: AU
          s3_host: $(au2_pure_host)
        au2-sand-internal-1:
          enabled: $(au2-sand-internal-1_enabled)
          dc: AU2
          hall: A
          xcc_user: $(au2_xcc_user)
          iso_url_base: $(au2_iso_url_base)
          specific_host: $(hosts)
          s3_region: AU
          s3_host: $(au2_pure_host)
        au2-sand-internal-2:
          enabled: $(au2-sand-internal-2_enabled)
          dc: AU2
          hall: A
          xcc_user: $(au2_xcc_user)
          iso_url_base: $(au2_iso_url_base)
          specific_host: $(hosts)
          s3_region: AU
          s3_host: $(au2_pure_host)
        au2-prod-elastic-bunker-1:
          enabled: $(au2-prod-elastic-bunker-1_enabled)
          dc: AU2
          hall: A
          xcc_user: $(au2_xcc_user)
          iso_url_base: $(au2_iso_url_base)
          specific_host: $(hosts)
          s3_region: AU
          s3_host: $(au2_pure_host)
        de1-prod-frontend-1:
          enabled: $(de1-prod-frontend-1_enabled)
          dc: DE1
          hall: A
          xcc_user: $(de1_xcc_user)
          iso_url_base: $(de1_iso_url_base)
          specific_host: $(hosts)
          s3_region: DE
          s3_host: $(de1_pure_host)
        de1-prod-internal-1:
          enabled: $(de1-prod-internal-1_enabled)
          dc: DE1
          hall: A
          xcc_user: $(de1_xcc_user)
          iso_url_base: $(de1_iso_url_base)
          specific_host: $(hosts)
          s3_region: DE
          s3_host: $(de1_pure_host)
        de1-prod-elastic-bunker-1:
          enabled: $(de1-prod-elastic-bunker-1_enabled)
          dc: DE1
          hall: A
          xcc_user: $(de1_xcc_user)
          iso_url_base: $(de1_iso_url_base)
          specific_host: $(hosts)
          s3_region: DE
          s3_host: $(de1_pure_host)
        us2-prod-frontend-1:
          enabled: $(us2-prod-frontend-1_enabled)
          dc: US2
          hall: A
          xcc_user: $(us2_xcc_user)
          iso_url_base: $(us2_iso_url_base)
          specific_host: $(hosts)
          s3_region: US
          s3_host: $(us2_pure_host)
        us2-prod-elastic-bunker-1:
          enabled: $(us2-prod-elastic-bunker-1_enabled)
          dc: US2
          hall: A
          xcc_user: $(us2_xcc_user)
          iso_url_base: $(us2_iso_url_base)
          specific_host: $(hosts)
          s3_region: US
          s3_host: $(us2_pure_host)
        us2-corp-internal-1:
          enabled: $(us2-corp-internal-1_enabled)
          dc: US2
          hall: A
          xcc_user: $(us2_xcc_user)
          iso_url_base: $(us2_iso_url_base)
          specific_host: $(hosts)
          s3_region: US
          s3_host: $(us2_pure_host)
    pool:
      name: dante
      demands:
        - WTG_DC -equals $(dc)
        - WTG_HALL -equals $(hall)

    timeoutInMinutes: 240
    steps:
      - checkout: self

      - script: |
          echo "Running $(Build.CronSchedule.DisplayName)"
          if [ "$(Build.CronSchedule.DisplayName)" = "AU2 sand cluster maintenance" ]; then
            echo "##vso[task.setvariable variable=au2-sand-internal-1_enabled]enabled"
          elif [ "$(Build.CronSchedule.DisplayName)" = "AU2 prod cluster maintenance" ]; then
            echo "##vso[task.setvariable variable=au2-prod-internal-1_enabled]enabled"
            echo "##vso[task.setvariable variable=trigger_next_enabled]enabled"
          elif [ "$(Build.CronSchedule.DisplayName)" = "DE1 and US2 prod cluster maintenance" ]; then
            echo "##vso[task.setvariable variable=de1-prod-internal-1_enabled]enabled"
            echo "##vso[task.setvariable variable=us2-corp-internal-1_enabled]enabled"
            echo "##vso[task.setvariable variable=trigger_next_enabled]enabled"
          fi
        displayName: 'Set variable for scheduled run'

      - task: InstallSSHKey@0
        displayName: 'Install an SSH key'
        inputs:
          knownHostsEntry: 'StrictHostKeyChecking no'
          sshKeySecureFile: 'id_rsa_dante'

      - script: |
          set -euxo pipefail
          pip install -r requirements.txt
          git config --global --unset-all http.https://dev.azure.com/.extraheader || true
          git config --global http.https://dev.azure.com/.extraheader "AUTHORIZATION: bearer $(System.AccessToken)"
          ansible-galaxy install -r ansible/requirements.yml --force
        displayName: 'Install Dante requirements'
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      - script: |
          git config --global --unset-all http.https://dev.azure.com/.extraheader || true
        displayName: 'Cleanup Git credentials'
        condition: always()

      # virgil_build_id is retrieved from artifacts.yml and is used to DL the Virgil pipeline artifact
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Virgil inventories'
        inputs:
          buildType: 'specific'
          project: 'InfrastructureAutomation'
          # virgil pipeline Id
          pipeline: 4
          artifact: inventories
          buildVersionToDownload: 'specific'
          buildId: '$(virgil_build_id)'
          path: $(Build.SourcesDirectory)/inventories
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      - task: DownloadPipelineArtifact@2
        displayName: 'Download Dante artifact'
        inputs:
          buildType: 'specific'
          project: 'InfrastructureAutomation'
          # dante build artifact pipeline Id
          pipeline: 26
          buildVersionToDownload: 'specific'
          buildId: '$(dante_build_id)'
          path: $(Build.SourcesDirectory)
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      # This task must run before the cp ansible.cfg and group_vars script
      - task: CopyFiles@2
        displayName: 'Merge dante artifacts to a single roles folder'
        inputs:
          SourceFolder: iris
          Contents: '**'
          TargetFolder: ansible
          OverWrite: false
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      - script: |
          set -euxo pipefail
          test -f inventories/inventory-$(dc)-$(hall).yaml
          cp ansible/ansible.cfg .
          cp -r ansible/group_vars ansible/play_maintenance
          cp -r ansible/group_vars ansible/maintenance
        displayName: 'Prepare to run playbooks'
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      - task: AzureKeyVault@2
        displayName: 'Get secrets from Azure KV'
        inputs:
          azureSubscription: 'sc-azuredevops2dante-vaults'
          KeyVaultName: '$(key_vault_name)'
          SecretsFilter: secretAppIdDf4b4604e176
          RunAsPreJob: false
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      - task: Ansible@0
        displayName: 'Select IRIS nodes'
        inputs:
          ansibleInterface: 'agentMachine'
          playbookPathOnAgentMachine: 'ansible/play_maintenance/select_iris_node_maintenance.yaml'
          inventoriesAgentMachine: 'file'
          inventoryFileOnAgentMachine: 'inventories/inventory-$(dc)-$(hall).yaml'
          failOnStdErr: false
          args: >-
            -u dante --diff
            -e="dc=$(dc)"
            -e="cluster_name=$(System.JobName)"
            -e="specific_host=$(specific_host)"
            -e="cluster_enabled=$(enabled)"
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      - script: |
          selected_iris_node=$(<ansible/play_maintenance/selected_iris_node.txt)
          echo "##vso[task.setvariable variable=selected_node]$selected_iris_node"
          echo "Selected node: $selected_iris_node"
        displayName: "Set selected node"
        condition: or(ne(variables['specific_host'], ''), eq(variables['enabled'], 'enabled'))

      - task: Ansible@0
        displayName: 'Build and publish ISO to Pure'
        inputs:
          ansibleInterface: 'agentMachine'
          playbookPathOnAgentMachine: 'ansible/create_and_publish_autoinstall_iso.yaml'
          inventoriesAgentMachine: 'file'
          inventoryFileOnAgentMachine: 'inventories/inventory-$(dc)-$(hall).yaml'
          failOnStdErr: false
          args: >-
            -u dante --diff -e="s3_host=$(s3_host)" -e="s3_region=$(s3_region)"
            -e="{simulation: false}"
            -e="key_vault_name=$(key_vault_name)"
            --limit="localhost,$(selected_node)"
        env:
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: and(succeeded(), ne(variables['selected_node'], ''))

      - task: Ansible@0
        displayName: "Maintenance pre-checks"
        inputs:
          ansibleInterface: 'agentMachine'
          playbookPathOnAgentMachine: 'ansible/iris_pre_checks.yaml'
          inventoriesAgentMachine: 'file'
          inventoryFileOnAgentMachine: 'data/instances'
          failOnStdErr: false
          args: >-
            -u dante --diff -e="dc=$(dc)" -e="hall=$(hall)"
            -e="s3_region=$(s3_region)"
            -e="s3_host=$(s3_host)"
            -e="specific_host=$(selected_node)"
            -e="key_vault_name=$(key_vault_name)"
            -e="cluster_name=$(System.JobName)"
            -e"{simulation: false}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: and(succeeded(), ne(variables['selected_node'], ''), ne(variables['skip_pre_checks'], 'true'))

      - task: Ansible@0
        displayName: 'Generate extra inventory files'
        inputs:
          playbookPathOnAgentMachine: 'ansible/play_maintenance/generate_extra_inv.yaml'
          inventoriesAgentMachine: file
          inventoryFileOnAgentMachine: 'inventories/inventory-$(dc)-$(hall).yaml'
          args: >-
            --diff -e="dc=$(dc)" -e="xcc_user=$(xcc_user)"
            -e="key_vault_name=$(key_vault_name)"
            --limit="$(selected_node)"
          failOnStdErr: false
        env:
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: and(succeeded(), ne(variables['selected_node'], ''))

      - task: Ansible@0
        displayName: 'Set maintenance mode for the node'
        inputs:
          ansibleInterface: 'agentMachine'
          playbookPathOnAgentMachine: 'ansible/maintenance/set_maintenance_mode.yaml'
          failOnStdErr: false
          args: >-
            -e="key_vault_name=$(key_vault_name)"
            -e="hosts=$(selected_node)"
            -e="s3_host=$(s3_host)"
            -e="s3_region=$(s3_region)"
            -e="maintenance_period=$(maintenance_period)"
            -e="comments=$(comments)"
        env:
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: and(succeeded(), ne(variables['selected_node'], ''))

      - task: Ansible@0
        displayName: 'XClarity maintenance'
        inputs:
          playbookPathOnAgentMachine: 'ansible/play_maintenance/xclarity_maintenance.yaml'
          inventoriesAgentMachine: file
          inventoryFileOnAgentMachine: 'inventories/inventory-$(dc)-$(hall).yaml'
          args: >-
            -u dante --diff
            -i "ansible/play_maintenance/extra_inventory/"
            -e="cluster_name=$(System.JobName)"
            -e="xcc_user=$(xcc_user)"
            -e="s3_host=$(s3_host)"
            -e="dc=$(dc)"
            -e="ansible_ssh_extra_args='-o PreferredAuthentications=password'"
            -e="key_vault_name=$(key_vault_name)"
            -e="specific_host=$(selected_node)"
            --limit="$(selected_node)"
          failOnStdErr: false
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: and(succeeded(), ne(variables['selected_node'], ''))

      - task: Ansible@0
        displayName: 'Generate extra inventory files'
        inputs:
          playbookPathOnAgentMachine: 'ansible/play_maintenance/generate_extra_inv.yaml'
          inventoriesAgentMachine: file
          inventoryFileOnAgentMachine: 'inventories/inventory-$(dc)-$(hall).yaml'
          args: >-
            --diff -e="dc=$(dc)" -e="xcc_user=$(xcc_user)"
            -e="key_vault_name=$(key_vault_name)"
            --limit="$(selected_node)"
          failOnStdErr: false
        env:
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: and(succeeded(), ne(variables['selected_node'], ''))

      # Dante will reboot when installing new packages so will dc the connection and fail.
      # Increase ssh retries so will timeout at 1106s == 18m26s
      - task: Ansible@0
        displayName: 'IRIS maintenance run for $(System.JobName) in $(dc) hall $(hall)'
        inputs:
          ansibleInterface: 'agentMachine'
          playbookPathOnAgentMachine: 'ansible/play_maintenance/iris_node_maintenance.yaml'
          inventoriesAgentMachine: 'file'
          inventoryFileOnAgentMachine: 'inventories/inventory-$(dc)-$(hall).yaml'
          failOnStdErr: false
          args: >-
            -u dante --diff -e="dc=$(dc)" -e="hall=$(hall)"
            -i "ansible/play_maintenance/extra_inventory/"
            -e="s3_region=$(s3_region)"
            -e="s3_host=$(s3_host)"
            -e="iso_url_base=$(iso_url_base)"
            -e="xcc_user=$(xcc_user)"
            -e="specific_host=$(selected_node)"
            -e="key_vault_name=$(key_vault_name)"
            -e="host_delay=$(host_delay)"
            -e="ad_domain=$(ad_domain)"
            -e="cluster_name=$(System.JobName)"
            -e="skip_pre_checks=$(skip_pre_checks)"
            -e"{simulation: false}"
            -e="ansible_ssh_extra_args='-o PreferredAuthentications=password'"
            --limit="$(selected_node)"
        env:
          ANSIBLE_SSH_RETRIES: 40
          ANSIBLE_HOST_KEY_CHECKING: false
          secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
        condition: and(succeeded(), ne(variables['selected_node'], ''))

      - task: Ansible@0
        displayName: 'Trigger next maintenance'
        inputs:
          playbookPathOnAgentMachine: 'ansible/play_maintenance/trigger_next_maintenance.yaml'
          inventoriesAgentMachine: file
          inventoryFileOnAgentMachine: 'inventories/inventory-$(dc)-$(hall).yaml'
          args: >-
            --diff -e="dc=$(dc)"
            -e="cluster_name=$(System.JobName)"
          failOnStdErr: false
        env:
          azure_devops_token: $(System.AccessToken)
        condition: and(succeeded(), ne(variables['selected_node'],''), eq(variables['trigger_next_enabled'],'enabled'))
