---
trigger: none

schedules:
  - cron: "0 * * * *"
    displayName: Every hour Automatic IIS data collection
    batch: true
    always: true
    branches:
      include:
        - master

variables:
  - template: artifacts.yml
  - name: key_vault_name
    value: kv-wtg-iris-prod
  - name: merge_dc
    value: AU2
  - name: username
    value: "WTGOps"
  - name: email
    value: "wtgops@wisetechglobal.com"
  - name: repository
    value: iris
  - name: branch_name
    value: automatic_sites_data_upload
  - name: target_branch
    value: master

stages:
  - stage: Update_IIS_Data
    jobs:
      - job: Update_IIS_Data
        pool:
          name: dante
          demands:
            - WTG_DC -equals $(agent_dc)
        strategy:
          matrix:
            AU2:
              dc: AU2
              agent_dc: AU2
            CN1:
              dc: CN1
              agent_dc: AU2
            DE1:
              dc: DE1
              agent_dc: DE1
            SA1:
              dc: SA1
              agent_dc: AU2
            US2:
              dc: US2
              agent_dc: DE1
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              set -euxo pipefail
              pip install -r requirements.txt
            displayName: 'Install requirements'

          - task: AzureKeyVault@2
            displayName: 'Get secrets from Azure KV'
            inputs:
              azureSubscription: 'sc-azuredevops2dante-vaults'
              KeyVaultName: '$(key_vault_name)'
              SecretsFilter: secretAppIdDf4b4604e176
              RunAsPreJob: false

          - script: |
              set -euxo pipefail
              pip install --pre azure-cli --extra-index-url https://azurecliprod.blob.core.windows.net/edge
              pip install --upgrade azure-core
            displayName: "Upgrade Azure CLI"

          - script: |
              set -euxo pipefail
              az extension add --upgrade --yes --name azure-devops
            displayName: "Add Azure-DevOps extension"

          - script: |
              set -euxo pipefail
              echo $(System.AccessToken) | az devops login
            displayName: "Login via Azure DevOps CLI"

          - script: |
              set -euxo pipefail
              az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) \
                project="$(System.TeamProject)"
            displayName: "Configure defaults for Azure DevOps organisation and project"

          - script: |
              set -euxo pipefail
              git config --global user.name $(username)
              git config --global user.email $(email)
            displayName: "Configure git globals"

          - task: DownloadPipelineArtifact@2
            displayName: 'Download dante artifact'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # dante build artifact pipeline Id
              pipeline: 26
              buildVersionToDownload: 'specific'
              buildId: '$(dante_build_id)'
              path: $(Build.SourcesDirectory)

          - task: CopyFiles@2
            displayName: 'Merge artifacts to a single roles folder'
            inputs:
              sourceFolder: iris
              targetFolder: ansible

          - task: Ansible@0
            displayName: 'Colect sites data and Render Dynamic backends'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/collect_and_process_sites_data.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'data/instances'
              failOnStdErr: false
              args: >-
                --diff
                -e="winrm_password=$(winrm_password)"
                -e="key_vault_name=$(key_vault_name)"
                -e="target_dc=$(dc)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

          - script: |
              set -euxo pipefail
              DC_LOWER=$(echo "$(dc)" | tr '[:upper:]' '[:lower:]')
              ARTIFACT_DIR="$(Pipeline.Workspace)/autogenerated_$(dc)"

              mkdir -p "$ARTIFACT_DIR"
              rm -f "$ARTIFACT_DIR"/*

              find data/autogenerated -maxdepth 1 -type f -name "${DC_LOWER}*" -exec cp {} "$ARTIFACT_DIR"/ \;
              touch "$ARTIFACT_DIR/.artifact-marker"
            displayName: "Prepare autogenerated artifact for $(dc)"

          - publish: $(Pipeline.Workspace)/autogenerated_$(dc)
            artifact: autogenerated_$(dc)
            displayName: "Publish autogenerated artifact for $(dc)"

      - job: Create_Update_PR
        dependsOn: Update_IIS_Data
        condition: succeeded()
        pool:
          name: dante
          demands:
            - WTG_DC -equals $(merge_dc)
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              set -euxo pipefail
              pip install --pre azure-cli --extra-index-url https://azurecliprod.blob.core.windows.net/edge
              pip install --upgrade azure-core
            displayName: "Upgrade Azure CLI"

          - script: |
              set -euxo pipefail
              az extension add --upgrade --yes --name azure-devops
            displayName: "Add Azure-DevOps extension"

          - script: |
              set -euxo pipefail
              echo $(System.AccessToken) | az devops login
            displayName: "Login via Azure DevOps CLI"

          - script: |
              set -euxo pipefail
              az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) \
                project="$(System.TeamProject)"
            displayName: "Configure defaults for Azure DevOps organisation and project"

          - script: |
              set -euxo pipefail
              git config --global user.name $(username)
              git config --global user.email $(email)
            displayName: "Configure git globals"

          - script: |
              set -euxo pipefail
              git fetch origin $(target_branch)
              git branch -D $(branch_name) 2>/dev/null || true
              git checkout -b $(branch_name) origin/$(target_branch)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download autogenerated artifacts'
            inputs:
              buildType: 'current'
              targetPath: $(Pipeline.Workspace)/autogenerated_artifacts

          - script: |
              set -euxo pipefail

              mkdir -p data/autogenerated

              for artifact_dir in "$(Pipeline.Workspace)"/autogenerated_artifacts/autogenerated_*; do
                [[ -d "$artifact_dir" ]] || continue

                DC=$(basename "$artifact_dir" | sed 's/^autogenerated_//')
                DC_LOWER=$(echo "$DC" | tr '[:upper:]' '[:lower:]')

                rm -f data/autogenerated/${DC_LOWER}*
                find "$artifact_dir" -maxdepth 1 -type f ! -name '.artifact-marker' -exec cp {} data/autogenerated/ \;
              done

              if git diff --quiet origin/$(target_branch) -- data/autogenerated/; then
                echo -n "$(date) INFO - There is no difference between commits."
                set +x
                echo "##vso[task.setvariable variable=changed]no"
                exit 0
              fi

              git add data/autogenerated/
              git commit -m "Automated Update of sites data"
              git push -f origin $(branch_name)
              echo -n "$(date) INFO - There is a difference between commits. Attempt to create PR."
              set +x
              echo "##vso[task.setvariable variable=changed]yes"
            displayName: 'Merge DC data and Push Commit'

          - script: |
              az repos pr list \
                --source-branch $(branch_name) \
                --target-branch $(target_branch) | jq -e '.[0]'

              if [[ $? -ne 0 ]]; then
                az repos pr create \
                  --auto-complete true \
                  --repository $(repository) \
                  --source-branch $(branch_name) \
                  --target-branch $(target_branch) --delete-source-branch true \
                  --title "Automated IIS data upload"
                exit 0
              else
                echo "No PR created as it already exists"
              fi
            condition: and(succeeded(), eq(variables['changed'], 'yes'))
            displayName: "Create PR and Set Auto-Complete"
