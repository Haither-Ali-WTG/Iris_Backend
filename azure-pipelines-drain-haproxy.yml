---
trigger: none

variables:
  - name: user
    value: dante

stages:
  - stage: Drain IRIS Node
    pool:
      name: dante
      demands:
        - WTG_DC -equals AU2
        - WTG_HALL -equals A
    jobs:
    - job:
      timeoutInMinutes: 20
      steps:
        - checkout: self

        - script: |
            set -euxo pipefail
            pip install -r requirements.txt
          displayName: 'Install requirements'

        - script: |
            set -euxo pipefail
            cp ansible/ansible.cfg .
          displayName: 'Prepare to run playbooks'

        - task: Ansible@0
          displayName: 'Drain haproxy'
          inputs:
            ansibleInterface: 'agentMachine'
            playbookPathOnAgentMachine: 'ansible/drain_haproxy.yml'
            inventoriesAgentMachine: 'file'
            inventoryFileOnAgentMachine: 'data/instances'
            failOnStdErr: false
            args: >-
              -u $(user) --diff
              -e="drain_host=$(drain_host)"
