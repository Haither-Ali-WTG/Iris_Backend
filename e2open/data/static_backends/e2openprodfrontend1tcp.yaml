  clustered_instances: [e2openprodfrontend1tcp]
  http_health_check:
    enabled: false
  servers:
    - name: e2open-sftp-1
      ip: 147.189.32.136
      port: 22
    - name: e2open-sftp-2
      ip: 147.189.32.137
      port: 22

e2open-sftp-proxy:
  clustered_instances: [e2openprodfrontend1tcp]
