---
clustered_instances:
  hosts:
    e2openprodinternaltcp:
      dc: DE1
      defaults:
        mode: tcp
      frontend:
        maxconn: 20000
        ports:
          plaintext:
            - 2001
            - 2002
      iis_servers: []
      certificates: []
      sqlbilling_acl: []
      machine_cluster: e2open-prod-internal-1
      stats:
        ports:
          web: 2048
          socket: 2049
      container:
        resources:
          production:
            cpu: 2000m
            memory: 4000Mi
