---
clustered_instances:
  hosts:
    e2openprodfrontend1tcp:
      dc: DE1
      defaults:
        mode: tcp
      frontend:
        maxconn: 20000
        ports:
          plaintext:
            - 2001  # SFTP
            - 2002  # XMPP
            - 2003  # hh1.art.e2open.com
      iis_servers: []
      certificates: []
      sqlbilling_acl: []
      machine_cluster: e2open-prod-frontend-1
      stats:
        ports:
          web: 6001
          socket: 6002
      container:
        resources:
          production:
            cpu: 2000m
            memory: 4000Mi
