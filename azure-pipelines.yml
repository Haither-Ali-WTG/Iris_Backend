---
# Configuration for Azure DevOps build pipeline
trigger: none

variables:
  - template: artifacts.yml
  - name: user
    value: dante
  - name: azure_kv_name
    value: kv-wtg-iris-prod

resources:
  repositories:
    - repository: master_branch
      type: git
      name: iris
      ref: refs/heads/master

stages:
  - stage: Tests_and_lint
    pool: cicd-v2
    jobs:
      - job: Tests_and_lint_job
        steps:
          - script: |
              git fetch origin master

              CHANGED=$(git diff --name-only origin/master...HEAD)

              echo "Changed files:"
              echo "$CHANGED"

              declare -A DCS
              OTHER=false

              while IFS= read -r f; do
                case "$f" in
                  data/autogenerated/au2*) DCS[AU2]=1 ;;
                  data/autogenerated/de1*) DCS[DE1]=1 ;;
                  data/autogenerated/us2*) DCS[US2]=1 ;;
                  data/autogenerated/cn1*) DCS[CN1]=1 ;;
                  data/autogenerated/sa1*) DCS[SA1]=1 ;;
                  e2open/*) DCS[E2OPEN]=1 ;;
                  *) OTHER=true ;;
                esac
              done <<< "$CHANGED"

              emit_dc () {
                local dc=$1; shift
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  MATRIX="$MATRIX,"
                fi
                MATRIX="$MATRIX\"$dc\":{"
                local first=1
                for kv in "$@"; do
                  [ $first -eq 1 ] || MATRIX="$MATRIX,"
                  first=0
                  MATRIX="$MATRIX\"${kv%%=*}\":\"${kv#*=}\""
                done
                MATRIX="$MATRIX}"
              }

              add_dc () {
                case "$1" in
                  AU2)
                    emit_dc AU2 \
                      simulation_label=AU2 \
                      simulation_dc=AU2 \
                      data_root=iris/data \
                      s3_host=au2s3-2.wtg.ws \
                      s3_iris_bucket=s3://au-iscore-iris-prod-1/ \
                      pure_usernames=au-iscore-iris-prod-1-ro \
                      enable_cms_cert_check=true \
                      enable_sqlbilling_acl=true \
                      deploy_telegraf=true
                    ;;
                  DE1)
                    emit_dc DE1 \
                      simulation_label=DE1 \
                      simulation_dc=DE1 \
                      data_root=iris/data \
                      s3_host=de1s3-2.wtg.ws \
                      s3_iris_bucket=s3://de-iscore-iris-prod-1/ \
                      pure_usernames=de-iscore-iris-prod-1-ro \
                      enable_cms_cert_check=true \
                      enable_sqlbilling_acl=true \
                      deploy_telegraf=true
                    ;;
                  US2)
                    emit_dc US2 \
                      simulation_label=US2 \
                      simulation_dc=US2 \
                      data_root=iris/data \
                      s3_host=us2s3-2.wtg.ws \
                      s3_iris_bucket=s3://us-iscore-iris-prod-1/ \
                      pure_usernames=us-iscore-iris-prod-1-ro \
                      enable_cms_cert_check=true \
                      enable_sqlbilling_acl=true \
                      deploy_telegraf=true
                    ;;
                  CN1)
                    emit_dc CN1 \
                      simulation_label=CN1 \
                      simulation_dc=CN1 \
                      data_root=iris/data \
                      s3_host=au2s3-2.wtg.ws \
                      s3_iris_bucket=s3://au-iscore-iris-prod-1/ \
                      pure_usernames=au-iscore-iris-prod-1-ro \
                      enable_cms_cert_check=true \
                      enable_sqlbilling_acl=true \
                      deploy_telegraf=true
                    ;;
                  SA1)
                    emit_dc SA1 \
                      simulation_label=SA1 \
                      simulation_dc=SA1 \
                      data_root=iris/data \
                      s3_host=au2s3-2.wtg.ws \
                      s3_iris_bucket=s3://au-iscore-iris-prod-1/ \
                      pure_usernames=au-iscore-iris-prod-1-ro \
                      enable_cms_cert_check=true \
                      enable_sqlbilling_acl=true \
                      deploy_telegraf=true
                    ;;
                  E2OPEN)
                    emit_dc E2OPEN \
                      simulation_label=E2OPEN \
                      simulation_dc=e2open-ham \
                      data_root=iris/e2open/data \
                      s3_host=de1s3-2.wtg.ws \
                      s3_iris_bucket=s3://de-iscore-iris-prod-1/ \
                      pure_usernames=de-iscore-iris-prod-1-ro \
                      enable_cms_cert_check=false \
                      enable_sqlbilling_acl=false \
                      deploy_telegraf=false
                    ;;
                esac
              }

              if [ "$OTHER" = "true" ]; then
                MATRIX="{"
                FIRST=true
                add_dc AU2
                add_dc DE1
                add_dc US2
                add_dc CN1
                add_dc SA1
                add_dc E2OPEN
                MATRIX="$MATRIX}"
              else
                MATRIX="{"
                FIRST=true
                for dc in "${!DCS[@]}"; do
                  add_dc "$dc"
                done
                MATRIX="$MATRIX}"
              fi

              echo "Matrix JSON:"
              echo "$MATRIX"

              echo "##vso[task.setvariable variable=matrix;isOutput=true]$MATRIX"

            name: SetVariables
            displayName: "Set Pipeline Variables"

          - script: |
              set -euxo pipefail
              pip install -r requirements.txt
            displayName: 'Install requirements'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download virgil inventories and yamale extensions'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # virgil pipeline Id
              pipeline: 4
              artifact: inventories
              buildVersionToDownload: 'specific'
              buildId: '$(virgil_build_id)'
              path: $(Build.SourcesDirectory)/inventories
              patterns: |
                inventory-*-A.yaml
                virgil_yamale.py

          - script: |
              set -euxo pipefail
              pytest --tb=short
            displayName: 'Python tests'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: 'reports/nosetests.xml'

          - script: |
              set -euxo pipefail
              pylint --rcfile=setup.cfg \
              --disable=redefined-outer-name \
              tests/ ansible/roles/iris_haproxy/files/*.py \
              ansible/roles/collect_sites/files/*.py \
              ansible/roles/collect_sites_from_weborc/files/*.py
            displayName: 'Python lint'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              mypy tests/ ansible/roles/collect_sites/files/ \
              ansible/roles/collect_sites_from_weborc/files/
            displayName: 'Mypy type check'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              yamllint -s .
            displayName: 'YAML lint'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              bandit -r .
            displayName: 'Bandit security check'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              ansible-lint $(find ansible -iname '*.y*ml')
            displayName: 'Ansible lint'
            condition: succeededOrFailed()

      - job: Simulations
        dependsOn: [Tests_and_lint_job]
        strategy:
          matrix: $[ dependencies.Tests_and_lint_job.outputs['SetVariables.matrix'] ]
        pool:
          name: simulations
          demands:
            - ALLOW_HEAVY_LOADS -equals yes
        steps:
          - checkout: master_branch
            path: master_worktree
            clean: false
            displayName: 'Checkout master branch to master_worktree'

          - checkout: self
            path: s/iris
            clean: false
            displayName: 'Checkout self'

          - task: AzureKeyVault@2
            displayName: 'Get secret to authenticate to key vault from ansible'
            inputs:
              azureSubscription: 'sc-azuredevops2dante-vaults'
              KeyVaultName: kv-wtg-dante-sim
              SecretsFilter: secretAppIdDf4b4604e176

          - script: |
              set -euxo pipefail
              echo "##vso[task.setvariable variable=certificate_changed]false"
              echo "##vso[task.setvariable variable=new_cms_certs][]"
            displayName: 'Default cert-check variables'

          - script: |
              set -euxo pipefail
              pip install -r iris/requirements.txt
            displayName: 'Install requirements'

          - script: |
              set -euxo pipefail
              cp iris/ansible/ansible.cfg .
            displayName: 'Prepare to run playbooks'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download dante artifact'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # dante build artifact pipeline Id
              pipeline: 26
              buildVersionToDownload: 'specific'
              buildId: '$(dante_build_id)'
              path: $(Build.SourcesDirectory)/dante

          - task: DownloadPipelineArtifact@2
            displayName: 'Download sqlbilling artifacts for ACL'
            inputs:
              buildType: 'specific'
              project: 'ISOperations'
              # https://dev.azure.com/WTGOps/ISOperations/_build?definitionId=239
              pipeline: 239
              artifact: sqlbilling
              buildVersionToDownload: 'specific'
              buildId: '$(sqlbilling_build_id)'
              path: $(Build.SourcesDirectory)/sqlbilling_acl
              patterns: 'acl/*.acl'
            condition: and(succeeded(), eq(variables['enable_sqlbilling_acl'], 'true'))

          - task: CopyFiles@2
            displayName: 'Merge artifacts to a single roles folder'
            inputs:
              sourceFolder: dante/iris
              targetFolder: iris/ansible

          - task: InstallSSHKey@0
            displayName: 'Install an SSH key'
            inputs:
              knownHostsEntry: 'StrictHostKeyChecking no'
              sshKeySecureFile: 'id_rsa'

          - script: |
              set -euxo pipefail

              echo "##vso[task.setvariable variable=certificate_changed]true"

              DC_LOWER=$(echo "$(simulation_dc)" | tr '[:upper:]' '[:lower:]')

              FILE="data/certificates_audit/${DC_LOWER}-certificates.yaml"
              # Check if the audit file changed between master and PR
              if diff -q "../master_worktree/$FILE" "iris/$FILE" >/dev/null 2>&1; then
                echo "Certificates unchanged in ${DC_LOWER}-certificates.yaml"
                echo "##vso[task.setvariable variable=certificate_changed]false"
              else
                echo "Certificates changed in ${DC_LOWER}-certificates.yaml"
              fi
            displayName: 'Check if the certificate section changed'
            condition: and(succeeded(), eq(variables['enable_cms_cert_check'], 'true'))

          - script: |
              set -euxo pipefail

              DC_LOWER=$(echo "$(simulation_dc)" | tr '[:upper:]' '[:lower:]')
              REL="data/instances/${DC_LOWER}-clustered_instances.yml"
              NEW_FILE="iris/${REL}"
              OLD_FILE="../master_worktree/${REL}"

              # Compute the list of newly added (name, cms_resource_group) certificate
              # pairs in the clustered_instances file vs. master. Emits a JSON array
              # of {name, cms_resource_group} dicts.
              NEW_CMS_CERTS=$(NEW_FILE="$NEW_FILE" OLD_FILE="$OLD_FILE" python3 - <<'PY'
              import json
              import os
              import yaml

              def extract(path):
                  if not path or not os.path.exists(path):
                      return set()
                  with open(path, 'r', encoding='utf-8') as f:
                      data = yaml.safe_load(f)
                  certs = set()
                  if not data or 'clustered_instances' not in data:
                      return certs
                  hosts = (data['clustered_instances'] or {}).get('hosts', {}) or {}
                  for host_data in hosts.values():
                      if not host_data:
                          continue
                      for cert in host_data.get('certificates', []) or []:
                          if not isinstance(cert, dict):
                              continue
                          if cert.get('file_name'):
                              continue
                          name = cert.get('name')
                          rg = cert.get('cms_resource_group')
                          if name and rg:
                              certs.add((name, rg))
                  return certs

              new_certs = extract(os.environ['NEW_FILE'])
              old_certs = extract(os.environ['OLD_FILE'])
              added = sorted(new_certs - old_certs)
              print(json.dumps(
                  [{'name': n, 'cms_resource_group': rg} for n, rg in added]
              ))
              PY
              )

              echo "New CMS certs: $NEW_CMS_CERTS"
              echo "##vso[task.setvariable variable=new_cms_certs]$NEW_CMS_CERTS"
            displayName: 'Compute newly added CMS certificates vs master'
            condition: and(succeeded(), eq(variables['enable_cms_cert_check'], 'true'))

          - task: Ansible@0
            displayName: 'Check and save certificates'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'iris/ansible/check_and_save_certificates_cms.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: '$(data_root)/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e "{check_all_certs: $(certificate_changed) }"
                -e '{new_cms_certs: $(new_cms_certs)}'
                -e="{simulation: true}" -e="azure_kv_name=$(azure_kv_name)"
                -e="target_dc=$(simulation_dc)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
            condition: and(succeeded(), eq(variables['enable_cms_cert_check'], 'true'))

          - task: Bash@3
            displayName: 'Test haproxy'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                exec ansible-playbook \
                  iris/ansible/test_haproxy.yml \
                  -i $(data_root)/instances \
                  -u $(user) \
                  -e="azure_kv_name=$(azure_kv_name)" \
                  -e="build_id=$(Build.BuildId)$(System.JobAttempt)" \
                  -e="{instance_auto_restart_allowed: $(instance_auto_restart_allowed)}" \
                  -e="s3_host=$(s3_host)" -e="pure_usernames=$(pure_usernames)" \
                  -e="s3_iris_bucket=$(s3_iris_bucket)" \
                  -e="s3_proxy_host=192.168.255.254" -e="s3_proxy_port=3128" \
                  -e="sqlbilling_acl_dir=$(Build.SourcesDirectory)/sqlbilling_acl/acl" \
                  -e="target_dc=$(simulation_dc)" \
                  -e="iris_data_dir=$(Build.SourcesDirectory)/$(data_root)" \
                  -e="apt_mirror=$(apt_mirror)" \
                  -e "{check_all_certs: $(certificate_changed) }" \
                  -e "{deploy_telegraf: $(deploy_telegraf)}" \
                  -e "{simulation: true}"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
              ANSIBLE_DISPLAY_SKIPPED_HOSTS: $(ansible_display_skipped_hosts)
              ANSIBLE_DISPLAY_OK_HOSTS: $(ansible_display_ok_hosts)
              ANSIBLE_DIFF_ALWAYS: $(ansible_diff_always)

          - publish: $(Build.SourcesDirectory)/iris/generated_configs/$(simulation_dc)
            artifact: configs_$(simulation_label)_attempt$(System.JobAttempt)
            displayName: 'Publish configs for $(simulation_dc)'
            condition: always()

          - task: Ansible@0
            displayName: 'Unregister nodes'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'iris/ansible/unregister_nodes.yaml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: '$(data_root)/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="azure_kv_name=$(azure_kv_name)"
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="target_dc=$(simulation_dc)"
                -e="iris_data_dir=$(Build.SourcesDirectory)/$(data_root)"
                -e "{simulation: true}"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
            condition: always()

          - task: Ansible@0
            displayName: 'Cleanup'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'iris/ansible/simulation_cleanup.yaml'
              failOnStdErr: false
              args: >-
                -u $(user) --diff -e="pool=/mnt/storage/test_pool" -e="iso_path=/mnt/storage/iso"
            condition: always()
