---
# Configuration for Azure DevOps build pipeline
trigger: none

variables:
- template: artifacts.yml
- name: user
  value: dante
- name: inventory_list
  value: ~

stages:
# - stage: Tests_and_lint
#   pool: cicd
#   jobs:
#   - job: Tests_and_lint
#     steps:
#     - script: |
#         set -euxo pipefail
#         pip install -r requirements.txt
#       displayName: 'Install requirements'


- stage: Simulations
  # dependsOn: [Tests_and_lint]
  # pool: test-pool
  pool: cicd
  jobs:
  - job: Simulation
    steps:
    - script: |
        set -euxo pipefail
        pip install -r requirements.txt
      displayName: 'Install requirements'


  - script: |
      echo $(inventory_list)
    displayName: First variable pass

  - bash: echo "##vso[task.setvariable variable=inventory_list]secondValue"
    displayName: Set new variable value

  - script: |
      echo $(inventory_list)
    displayName: Second variable pass

    # - script: |
    #     set -euxo pipefail
    #     pip install -r requirements.txt
    #   displayName: 'Build inventory list'

    - task: Ansible@0
      displayName: 'Test haproxy'
      inputs:
        ansibleInterface: 'agentMachine'
        playbookPathOnAgentMachine: 'ansible/test_haproxy.yml'
        failOnStdErr: false
        args: >-
          -u $(user) --diff
          -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
          -i instances/au1-prod-frontend-1.yml
          -i instances/au2-prod-ceph-1.yml
