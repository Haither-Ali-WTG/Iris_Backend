---
# Configuration for Azure DevOps build pipeline
trigger: none

variables:
  - template: artifacts.yml
  - name: user
    value: dante
  - name: inventories
    value: ~

stages:
  - stage: Tests_and_lint
    pool: cicd
    jobs:
      - job: Tests_and_lint
        steps:
          - script: |
              set -euxo pipefail
              pip install -r requirements.txt
            displayName: 'Install requirements'

          - script: |
              set -euxo pipefail
              nosetests
            displayName: 'Python tests'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: 'reports/nosetests.xml'

          - script: |
              set -euxo pipefail
              pylint --rcfile=setup.cfg tests/
            displayName: 'Python lint'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              safety check --full-report -i 42923 -i 42926
            # Ignored reports:
            #   - 42923,42926 - CVE-2021-3532 and CVE-2021-3533 - Results of
            #   Ansible async tasks can be leaked to malicious non-privileged users
            #   on the target machine, under some circumstances. However, we do not
            #   have any async tasks in this repo.
            displayName: 'Python Safety vulnerability check'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              yamllint -s .
            displayName: 'YAML lint'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              bandit -r .
            displayName: 'Bandit security check'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              ansible-lint $(find ansible -iname '*.y*ml')
            displayName: 'Ansible lint'
            condition: succeededOrFailed()

- stage: Simulations
  # dependsOn: [Tests_and_lint]
  # pool: test-pool
  pool: cicd
  jobs:
    - job: Simulation
      steps:
        - script: |
            set -euxo pipefail
            pip install -r requirements.txt
          displayName: 'Install requirements'

        - script: |
            inventory_list=""
            inventory_dir=instances
            for entry in "$inventory_dir"/*
            do
              inventory_list="${inventory_list} -i ${entry}"
            done
            echo ${inventory_list}
            echo "##vso[task.setvariable variable=inventories]$inventory_list"
          displayName: Read all inventory files from instances folder

        - task: Ansible@0
          displayName: 'Test haproxy'
          inputs:
            ansibleInterface: 'agentMachine'
            playbookPathOnAgentMachine: 'ansible/test_haproxy.yml'
            failOnStdErr: false
            args: >-
              -u $(user) --diff
              -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
              $(inventories)
