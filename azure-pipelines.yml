---
# Configuration for Azure DevOps build pipeline
trigger: none

variables:
  - template: artifacts.yml
  - name: user
    value: dante
  - name: azure_kv_name
    value: kv-wtg-iris-prod

resources:
  repositories:
    - repository: master_branch
      type: git
      name: iris
      ref: refs/heads/master

stages:
  - stage: Tests_and_lint
    pool: cicd-v2
    jobs:
      - job: Tests_and_lint
        steps:
          - script: |
              set -euxo pipefail
              pip install -r requirements.txt
            displayName: 'Install requirements'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download virgil inventories and yamale extensions'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # virgil pipeline Id
              pipeline: 4
              artifact: inventories
              buildVersionToDownload: 'specific'
              buildId: '$(virgil_build_id)'
              path: $(Build.SourcesDirectory)/inventories
              patterns: |
                inventory-*-A.yaml
                virgil_yamale.py

          - script: |
              set -euxo pipefail
              pytest --tb=short
            displayName: 'Python tests'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: 'reports/nosetests.xml'

          - script: |
              set -euxo pipefail
              pylint --rcfile=setup.cfg \
              --disable=redefined-outer-name \
              tests/ ansible/roles/iris_haproxy/files/*.py \
              ansible/roles/collect_sites/files/*.py \
              ansible/roles/collect_sites_from_weborc/files/*.py
            displayName: 'Python lint'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              mypy tests/ ansible/roles/collect_sites/files/
            displayName: 'Mypy type check'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              yamllint -s .
            displayName: 'YAML lint'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              bandit -r .
            displayName: 'Bandit security check'
            condition: succeededOrFailed()

          - script: |
              set -euxo pipefail
              ansible-lint $(find ansible -iname '*.y*ml')
            displayName: 'Ansible lint'
            condition: succeededOrFailed()

  - stage: Simulations
    dependsOn: [Tests_and_lint]
    pool:
      name: simulations
      demands:
        - ALLOW_HEAVY_LOADS -equals yes
    jobs:
      - job: Simulation
        strategy:
          matrix:
            AU2:
              simulation_dc: AU2
              s3_host: au2s3-2.wtg.ws
              s3_iris_bucket: s3://au-iscore-iris-prod-1/
              pure_usernames: au-iscore-iris-prod-1-ro
            DE1:
              simulation_dc: DE1
              s3_host: de1s3-2.wtg.ws
              s3_iris_bucket: s3://de-iscore-iris-prod-1/
              pure_usernames: de-iscore-iris-prod-1-ro
            US2:
              simulation_dc: US2
              s3_host: us2s3-2.wtg.ws
              s3_iris_bucket: s3://us-iscore-iris-prod-1/
              pure_usernames: us-iscore-iris-prod-1-ro
            CN1:
              simulation_dc: CN1
              s3_host: au2s3-2.wtg.ws
              s3_iris_bucket: s3://au-iscore-iris-prod-1/
              pure_usernames: au-iscore-iris-prod-1-ro
            SA1:
              simulation_dc: SA1
              s3_host: au2s3-2.wtg.ws
              s3_iris_bucket: s3://au-iscore-iris-prod-1/
              pure_usernames: au-iscore-iris-prod-1-ro
        steps:
          - checkout: master_branch
            path: master_worktree
            clean: false
            displayName: 'Checkout master branch to master_worktree'

          - checkout: self
            path: s/iris
            clean: false
            displayName: 'Checkout self'

          - task: AzureKeyVault@2
            displayName: 'Get secret to authenticate to key vault from ansible'
            inputs:
              azureSubscription: 'sc-azuredevops2dante-vaults'
              KeyVaultName: kv-wtg-dante-sim
              SecretsFilter: secretAppIdDf4b4604e176

          - script: |
              set -euxo pipefail
              pip install -r iris/requirements.txt
            displayName: 'Install requirements'

          - script: |
              set -euxo pipefail
              cp iris/ansible/ansible.cfg .
            displayName: 'Prepare to run playbooks'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download dante artifact'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # dante build artifact pipeline Id
              pipeline: 26
              buildVersionToDownload: 'specific'
              buildId: '$(dante_build_id)'
              path: $(Build.SourcesDirectory)/dante

          - task: DownloadPipelineArtifact@2
            displayName: 'Download sqlbilling artifacts for ACL'
            inputs:
              buildType: 'specific'
              project: 'ISOperations'
              # https://dev.azure.com/WTGOps/ISOperations/_build?definitionId=239
              pipeline: 239
              artifact: sqlbilling
              buildVersionToDownload: 'specific'
              buildId: '$(sqlbilling_build_id)'
              path: $(Build.SourcesDirectory)/sqlbilling_acl
              patterns: 'acl/*.acl'

          - task: CopyFiles@2
            displayName: 'Merge artifacts to a single roles folder'
            inputs:
              sourceFolder: dante/iris
              targetFolder: iris/ansible

          - task: InstallSSHKey@0
            displayName: 'Install an SSH key'
            inputs:
              knownHostsEntry: 'StrictHostKeyChecking no'
              sshKeySecureFile: 'id_rsa'

          - script: |
              set -euxo pipefail

              echo "##vso[task.setvariable variable=certificate_changed]true"

              DC_LOWER=$(echo "$(simulation_dc)" | tr '[:upper:]' '[:lower:]')

              # Extract certificates from instance definition file
              yq '.clustered_instances.hosts[].certificates[]?' \
              iris/data/instances/${DC_LOWER}-clustered_instances.yml > pr_certs.yml || true

              yq '.clustered_instances.hosts[].certificates[]?' \
              ../master_worktree/data/instances/${DC_LOWER}-clustered_instances.yml > master_certs.yml || true

              # Check the difference
              if diff -q master_certs.yml pr_certs.yml >/dev/null 2>&1; then
                echo "Certificates unchanged in ${DC_LOWER}-clustered_instances.yml"
                echo "##vso[task.setvariable variable=certificate_changed]false"
              else
                echo "Certificates changed in ${DC_LOWER}-clustered_instances.yml"
              fi
            displayName: 'Check if the certificate section changed'

          - task: Ansible@0
            displayName: 'Check and save certificates'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'iris/ansible/check_and_save_certificates_cms.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'iris/data/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="azure_kv_name=$(azure_kv_name)"
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="s3_host=$(s3_host)" -e="pure_usernames=$(pure_usernames)"
                -e="s3_iris_bucket=$(s3_iris_bucket)"
                -e "{check_all_certs: $(certificate_changed) }"
                -e "{use_cache: $(cms_use_cache)}"
                -e="{simulation: true}" -e="azure_kv_name=$(azure_kv_name)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

          - task: Ansible@0
            displayName: 'Test haproxy'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'iris/ansible/test_haproxy.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'iris/data/instances'
              failOnStdErr: false
              args: >-
                -u $(user)
                -e="apt_mirror=$(apt_mirror)"
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="{simulation: true}" -e="azure_kv_name=$(azure_kv_name)"
                -e="{instance_auto_restart_allowed: $(instance_auto_restart_allowed)}"
                -e="s3_host=$(s3_host)" -e="pure_usernames=$(pure_usernames)"
                -e="s3_iris_bucket=$(s3_iris_bucket)"
                -e="s3_proxy_host=192.168.255.254" -e="s3_proxy_port=3128"
                -e="sqlbilling_acl_dir=$(Build.SourcesDirectory)/sqlbilling_acl/acl"
                -e="target_dc=$(simulation_dc)"
                -e="apt_mirror=$(apt_mirror)"
                -e "{check_all_certs: $(certificate_changed) }"
                -e "{simulation: true}"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
              ANSIBLE_DISPLAY_SKIPPED_HOSTS: $(ansible_display_skipped_hosts)
              ANSIBLE_DISPLAY_OK_HOSTS: $(ansible_display_ok_hosts)
              ANSIBLE_DIFF_ALWAYS: $(ansible_diff_always)

          - publish: $(Build.SourcesDirectory)/iris/generated_configs/$(simulation_dc)
            artifact: configs_$(simulation_dc)
            displayName: 'Publish configs for $(simulation_dc)'
            condition: always()

          - task: Ansible@0
            displayName: 'Unregister nodes'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'iris/ansible/unregister_nodes.yaml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'iris/data/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="azure_kv_name=$(azure_kv_name)"
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="{simulation: true}" -e="azure_kv_name=$(azure_kv_name)"
                -e="target_dc=$(simulation_dc)"
                -e "{simulation: true}"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
            condition: always()

          - task: Ansible@0
            displayName: 'Cleanup'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'iris/ansible/simulation_cleanup.yaml'
              failOnStdErr: false
              args: >-
                -u $(user) --diff -e="pool=/mnt/storage/test_pool" -e="iso_path=/mnt/storage/iso"
            condition: always()
