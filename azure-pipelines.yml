  - stage: Dump_configs_and_check_changes
    # dependsOn: [Tests_and_lint]
    jobs:
      - job: Dump_configs_and_check_changes
        strategy:
          matrix:
            AU2_hall_A:
              dc: AU2
              hall: A
        pool:
          name: dante
          demands:
            - WTG_DC -equals $(dc)
            - WTG_HALL -equals $(hall)
        steps:
          - checkout: self

          - task: InstallSSHKey@0
            displayName: 'Install an SSH key'
            inputs:
              knownHostsEntry: 'StrictHostKeyChecking no'
              sshKeySecureFile: 'id_rsa_dante'

          - script: |
              set -euxo pipefail
              cp ansible/ansible.cfg .
            displayName: 'Prepare to run playbooks'

          - task: AzureKeyVault@2
            displayName: 'Get secret to authenticate to key vault from ansible'
            inputs:
              azureSubscription: 'sc-azuredevops2dante-vaults'
              KeyVaultName: kv-wtg-dante-sim
              SecretsFilter: secretAppIdDf4b4604e176

          - script: |
              set -euxo pipefail
              cp ansible/ansible.cfg .
            displayName: 'Prepare to run playbooks'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download dante artifact'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # dante build artifact pipeline Id
              pipeline: 26
              buildVersionToDownload: 'specific'
              buildId: '$(dante_build_id)'
              path: $(Build.SourcesDirectory)

          - task: CopyFiles@2
            displayName: 'Merge artifacts to a single roles folder'
            inputs:
              sourceFolder: iris
              targetFolder: ansible

          - task: Ansible@0
            displayName: 'Dump configs'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/dump_configs.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'data/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="simulation=" -e="azure_kv_name=$(azure_kv_name)"
                -e="s3_host=$(s3_host)" -e="pure_usernames='$(pure_usernames)'"
                -e="s3_iris_bucket=$(s3_iris_bucket)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
              ANSIBLE_HOST_KEY_CHECKING: false
              ANSIBLE_MAX_DIFF_SIZE: 1000000  # Default: 104448

          - publish: $(System.DefaultWorkingDirectory)/generated_configs
            artifact: configs
            displayName: 'Publish configs'

  - stage: Simulations
    dependsOn: [Dump_configs_and_check_changes, Tests_and_lint]
    pool: simulations
    jobs:
      - job: Simulation
        strategy:
          matrix:
            AU2:
              simulation_dc: AU2
            DE1:
              simulation_dc: DE1
            US2:
              simulation_dc: US2
        steps:
          - task: AzureKeyVault@2
            displayName: 'Get secret to authenticate to key vault from ansible'
            inputs:
              azureSubscription: 'sc-azuredevops2dante-vaults'
              KeyVaultName: kv-wtg-dante-sim
              SecretsFilter: secretAppIdDf4b4604e176

          - script: |
              set -euxo pipefail
              pip install -r requirements.txt
            displayName: 'Install requirements'

          - script: |
              set -euxo pipefail
              cp ansible/ansible.cfg .
            displayName: 'Prepare to run playbooks'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download dante artifact'
            inputs:
              buildType: 'specific'
              project: 'InfrastructureAutomation'
              # dante build artifact pipeline Id
              pipeline: 26
              buildVersionToDownload: 'specific'
              buildId: '$(dante_build_id)'
              path: $(Build.SourcesDirectory)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download sqlbilling artifacts for ACL'
            inputs:
              buildType: 'specific'
              project: 'ISOperations'
              # https://dev.azure.com/WTGOps/ISOperations/_build?definitionId=239
              pipeline: 239
              artifact: sqlbilling
              buildVersionToDownload: 'specific'
              buildId: '$(sqlbilling_build_id)'
              path: $(Build.SourcesDirectory)/sqlbilling_acl
              patterns: 'acl/*.acl'

          - task: CopyFiles@2
            displayName: 'Merge artifacts to a single roles folder'
            inputs:
              sourceFolder: iris
              targetFolder: ansible

          - task: InstallSSHKey@0
            displayName: 'Install an SSH key'
            inputs:
              knownHostsEntry: 'StrictHostKeyChecking no'
              sshKeySecureFile: 'id_rsa'

          - task: Ansible@0
            displayName: 'Check and save certificates'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/check_and_save_certificates_cms.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'data/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="intermediate=false"
                -e="s3_host=$(s3_host)" -e="pure_usernames=$(pure_usernames)"
                -e="s3_iris_bucket=$(s3_iris_bucket)"
                -e "{use_cache: $(cms_use_cache)}"
                -e="simulation=true" -e="azure_kv_name=$(azure_kv_name)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

          - task: Ansible@0
            displayName: 'Test haproxy'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/test_haproxy.yml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'data/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="simulation=true" -e="azure_kv_name=$(azure_kv_name)"
                -e="{instance_auto_restart_allowed: $(instance_auto_restart_allowed)}"
                -e="s3_host=$(s3_host)" -e="pure_usernames=$(pure_usernames)"
                -e="s3_iris_bucket=$(s3_iris_bucket)"
                -e="s3_proxy_host=192.168.255.254" -e="s3_proxy_port=3128"
                -e="sqlbilling_acl_dir=$(Build.SourcesDirectory)/sqlbilling_acl/acl"
                -e="target_dc=$(simulation_dc)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

          - task: Ansible@0
            displayName: 'Unregister nodes'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/unregister_nodes.yaml'
              inventoriesAgentMachine: 'file'
              inventoryFileOnAgentMachine: 'data/instances'
              failOnStdErr: false
              args: >-
                -u $(user) --diff
                -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                -e="simulation=true" -e="azure_kv_name=$(azure_kv_name)"
                -e="target_dc=$(simulation_dc)"
            env:
              secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
            condition: always()

          - task: Ansible@0
            displayName: 'Cleanup'
            inputs:
              ansibleInterface: 'agentMachine'
              playbookPathOnAgentMachine: 'ansible/simulation_cleanup.yaml'
              failOnStdErr: false
              args: >-
                -u $(user) --diff -e="pool=/mnt/storage/test_pool" -e="iso_path=/mnt/storage/iso"
            condition: always()
