---
clustered_instances:
  hosts: map(include('clustered_instance'),
             key=regex('^(au|de|us|cn|sa)[0-9](prod|corp|sand)[a-z0-9]+$', name='clustered instance label'))
---
clustered_instance:
  container: include('haproxy_container_settings', required=False)
  global_: include('haproxy_global__settings', required=False)
  stats: include('haproxy_stats_settings', required=False)
  defaults: include('haproxy_defaults_settings', required=False)
  custom_defaults: map(nested=False, required=False)
  frontend: include('haproxy_frontend_settings', required=False)
  cipher: include('haproxy_cipher_settings', required=False)
  timeouts: include('haproxy_timeouts_settings', required=False)
  features: include('haproxy_features_settings', required=False)
  machine_cluster: regex('^[a-z0-9-]+$', name='machine cluster label (lowercase with dashes)')
  machine_overrides: map(include('haproxy_settings'),
                         key=regex('^[a-z]{2}[0-9]lbl[0-9]{5}$', name='LB hostname'),
                         required=False)
  weborc_url: regex(r'^https?:\/\/[a-zA-Z0-9.-]+(?::\d+)?(\/.*)?$', name='weborc url', required=False)
  iis_servers: list(any(include('iis_server_settings'),
                        regex('^[a-zA-Z0-9.-]{1,253}$', name='domain or server name')), required=True)
  iis_user: regex(r'^[a-zA-Z0-9_@.]+$', name='IIS user name', required=False)
  iis_servers_local: list(any(include('iis_server_settings'),
                              regex('^[a-zA-Z0-9.-]{1,253}$', name='domain or server name')), required=False)
  iis_user_local: regex(r'^[a-zA-Z0-9_@.]+$', name='IIS user name', required=False)
  websites_config: regex(r'^[a-zA-Z0-9_@.]+$', name='websites config file name', required=False)
  certificates: list(include('certificate_settings'), name='certificate definition', required=True)
  sqlbilling_acl: list(include('sqlbilling_acl_settings'), name='ACL settings for sqlbilling', required=False)
  dc: enum('AU2', 'DE1', 'US2', 'CN1', 'SA1', required=True)

sqlbilling_acl_settings:
  acl_name: regex('^[a-z_-]+$', name='ACL name', required=True)
  file: regex('^[a-zA-Z0-9_-]+\.acl$', name='ACL file name', required=True)

iis_server_settings:
  server: regex('^[a-zA-Z0-9.-]{1,253}$', name='domain or server name')
  agent_port: int(int(min=1, max=65535), required=True)

certificate_settings:
  name: regex('^[a-z0-9-_]+$', name='certificate name (lowercase with dashes)', required=False)
  file_name: regex('^[a-z0-9_]+\\.yaml$', name='CMS config filename', required=False)
  cms_resource_group: regex('^RG-(EU|AU|US)-(Corp|Prod|Sand)$', name='cms resource group name', required=False)
