# ### This file is mock config for Iris ###

global
#########

daemon
nbproc 1
nbthread 8

#######################################
###### MOCK BACKENDS ##################
#######################################

backend wi12345_testrig_sand_wtg_zone-glow
option httpchk
http-check send meth HEAD uri /Glow/wtg/ready ver HTTP/1.1 hdr Host wi12345.testrig.sand.wtg.zone hdr X-Forwarded-Proto https
http-check expect rstatus 200
cookie CW1 insert indirect nocache dynamic httponly secure attr "TestSite=None"
default-server inter 10000
server au2sp-tweb-test1 10.1.2.1:80 check
server au2sp-tweb-test2 10.1.2.2:80 check

