---
machines:
  hosts: map(include('machine'), key=regex('^[a-z]{2}[0-9]lbl[0-9]{5}$', name='LB hostname'))
---
machine:
  ansible_host: ip(version=4, unique='LB address')
  os: enum('rhel9', 'ubuntu2204', 'ubuntu2404')
  dc: regex('^[A-Z]{2}[0-9]$', name='data centre (uppercase)')
  os_variant: enum('rhel', 'ubuntu')
  container: include('haproxy_container_settings', required=False)
  package_repo_provider: enum('foreman', required=False)
