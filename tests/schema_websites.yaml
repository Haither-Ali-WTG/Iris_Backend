---
list(include('website'))
---
website:
  name_regex: include('regex')
  name_exclude_regex: include('regex', required=False)
  server_regex: include('regex', required=False)
  http2: bool(required=False)
  http_health_check: any(include('health_check_on'), include('health_check_off'))
  balance: enum('leastconn', 'source', 'first', 'random', required=False)
  cookie: any(include('dynamic_cookie_on'), include('dynamic_cookie_off'))
  encryption: bool(required=False)
  fullconn: int(min=1, required=False)
  port: include('port')
  maintenance_page: regex(r'^[a-z0-9_]+\.html$', name='sorry page filename', required=False)
  name_suffix: any(const(''), regex('^-[a-z0-9]+$', name='site name suffix'))
---
dynamic_cookie_off:
  enabled: const(False)
dynamic_cookie_on:
  enabled: const(True)
  name: regex('^[A-Z][A-Z0-9]+$', name='uppercase cookie name')
---
health_check_off:
  enabled: const(False)
  http_path: regex('^(/|(/[a-zA-Z0-9?=&_-]+)+)$', name='health check path', required=False)
  xforwardedproto_header: bool(required=False)
  check_expect: regex('^([0-9]{3}[|]?)+$', name='health check status code', required=False)
  method: enum('GET', 'HEAD', required=False)
health_check_on:
  enabled: const(True)
  http_path: regex('^(/|(/[a-zA-Z0-9?=&_-]+)+)$', name='health check path')
  xforwardedproto_header: bool(required=False)
  check_expect: regex('^([0-9]{3}[|]?)+$', name='health check status code', required=False)
  method: enum('GET', 'HEAD', required=False)
