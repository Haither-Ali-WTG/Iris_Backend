---
haproxy_settings:
  container: include('haproxy_container_settings', required=False)
  global_: include('haproxy_global__settings', required=False)
  stats: include('haproxy_stats_settings', required=False)
  defaults: include('haproxy_defaults_settings', required=False)
  frontend: include('haproxy_frontend_settings', required=False)
  cipher: include('haproxy_cipher_settings', required=False)
  timeouts: include('haproxy_timeouts_settings', required=False)
  features: include('haproxy_features_settings', required=False)

haproxy_defaults_settings:
  mode: enum('http', 'tcp', required=False)
  log_name: any(regex('^[a-z0-9_-]+$', name='label for log'), const('{{ inventory_hostname }}'), required=False)
  fullconn: int(min=1, required=False)
  balance: enum('leastconn', 'roundrobin', 'source', 'first', 'random', required=False)
  health_check_interval: any(regex('^[0-9]+s$', name='health check interval'), int(min=1000, max=60000), required=False)

haproxy_global__settings:
  processes: int(min=1, required=False)
  threads: int(min=1, required=False)
  maxconn: int(min=1, required=False)

haproxy_container_settings:
  haproxy_image_tag: regex('^[a-zA-Z0-9._-]+$', name="haproxy image tag", required=False)
  port_map: map(include('port'), key=int(min=1, max=65535), required=False)
  port_prealloc: list(any(int(min=1, max=65535), regex('^[0-9]+(-[0-9]+)?$', name='port range')), required=False)
  resources: include('haproxy_instance_resources_settings', required=False)

haproxy_stats_settings:
  ports:
    file: regex('^(/[a-z0-9.]+)+$', name='pathname', required=False)
    socket: include('port', required=False)
    web: include('port', required=False)

haproxy_cipher_settings:
  profiles: list(foreign_key('data/ciphers/cipher_profiles.yml'), required=False)
  bind_options: list(regex('^[a-z0-9-]+$', name="bind option"), required=False)
  ssl_min: enum('TLSv1.2', required=False)
  ssl_max: enum('TLSv1.3', required=False)

haproxy_features_settings: ~

haproxy_frontend_settings:
  ports: include('haproxy_frontend_ports_settings', required=False)
  proxy_ports: include('haproxy_frontend_proxy_ports_settings', required=False)
  maxconn: int(min=1, required=False)
  fullconn: int(min=1, required=False)

haproxy_frontend_ports_settings:
  plaintext: list(int(min=1, max=65535), required=False)
  ssl: list(int(min=1, max=65535), required=False)

haproxy_frontend_proxy_ports_settings:
  plaintext: list(int(min=1, max=65535), required=False)
  ssl: list(int(min=1, max=65535), required=False)

haproxy_timeouts_settings:
  client: int(min=1, required=False)
  connect: int(min=1, required=False)
  server: int(min=1, required=False)
  tunnel: int(min=1, required=False)
  http_keep_alive: int(min=1, required=False)
  http_request: int(min=1, required=False)
  queue: int(min=1, required=False)
  tarpit: int(min=1, required=False)

instance_resources_settings:
  cpu: regex('^[0-9]+m$', name='cpu limit', required=False)
  memory: regex('^[0-9]+Mi$', name='memory limit', required=False)

haproxy_instance_resources_settings:
  production: include('instance_resources_settings', required=False)
  simulation: include('instance_resources_settings', required=False)
---
port: int(min=1, max=65535, required=False)
regex: regex('^[ -~]+$', name='regular expression')
