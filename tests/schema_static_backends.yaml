---
map(include('static_backend'), key=regex('^[a-z0-9.-]{1,253}$', name='domain name'))
---
static_backend: any(include('static_backend_normal'), include('static_backend_full_override'))
---
static_backend_normal:
  clustered_instances: list(regex('^[a-z][a-z0-9]+$', name='lowercase label'))
  http_health_check: any(include('health_check_on'), include('health_check_off'))
  balance: enum('leastconn', 'source', 'random', required=False)
  backend_name: regex('^[a-z0-9.-]{1,253}$', name='backend name', required=False)
  cookie: include('static_cookie', required=False)
  encryption: bool(required=False)
  fullconn: int(min=1, required=False)
  default_server: regex('^[a-z0-9\- ]+$', name='default_server options', required=False)
  sorry_pages: list(include('sorry_page'), required=False)
  servers: list(include('server'))
---
static_backend_full_override:
  clustered_instances: list(regex('^[a-z][a-z0-9]+$', name='lowercase label'))
  full_override: str()
---
static_cookie:
  name: regex('^[A-Z][A-Z0-9]+$', name='uppercase cookie name')
  secure: bool(required=False)
sorry_page:
  file: regex(r'^[a-z0-9_]+\.html$', name='sorry page filename')
  code: int(min=400, max=599)
server:
  name: regex('^[a-zA-Z0-9.-]{1,253}$', name='domain or server name')
  ip: ip(required=True)
  port: int(min=1, max=65535)
  check_port: int(min=1, max=65535, required=False)
  settings: regex('^[a-z0-9 ()-.]+$', name='additional server options', required=False)
---
health_check_off:
  enabled: const(False)
  http_path: regex('^(/|(/[a-zA-Z0-9?=&_.-]+)+/?)$', name='health check path', required=False)
  xforwardedproto_header: bool(required=False)
  check_expect: regex('^([0-9]{3}[|]?)+$', name='health check status code', required=False)
  method: enum('GET', 'HEAD', required=False)
health_check_on:
  enabled: const(True)
  http_path: regex('^(/|(/[a-zA-Z0-9?=&_.-]+)+/?)$', name='health check path')
  xforwardedproto_header: bool(required=False)
  check_expect: regex('^([0-9]{3}[|]?)+$', name='health check status code', required=False)
  method: enum('GET', 'HEAD', required=False)
