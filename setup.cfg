[tool:pytest]
addopts=--doctest-modules --junit-xml=reports/nosetests.xml --cov=. --cov-report=xml:reports/coverage.xml
doctest_optionflags=DONT_ACCEPT_TRUE_FOR_1

[pylint]
# permit short argument, variable and method names (default: minimum 3 characters)
argument-rgx=[a-z_][a-z0-9_]*$
variable-rgx=[a-z_][a-z0-9_]*$
method-rgx=[a-z_][a-z0-9_]{1,}$
attr-rgx=[a-z_][a-z0-9_]{1,}$
# disable:
#  - fixme - we use TODO comments to indicate work to be done on later pull requests
#  - no-else-return - permit the "balanced if/else" style, which can be clearer
disable=fixme,no-else-return
# run pylint in parallel
jobs=4

[mypy]
check_untyped_defs=True
disallow_incomplete_defs=True
ignore_missing_imports=True
warn_unreachable=True
warn_unused_ignores=True
warn_redundant_casts=True
strict_equality=True
