---
- name: Create fakesrerver directory
  file:
    dest: "{{ working_dir }}/{{ item }}"
    state: directory
    mode: a=rwx
  become: yes
  with_items:
    - config
    - public

- name: Generate fakeserver config
  template:
    src: nginx.conf.j2
    dest: "{{ working_dir }}/config/nginx.conf"
    mode: a=r

- name: Copy index.hmtl
  copy:
    src: index.html
    dest: "{{ working_dir }}/public/index.html"
    mode: a=r

- name: Deploy the fakeserver container
  include_role:
    name: container_runner
  vars:
    name: fakeserver
    workload: deployment
    image: "{{ fakeserver_image }}"
    volumes:
      - "{{ working_dir }}/config:/etc/nginx:z"
      - "{{ working_dir }}/public:/public:z"
    container_dir: "{{ instance_dir }}"
    resources:
      simulation:
        cpu: 1000m
        memory: 200Mi
