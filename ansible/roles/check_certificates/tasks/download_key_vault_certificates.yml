---
- name: Get certificates list
  include_role:
    name: azure_keyvault
    tasks_from: get_secrets_list.yml
  vars:
    curl:
      retries: 0
      delay: 5

- name: Get certificate
  include_role:
    name: azure_keyvault
    tasks_from: get_secret.yml
  vars:
    azure_kv_secret_name: "{{ certificate_name }}"

- name: Download certificate
  include_tasks: download_and_save.yml
  vars:
    check_only: true
