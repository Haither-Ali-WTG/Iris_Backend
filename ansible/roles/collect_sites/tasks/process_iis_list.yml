---
- name: "Get password from key vault for user {{ iis_user_process }}"
  include_role:
    name: azure_keyvault
    tasks_from: get_secret.yml
    apply:
      delegate_to: localhost
  vars:
    azure_kv_name: "{{ key_vault_name }}"
    # username must have "_" by Domain policy, however key vault supports only '-'
    # we also omit domain when looking for key vault value
    azure_kv_secret_name: "{{ iis_user_process | replace('_', '-') | split('@') | first }}"
  when: iis_servers | default([]) | length > 0

- name: "Collect sites data via winrm for {{ inventory_hostname }}"
  changed_when: true
  delegate_to: localhost
  command: >
        python3 {{ playbook_dir }}/roles/collect_sites/files/collect_sites_data.py
        --server_list {{ iis_servers | join(',') }}
        --user_name {{ iis_user_process }}
        --password {{ return_secret_value }}
        --output_path iis_sites/{{ inventory_hostname }}
  register: collect_sites_data_output
  when: iis_servers | default([]) | length > 0

- name: Parse collect sites data output
  set_fact:
    collect_sites_result: "{{ collect_sites_data_output.stdout | from_json }}"
  when:
    - collect_sites_data_output is defined
    - collect_sites_data_output is not skipped

- name: Create failed_collection directory
  delegate_to: localhost
  file:
    dest: failed_collection
    state: directory
    mode: u=rwx,go=

- name: Save failed collection result to file
  delegate_to: localhost
  copy:
    content: "{{ collect_sites_data_output.stdout }}"
    dest: "failed_collection/{{ inventory_hostname }}"
    mode: u=rw,go=
  when:
    - collect_sites_data_output is not skipped
    - collect_sites_data_output is defined
    - collect_sites_result.has_errors

- name: Output collect sites data output
  vars:
    info:
      log: "{{ collect_sites_data_output.stderr_lines }}"
      result: "{{ collect_sites_result }}"
  debug:
    var: info
  when:
    - collect_sites_data_output is defined
    - collect_sites_data_output is not skipped

- name: Upload IIS data to S3
  command: >-
    aws --endpoint-url=https://{{ s3_host }}
    s3 cp --recursive
    iis_sites/{{ inventory_hostname }}
    {{ s3_iris_bucket }}{{ s3_folder | default(default_s3_folder) }}/{{ inventory_hostname }}
  changed_when: true
  delegate_to: localhost
  when:
    - collect_sites_data_output is not skipped
    - collect_sites_data_output is defined
    - collect_sites_result.wrote_files
    - upload_iis_data | default(true)

- name: Download cached IIS data from S3 for failed servers
  command: >-
    aws --endpoint-url=https://{{ s3_host }}
    s3 cp
    {{ s3_iris_bucket }}{{ s3_folder | default(default_s3_folder) }}/{{ inventory_hostname }}/{{ item }}
    iis_sites/{{ inventory_hostname }}/{{ item }}
  delegate_to: localhost
  register: s3_cache_downloads
  failed_when: false
  changed_when: false
  loop: >-
    {{
      collect_sites_result.results
      | selectattr('status', 'equalto', 'error')
      | map(attribute='server')
      | list
    }}
  loop_control:
    label: "{{ item }}"
  when:
    - collect_sites_data_output is defined
    - collect_sites_data_output is not skipped
    - collect_sites_result.has_errors
    - use_s3_cache | default(false)

- name: Report IIS cache download failures
  vars:
    failed_cache_downloads: >-
      {{
        s3_cache_downloads.results
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}
  debug:
    msg: >-
      Failed to download IIS cache from S3 for {{ inventory_hostname }}:
      {{ failed_cache_downloads | join(', ') }}
  when:
    - s3_cache_downloads is defined
    - s3_cache_downloads.results is defined
    - (s3_cache_downloads.results | selectattr('rc', 'ne', 0) | list | length) > 0
