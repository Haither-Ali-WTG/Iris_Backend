---
- name: Enable legacy hashes for openssl
  include_role:
    name: collect_sites
    tasks_from: enable_legacy_hashes_for_ssl.yml
    apply:
      delegate_to: localhost
      run_once: true

- name: "Collect sites data via winrm for {{ instance_name }}"
  changed_when: true
  delegate_to: localhost
  command: >
        python3 {{ playbook_dir }}/roles/collect_sites/files/collect_sites_data.py
        --server_config_file {{ playbook_dir }}/../config/servers.yml
        --website_config_file {{ playbook_dir }}/../config/websites.yml
        --server_list {{ iis_servers | join(',') }}
        --password {{ winrm_password }}
        --output_path {{ inventory_hostname }}
  register: collect_sites_data_output
  when:
    - not simulation
    - iis_servers is defined

- name: Outpit colect sites data output
  debug:
    var: collect_sites_data_output
  when: collect_sites_data_output is defined
