---
- name: "Collect sites data via winrm for {{ clustered_instance_name }}"
  changed_when: true
  delegate_to: localhost
  command: >
        python3 {{ playbook_dir }}/roles/collect_sites/files/collect_sites_data.py
        --server_list {{ iis_servers | join(',') }}
        --password {{ winrm_password }}
        --output_path {{ inventory_hostname }}
  register: collect_sites_data_output
  when: iis_servers is defined

- name: Output collect sites data output
  debug:
    var: collect_sites_data_output
  when: collect_sites_data_output is defined

- name: Upload IIS data to ceph
  command: >-
    aws --endpoint-url=https://{{ s3_host }}
    s3 cp --recursive
    {{ inventory_hostname }} {{ s3_iris_bucket }}/{{ inventory_hostname }}
  changed_when: true
  delegate_to: localhost
  when:
    - collect_sites_data_output is defined
    - (collect_sites_data_output.stdout | from_json).wrote_files
