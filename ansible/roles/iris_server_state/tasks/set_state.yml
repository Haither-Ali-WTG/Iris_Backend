---
- name: Get servers state from Haproxy instance
  shell:
    cmd: |
      set -o pipefail
      echo 'show servers state' \
      | nc -U {{ haproxy_sock_file }}
    executable: /bin/bash
  become: yes
  changed_when: false
  register: servers_state

# servers_state.stdout_lines sample:
# [
#   "1",
#   "# be_id be_name srv_id srv_name srv_addr srv_op_state srv_admin_state srv_uweight srv_iweight
#   srv_time_since_last_change srv_check_status srv_check_result srv_check_health srv_check_state
#   srv_agent_state bk_f_forced_id srv_f_forced_id srv_fqdn srv_port srvrecord srv_use_ssl srv_check_port
#   srv_check_addr srv_agent_addr srv_agent_port",
#   "4 sandtsg-token-based_wtg_zone 1 AU2SP-SRDG-401 10.2.68.23 0 0 1 1 2649 7 2 0 6 0 0 0 - 80 - 0 0 - - 0",
#   "4 sandtsg-token-based_wtg_zone 2 AU2SP-SRDG-402 10.2.68.24 0 0 1 1 2644 7 2 0 6 0 0 0 - 80 - 0 0 - - 0"
# ]
- name: "Set server state to '{{ operation }}'"
  shell:
    cmd: |
      set -o pipefail
      echo 'set server {{ item.split(' ')[1] }}/{{ item.split(' ')[3] }} state {{ operation }}' \
      | nc -U {{ haproxy_sock_file }}
    executable: /bin/bash
  become: yes
  changed_when: true
  loop: "{{ servers_state.stdout_lines }}"
  when:
    - item.split(' ') | length == 25
    - >-
      item.split(' ')[1] in backend_list
      or (backend_list | length == 1 and backend_list[0] == '*')
    - >-
      item.split(' ')[3] in backend_server_list
      or (backend_server_list | length == 1 and backend_server_list[0] == '*')
