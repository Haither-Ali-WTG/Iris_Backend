---
- name: "Collect sites data from weborc for {{ inventory_hostname }}"
  command: >
        python3 {{ playbook_dir }}/roles/collect_sites_from_weborc/files/collect_sites.py
        --weborc_url {{ weborc_url }}
        --output_path {{ weborc_output_folder | default('iis_sites_v2') }}/{{ inventory_hostname }}
  register: collect_sites_output
  changed_when: true
  delegate_to: localhost

- name: Output collected sites from weborc
  debug:
    msg: >-
      collect_sites.py stdout:
      {{ collect_sites_output.stdout | default('') }}
      collect_sites.py stderr:
      {{ collect_sites_output.stderr | default('') }}
  when: collect_sites_output is not skipped

- name: Upload collected sites data to S3
  command: >-
    aws --endpoint-url=https://{{ s3_host }}
    s3 cp --recursive
    {{ weborc_output_folder | default('iis_sites_v2') }}/{{ inventory_hostname }}
    {{ s3_iris_bucket }}{{ target_dc }}-v2/{{ inventory_hostname }}
  changed_when: true
  delegate_to: localhost
  when:
    - collect_sites_output is not skipped
    - collect_sites_output is defined
    - collect_sites_output.rc == 0
    - upload_iis_data | default(true)
