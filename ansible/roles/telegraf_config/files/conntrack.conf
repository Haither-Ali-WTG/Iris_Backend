###### Deployed by Iris Run ######

[[inputs.exec]]
  commands = [
    "bash -c 'printf \"conntrack conntrack_max=%s,conntrack_count=%s\\n\" \"$(cat /proc/sys/net/netfilter/nf_conntrack_max)\" \"$(cat /proc/sys/net/netfilter/nf_conntrack_count)\"'"
  ]
  data_format = "influx"
  interval = "60s"

[[outputs.file]]
  namepass = ["conntrack"]
  files = ["/var/log/conntrack/metrics.ndjson"]
  data_format = "template"
  template = '''
{"measurement":"{{.Name}}","host":"{{.Tag "host"}}","conntrack_max":{{index .Fields "conntrack_max"}},"conntrack_count":{{index .Fields "conntrack_count"}},"timestamp":"{{.Time.Format "2006-01-02T15:04:05Z07:00"}}"}
'''