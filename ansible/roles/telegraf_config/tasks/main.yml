---
- name: Ensure telegraf.d directory exists
  file:
    path: /etc/telegraf/telegraf.d/
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: u=rwx,g=rx,o=rx
  become: yes

- name: Copy Prometheus config to telegraf.d
  template:
    src: prometheus.conf.j2
    dest: /etc/telegraf/telegraf.d/prometheus.conf
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: u=rw,g=r,o=r

- name: Install Telegraf
  include_role:
    name: wtg.monitoring_agents.telegraf
  vars:
    data_centre: "{{ target_dc }}"
  when:
   - target_dc == "AU2"
   - not simulation
