---
# NOTE: The 'find' task below registers a variable
# 'telegraf_unit_file' which is used by the handler in 'handlers/main.yml'
# to conditionally restart the service. This creates a dependency between
# this task file and the handler file.
- name: Check if telegraf's main service unit file exists
  find:
    paths:
      - /usr/lib/systemd/system
      - /etc/systemd/system
    patterns: 'telegraf.service'
  register: telegraf_unit_file

- name: Ensure telegraf.d directory exists
  become: yes
  file:
    path: /etc/telegraf/telegraf.d/
    state: directory
    owner: root
    group: root
    mode: "u=rwx,g=rx,o=rx"

- name: Copy Prometheus config to telegraf.d
  become: yes
  template:
    src: prometheus.conf.j2
    dest: /etc/telegraf/telegraf.d/prometheus.conf
    owner: root
    group: root
    mode: "u=rw,g=r,o=r"
  notify: Restart telegraf
