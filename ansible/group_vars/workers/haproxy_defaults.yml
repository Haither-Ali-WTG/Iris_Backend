---
worker_defaults:
  instance:
    # TODO: this should probably just be the name?
    # log_name: datacentre - env - context - function
    log_name: AU2-sand-demo-demo
    processes: 1
    threads: 8
    maxconn: 200000

  stats:
    ports:
      file: /var/run/haproxy/haproxy.sock
      socket: 81
      web: 8001

  cipher:
    suites: [TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256]
    ciphers:
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-CHACHA20-POLY1305
      - ECDHE-RSA-CHACHA20-POLY1305
      - DHE-RSA-AES256-GCM-SHA384
    bind_options: [no-sslv3, no-tlsv10, no-tlsv11, no-tls-tickets]
    ssl_min: TLSv1.0
    ssl_max: TLSv1.3

  proxy:
    mode: http
    ports:
      http:
        plaintext: [80]
        ssl: [443]
    maxconn: 200000
    fullconn: 5000
    balance: leastconn

  timeouts:
    client: 60
    connect: 60
    server: 300
    tunnel: 3600
    http_keep_alive: 1
    http_request: 60
    queue: 30
    tarpit: 60

  sysctl_values:
    common:
      net.ipv4.ip_nonlocal_bind: 1  # Required by systems with keepalived
      fs.nr_open: 10000000
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.tcp_max_tw_buckets: 1440000
      net.core.somaxconn: 60000
      net.core.netdev_max_backlog: 10000
      net.ipv4.tcp_max_syn_backlog: 2048
      net.ipv4.tcp_synack_retries: 3
      net.ipv4.tcp_fin_timeout: 30
      net.ipv4.ip_local_port_range: "2048 65535"
      net.ipv4.tcp_mem: "786432 1697152 1945728"
      net.ipv4.tcp_rmem: "4096 4096 16777216"
      net.ipv4.tcp_wmem: "4096 4096 16777216"
      net.core.wmem_max: 12582912
      net.core.rmem_max: 12582912
      net.ipv4.conf.all.arp_ignore: 1  # Required by systems with keepalived
      net.ipv4.conf.all.arp_announce: 1  # Required by systems with keepalived
      net.ipv4.conf.all.arp_filter: 0  # Required by systems with keepalived
      net.netfilter.nf_conntrack_tcp_timeout_close_wait: 60
      net.netfilter.nf_conntrack_tcp_timeout_fin_wait: 60
      net.netfilter.nf_conntrack_tcp_timeout_time_wait: 60
      net.netfilter.nf_conntrack_max: 524288
    rhel: ~
    ubuntu: ~
