---
- name: Check Sites Collection Results
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Get list of failed collection files
      find:
        paths: "failed_collection"
        file_type: file
      register: failed_files

    - name: Display failed collections if any
      when: failed_files.matched > 0
      block:
        - name: Read and display errors
          vars:
            instance_name: "{{ item.path | basename }}"
            file_content: "{{ lookup('file', item.path) | from_json }}"
          debug:
            msg: "Instance {{ instance_name }} failed: {{ file_content.results }}"
          loop: "{{ failed_files.files }}"

    - name: Assert no failures
      assert:
        that: failed_files.matched == 0
        fail_msg: >-
          Found {{ failed_files.matched }} instances with collection failures.
          Please check the error details above.
        success_msg: "All IIS servers data collection completed successfully"
