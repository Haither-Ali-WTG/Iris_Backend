---
- name: Set simulation facts
  hosts: machines
  gather_facts: no
  tasks:
    - name: Set additional facts for simulating the machines
      # TODO many of these will go into the inventory or will be calculated differently
      set_fact:
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
        ansible_host: "172.24.0.{{ ansible_play_hosts_all.index(inventory_hostname) + 1 }}"
        pool: /mnt/storage/test_pool
        virgil_os_family: linux
        virgil_mac_oob_dante: '...'
        virgil_hostname: "{{ inventory_hostname }}"
        use_iso: false
        images_folder: "/mnt/storage"
        virgil_ssh_authorized_keys: >-
            {{ lookup('file', 'test_ssh_keys/id_rsa.pub') if simulation }}
        virgil_groups: ['mgmt']
        simulation_proxy: "http://172.31.255.254:3128"
        virgil_port_oob_dante: eth0
        virgil_internal_fqdn: "{{ inventory_hostname }}"
        cpu: 4
        ram: 8192

- name: Import IIS data
  import_playbook: import_iis_data.yml

- name: Create hypervisor group
  hosts: localhost
  gather_facts: yes
  tasks:
    - name: Basic usage
      ansible.builtin.debug:
        msg: "'{{ lookup('ansible.builtin.env', 'secretAppIdDf4b4604e176') }}'"

    - include_role:
        name: azure_keyvault
        tasks_from: get_secret.yml        
      vars:
        azure_kv_name: kv-wtg-test
        azure_kv_secret_name: ahwprd-webtracker-carozplus-com

    - debug:
        var: return_secret_value


    - name: Add host to hypervisor group
      add_host:
        name: "{{ hypervisor | default('localhost') }}"
        groups: hypervisor
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
        images_folder: "/mnt/storage"

- name: Configure hypervisor
  hosts: hypervisor
  tasks:
    - name: "Install s3cmd"
      apt:
        name: "s3cmd"
        state: present
      become: yes

    - name: Setup ceph connection
      include_role:
        name: ceph_connection_setup
      vars:
        proxy_host: "192.168.255.254"
        proxy_port: "3128"

    - name: Download qcow2 required simulation
      command: s3cmd sync --no-preserve {{ qcow2_ceph_path }}{{ item }} {{ images_folder }}/
      with_items:
        - "{{ rhel_hypervisor_image }}"
        - "{{ ubuntu_hypervisor_image }}"
      changed_when: true

- name: Deploy simulated machines
  hosts: machines
  gather_facts: no
  tasks:
    - name: Set additional facts
      set_fact:
        virgil_ip_oob_dante: "{{ ansible_host }}"
        virgil_os_variant: "{{ os }}"
        virgil_ip_dante: "{{ ansible_host }}"
        virgil_orchestrator: container runner  # TODO properly - "{{ machine.virgil_orchestrator }}"
        virgil_os_codename: jammy  # TODO properly - "{{ machine.virgil_os_codename }}"

    - name: Set images for simulation OS
      vars:
        os_image:
          ubuntu: "{{ ubuntu_hypervisor_image }}"
          rhel: "{{ rhel_hypervisor_image }}"
      set_fact:
        image: "{{ images_folder }}/{{ os_image[virgil_os_variant] }}"

    - name: Deploy test machines
      include_role:
        name: deploy_test_machines
        apply:
          delegate_to: "{{ groups['hypervisor'][0] }}"

    - name: Actually wait 600 seconds for nodes to come up
      # TODO clarify why this doesn't happen within the `deploy_test_machines` role
      wait_for_connection:
        connect_timeout: 5
        timeout: 600

- name: Deploy haproxy on simulated machines
  import_playbook: deploy_haproxy.yml

- name: Deploy tests on simulated machines
  import_playbook: deploy_tests.yml

- name: Check haproxy
  import_playbook: check_haproxy.yml
