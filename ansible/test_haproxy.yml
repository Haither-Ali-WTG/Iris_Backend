---
- hosts: localhost
  gather_facts: no
  tasks:
    - name: Create group with test machine based on inventory name
      add_host:
        name: "{{ item }}"
        groups: tdd
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
        virgil_ip_dante: "172.24.0.{{ ansible_loop.index }}"
        pool: /mnt/storage/test_pool
        virgil_os_family: linux
        virgil_mac_oob_dante: '...'
        virgil_hostname: "{{ item }}"
        use_iso: false
        images_folder: "/mnt/storage"
        virgil_os_variant: "{{ hostvars[groups[item][0]]['os'] }}"
      when: item not in ['all', 'ungrouped']
      loop: "{{ groups.keys() }}"
      loop_control:
        extended: yes

    - name: Add host to hypervisor group
      add_host:
        name: "{{ hypervisor | default('localhost') }}"
        groups: hypervisor
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
        images_folder: "/mnt/storage"


