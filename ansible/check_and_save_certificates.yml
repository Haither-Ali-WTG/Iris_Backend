---
- name: Check and save certificates
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Calculate certificates to download
      set_fact:
        certs_list: "{{ (certs_list | default([]) + hostvars[item].certificates) | unique }}"
      when: '"certificates" in hostvars[item]'
      loop: "{{ groups['clusters'] }}"

    - name: Get certificate
      include_role:
        name: manage_certificates
        tasks_from: download_and_save.yml
      loop: "{{ certs_list | default([]) }}"
      loop_control:
        loop_var: certificate_name
