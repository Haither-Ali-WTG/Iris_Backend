---
- name: Calculate instance inventory entrance
  import_playbook: calculate_instances.yml

- name: Check and save certificates
  hosts: instances
  gather_facts: no
  tasks:
    - name: Get certificate
      include_role:
        name: manage_certificates
        tasks_from: download_and_save.yml
      loop: "{{ certificates }}"
      loop_control:
        loop_var: certificate_name
