---
- name: Target machines
  import_playbook: target_machines.yaml

- name: Collect IIS data
  hosts: clustered_instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Collect IIS data
      include_role:
        name: collect_sites
      vars:
        upload_iis_data: false
      when:
        - not simulation
        - target_dc == dc
        - (iis_servers | default([]) | length > 0) or (iis_servers_local | default([]) | length > 0)

- name: Download IIS data and check
  hosts: localhost
  tasks:
    - name: Setup S3 storage connection
      include_role:
        name: pure_connection_setup
      vars:
        pure_s3_users: "{{ pure_usernames.split(',') | map('trim') | list }}"

    - name: Create iis_sites if collect_sites didn't create it
      file:
        path: iis_sites
        state: directory
        mode: u=rwx

    - name: Create temporary directory
      tempfile:
        state: directory
      register: temp_path

    - name: Download IIS data from S3
      command: >-
        aws --endpoint-url=https://{{ s3_host }}
        s3 cp --recursive --exclude "*" --include "{{ target_dc[:2] | lower }}*"
        {{ s3_iris_bucket }}{{ s3_folder | default(default_s3_folder) }}
        {{ temp_path.path }}
      changed_when: true

    - name: Check if IIS data changed
      command: >-
        diff -r --exclude=cms-cache.json iis_sites {{ temp_path.path }}
      register: diff_output
      changed_when: true
      ignore_errors: yes

    - name: Trigger IRIS deployment pipeline
      include_role:
        name: trigger_iris_pipeline
      when: diff_output.rc != 0
