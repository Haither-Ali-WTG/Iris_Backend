---
- name: Generate the "worker" inventory entries
  hosts: localhost
  strategy: linear
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Create worker inventory entry
      vars:
        machine: "{{ hostvars[item.machine_name] }}"
        cluster: "{{ hostvars[item.cluster_name] }}"
      add_host:
        name: "{{ item.worker_name }}"
        groups:
          - workers
          - "workers_{{ ['odd', 'even'][i % 2] }}"  # to do half at a time; could also do thirds
        cluster_machine_overrides: "{{ item.cluster_machine_overrides or {} }}"
        machine_name: "{{ item.machine_name }}"
        cluster_name: "{{ item.cluster_name }}"
        # TODO: groups from cluster and machine settings
        ansible_host: "{{ machine.ansible_host }}"
        haproxy_http_port: "{{ (2000 + i * 2) if simulation else 80 }}"
        haproxy_https_port: "{{ (2000 + i * 2 + 1) if simulation else 443 }}"

        static_backends: "{{ cluster.static_backends | default({}) }}"
        acls: "{{ cluster.acls }}"
        actions: "{{ cluster.actions }}"
        certificates: "{{ cluster.certificates }}"
        tests: "{{ cluster.tests | default([]) }}"

        virgil_orchestrator: container runner  # TODO properly - "{{ machine.virgil_orchestrator }}"
        virgil_os_codename: jammy  # TODO properly - "{{ machine.virgil_os_codename }}"
        virgil_os_variant: "{{ machine.os }}"

      loop: >-
        [
          {% for cluster_name in groups['clusters'] %}
            {% for machine_name, machine_overrides in hostvars[cluster_name].cluster_machines.items() %}
              {
                'machine_name': '{{ machine_name }}',
                'cluster_name': '{{ cluster_name }}',
                'cluster_machine_overrides': {{ machine_overrides | to_json }},
                'worker_name': 'worker_{{ cluster_name }}_{{ machine_name }}',
              },
            {% endfor %}
          {% endfor %}
        ]
      loop_control:
        index_var: i
        label: "{{ item.worker_name }}"
