---
- name: Target machines
  import_playbook: target_machines.yaml

- name: Augment the inventory
  import_playbook: augment_inventory.yaml

- name: Create target directory
  hosts: localhost
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Create target directory
      file:
        dest: "{{ item }}"
        state: directory
        mode: u=rwx,go=rx
      loop:
        - "../generated_configs"
        - "../current_configs"

- name: Set dummy values for machines
  hosts: target_machines
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Set dummy values
      set_fact:
        haproxy_user: ~
        haproxy_subuser: ~

- name: Dump the configs and output the changes
  hosts: individual_instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Generate the new configs
      include_role:
        name: iris_haproxy
        tasks_from: dump_config.yml

    - name: Fetch the current working config from target machine
      fetch:
        src: "{{ individual_instance_dir }}/etc/{{ clustered_instance_name }}.cfg"
        dest: "../current_configs/{{ inventory_hostname }}.cfg"
        flat: true
        fail_on_missing: false
      ignore_unreachable: true
      become: yes

- name: Show config changes
  import_playbook: show_config_changes.yml
  when: show_changes | default(false)
