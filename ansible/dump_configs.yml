---
- name: Target machines
  import_playbook: target_machines.yaml

- name: Augment the inventory
  import_playbook: augment_inventory.yaml

- name: Create target directory
  hosts: localhost
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Create target directory
      file:
        dest: "{{ item }}"
        state: directory
        mode: u=rwx,go=rx
      loop:
        - "../generated_configs"
        - "../current_configs"

- name: Set dummy values for machines
  hosts: target_machines
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Set dummy values
      set_fact:
        haproxy_user: ~
        haproxy_subuser: ~

- name: Dump the configs and output the changes
  hosts: individual_instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Generate the new configs
      include_role:
        name: iris_haproxy
        tasks_from: dump_config.yml

    - name: Output path
      debug:
        msg: "{{ individual_instance_dir }}/etc/{{ clustered_instance_name }}.cfg"

    - name: Fetch the current working config from target machine
      fetch:
        src: "{{ individual_instance_dir }}/etc/{{ clustered_instance_name }}.cfg"
        dest: "../current_configs/{{ inventory_hostname }}.cfg"
        flat: true
        fail_on_missing: false
      become: yes

- name: Compare the changes of configs
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Get generated config files
      find:
        paths: "../generated_configs/"
        file_type: file
      register: generated_config_list

    - name: Get current config files
      find:
        paths: "../current_configs/"
        file_type: file
      register: current_config_list

    - name: Get filenames of configurations
      set_fact:
        generated_filenames: >-
          {{ generated_config_list.files
          | map(attribute='path')
          | map('basename')
          | reject('search', 'README')
          | list }}
        current_filenames: >-
          {{ current_config_list.files
          | map(attribute='path')
          | map('basename')
          | list }}

    - name: Compute added configs
      set_fact:
        added_configs: "{{ generated_filenames | difference(current_filenames) }}"

    - name: Added instance configuration
      debug:
        msg: >-
          New instance {{ added_configs }} will be added,
          please check the configuration in Pipeline artifact.
      when: added_configs | length > 0
      changed_when: added_configs | length > 0

    - name: Show configuration changes
      copy:
        src: "../generated_configs/{{ item }}"
        dest: "../current_configs/{{ item }}"
        mode: "u=r,go="
      check_mode: yes
      diff: yes
      loop: "{{ generated_filenames | intersect(current_filenames) }}"
