---
- name: Generate the "instance" inventory entries
  hosts: clusters
  strategy: linear
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Create instance inventory entry
      vars:
        machine: "{{ hostvars[item.key] }}"
      add_host:
        name: inst_{{ inventory_hostname }}_{{ item.key }}
        groups:
          - instances
          - "instances_{{ ['odd', 'even'][i % 2] }}"  # to do half at a time; could also do thirds
        cluster_overrides: "{{ item.value or {} }}"
        # TODO: machine overrides
        # TODO: groups from cluster and machine settings
        ansible_host: "{{ machine.ansible_host }}"

        virgil_orchestrator: container runner  # TODO properly - "{{ machine.virgil_orchestrator }}"
        virgil_os_codename: jammy  # TODO properly - "{{ machine.virgil_os_codename }}"
        virgil_os_variant: "{{ machine.os }}"

      with_dict: "{{ cluster_machines }}"
      loop_control:
        index_var: i
        label: "{{ item.key }}"

- name: Setup on the machines
  hosts: machines
  strategy: free
  # can use "serial: 1" or "throttle: 1" to process machines one by one, where needed
  gather_facts: no
  force_handlers: yes
  tasks:
    - debug:
        var: simulation 
    - name: Setup docker
      include_role:
        name: container_runner
        tasks_from: setup.yml
      # TODO: remove when actual prod machines are available
      when: simulation

- name: Setup the instances
  hosts: instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Deploy the instances
      include_role:
        name: iris_haproxy
        tasks_from: instances.yml
      # TODO: remove when actual prod machines are available
      when: simulation

- name: Per-cluster setup (if needed)
  hosts: clusters
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Placeholder
      debug:
        msg: per-cluster setup
