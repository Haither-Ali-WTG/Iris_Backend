---
- name: Augment the inventory
  import_playbook: augment_inventory.yaml
  when: not simulation

- name: Setup on the machines
  hosts: machines
  strategy: free
  # can use "serial: 1" or "throttle: 1" to process machines one by one, where needed
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Setup docker
      include_role:
        name: container_runner
        tasks_from: setup.yml
      when: not simulation

- name: Setup the instances
  hosts: instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Calculate instance settings
      vars:
        the_instance: "{{ hostvars[inventory_hostname] }}"
        machine: "{{ hostvars[machine_name] }}"
        cluster: "{{ hostvars[cluster_name] }}"
      set_fact:
        "{{ item }}": >-
          {{
            the_instance[item]
            | combine(cluster[item] | default({}), recursive=true)
            | combine(machine[item] | default({}), recursive=true)
            | combine(cluster_machine_overrides[item] | default({}), recursive=true)
          }}
      loop: [instance, cipher, proxy, timeouts]

    - name: Collect min facts
      ansible.builtin.setup:
        gather_subset: min
      # TODO: remove when actual prod machines are available
      when: simulation

    - name: Deploy the instances
      include_role:
        name: iris_haproxy
        tasks_from: instances.yml
      # TODO: remove when actual prod machines are available
      when: simulation

- name: Setup localhost for s3
  hosts: localhost
  tasks:
    - name: Enable legacy hashes for openssl
      include_role:
        name: collect_sites
        tasks_from: enable_legacy_hashes_for_ssl.yml

    - name: Setup ceph connection
      include_role:
        name: ceph_connection_setup

- name: Per-cluster setup (if needed)
  hosts: clusters
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Collect and publish IIS data to ceph
      include_role:
        name: collect_sites
      when: not simulation
