---
- name: Target machines
  import_playbook: target_machines.yaml

- name: Setup localhost for s3
  hosts: localhost
  tasks:
    - name: Enable legacy hashes for openssl
      include_role:
        name: collect_sites
        tasks_from: enable_legacy_hashes_for_ssl.yml

    - name: Setup ceph connection
      include_role:
        name: ceph_connection_setup

- name: Collect and publish IIS data to ceph
  hosts: clustered_instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Collect and publish IIS data to ceph
      include_role:
        name: collect_sites
      when:
        - not simulation
        - iis_servers | length > 0

- name: Augment the inventory
  import_playbook: augment_inventory.yaml
  when: not simulation

- name: Per-clustered-instance setup (if needed)
  hosts: clustered_instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks: []

- name: Setup on the machines
  hosts: target_machines
  strategy: free
  # can use "serial: 1" or "throttle: 1" to process machines one by one, where needed
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Adjust installed packages
      include_role:
        name: iris_os_packages

    - name: Setup docker
      include_role:
        name: container_runner
        tasks_from: setup.yml
      when: not simulation

    - name: Setup rsyslog for Iris
      include_role:
        name: iris_rsyslog

    - name: Apply system parameters
      include_role:
        name: system_parameters

    - name: Create haproxy user
      user:
        name: haproxy
        comment: HAProxy user
        create_home: no
        password_lock: yes
      register: haproxy_user
      become: yes

- name: Setup the individual instances
  hosts: individual_instances
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Calculate individual instance settings
      vars:
        the_individual_instance: "{{ hostvars[inventory_hostname] }}"
        machine: "{{ hostvars[machine_name] }}"
        clustered_instance: "{{ hostvars[clustered_instance_name] }}"
      set_fact:
        "{{ item }}": >-
          {{
            the_individual_instance[item]
            | combine(clustered_instance[item] | default({}), recursive=true)
            | combine(machine[item] | default({}), recursive=true)
            | combine(clustered_instance_machine_overrides[item] | default({}), recursive=true)
          }}
      loop: [instance, stats, cipher, proxy, timeouts]

    - name: Collect min facts
      ansible.builtin.setup:
        gather_subset: min

    - name: Deploy the individual instances
      include_role:
        name: iris_haproxy
        tasks_from: individual_instances.yml

    - name: Mark instance as successful
      set_fact:
        ok: yes

- name: Finalise setup on the machines
  hosts: target_machines
  strategy: free
  gather_facts: no
  force_handlers: yes
  tasks:
    - name: Assert all instances on the machine are successful
      vars:
        failed_instance_names: >-
          {{
            individual_instances
            | map('extract', hostvars)
            | rejectattr('ok')
            | map(attribute='inventory_hostname')
            | list
          }}
      assert:
        that: not failed_instance_names
        quiet: yes
        fail_msg: >-
          Aborting machine {{ inventory_hostname }} due to failed individual instances
          {{ failed_instance_names | join(' and ') }}

    - name: Setup keepalived (VRRP)
      include_role:
        name: iris_keepalived
