---
- name: Download and initialize clustered instance IIS data
  hosts: localhost
  tasks:
    - name: Setup ceph connection
      include_role:
        name: ceph_connection_setup
      vars:
        proxy_host: "{% if simulation %}192.168.255.254{% endif %}"
        proxy_port: "{% if simulation %}3128{% endif %}"

    - name: Create temporary directory
      tempfile:
        state: directory
      register: temp_path

    - name: Download IIS data from ceph
      command: s3cmd get --recursive  --no-preserve {{ s3_iris_bucket }} {{ temp_path.path }}
      changed_when: true

    - name: Recursively find all IIS data files
      ansible.builtin.find:
        paths: "{{ temp_path.path }}"
        recurse: yes
      register: iis_files

    - name: Find all clustered_instances
      ansible.builtin.find:
        paths: "{{ temp_path.path }}"
        recurse: no
        file_type: directory
      register: clustered_instance_folders

    - name: Calculate clustered_instances_names
      set_fact:
        clustered_instance_names: >-
          [
            {% for item in clustered_instance_folders.files %}
            {{ (item.path | split('/'))[-1] | to_json }},
            {% endfor %}
          ]

    - name: Load configs
      set_fact:
        server_config: "{{ lookup('file', '{{ playbook_dir }}/../dynamic_backends/servers.yml') | from_yaml }}"
        website_config: "{{ lookup('file', '{{ playbook_dir }}/../dynamic_backends/websites.yml') | from_yaml }}"

    - name: Report IIS counts
      vars:
        stats:
          data_files_count: "{{ iis_files.files | length }}"
          clustered_instance_count: "{{ clustered_instance_names | length }}"
      debug:
        var: stats

    - name: Filter valid server names
      set_fact:
        iis_files: >-
          {%- set result = [] -%}
          {%- for file in iis_files.files -%}
          {%-   for prefix in server_config['computer_name_prefixes'] -%}
          {%-     if prefix == (file.path.split('/') | last)[: (prefix | length)] -%}
          {%-       set x = result.append(file.path) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ result | unique }}

    - name: Include vars of IIS sites to clustered_instance_name variable
      set_fact:
        complete_iis_data: "{{ lookup('template', 'roles/iris_haproxy/templates/process_iis_data.j2') | from_yaml }}"
