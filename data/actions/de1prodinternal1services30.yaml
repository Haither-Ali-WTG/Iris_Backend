---
peppol_smp_deny_secure_path:
  description: |-
    SMP secure path blocking
  order: 59
  actions:
    - >-
      http-request deny if
      peppol_smp_disallow_secure_path peppol-smp-test-service_wisetechglobal_com
    - >-
      http-request deny if
      peppol_smp_disallow_secure_path peppol-smp-prod-service_wisetechglobal_com

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_cwconnector_wisegrid_net !{ ssl_fc }

de1s3_3_secondary_backend_selection:
  description: |-
    Use secondary backend in local DC for de1s3-3
  order: 10
  actions:
    - use_backend de1s3-3-secondary if de1s3-3-primary_not_enough_capacity de1s3-3_wtg_ws_and_subdomains

de1s3_3_primary_backend_selection:
  description: |-
    Use primary backend in local DC for de1s3-3
  order: 11
  actions:
    - use_backend de1s3-3-primary if de1s3-3_wtg_ws_and_subdomains

restrict_iris_stats_url:
  description: |-
    Allow iris stats url only from jumphost src
  order: 6
  actions:
    - http-request deny if !jumphost_src iris_stats_urls
