---
secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_cfs_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webcampaign_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webprint_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webtracker_wisegrid_net !{ ssl_fc }

cw1_use_dynamic_backend_path:
  description: |-
    Redirect Glow webservice requests to the correct backend based on path
  order: 80
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-glow
        if glow_webservice_path www-star_wisegrid_net

custom_url_actions:
  description: |-
    Customurls for GLOW & Webtracker
  order: 80
  actions:
    - use_backend www-aetprd.wisegrid.net if { hdr(host),field(1,:) -i aetnatracking.com }
    - use_backend www-de1jfl.wisegrid.net if { hdr(host),field(1,:) -i neo.delmarcargo.com }
    - use_backend www-elllax.wisegrid.net if { hdr(host),field(1,:) -i portals.extralogistics.com }
    - use_backend www-l77pro.wisegrid.net if { hdr(host),field(1,:) -i freighttracker.livingston.com }
    - use_backend www-l77trn.wisegrid.net if { hdr(host),field(1,:) -i freighttracker-training.livingston.com }
    - use_backend www-lopent.wisegrid.net if { hdr(host),field(1,:) -i neo.eworldplus.com }
    - use_backend www-md2prd.wisegrid.net if { hdr(host),field(1,:) -i app.gomardom.com }
    - use_backend www-md2prd.wisegrid.net if { hdr(host),field(1,:) -i app.tlsgo.com }
    - use_backend www-md2prd.wisegrid.net if { hdr(host),field(1,:) -i app.gomcd.com }
    - use_backend lopent.webtracker.wisegrid.net if { hdr(host),field(1,:) -i eworldplus.com }
