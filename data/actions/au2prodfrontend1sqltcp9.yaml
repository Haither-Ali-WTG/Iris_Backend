---
# KEEP IN SYNC: haproxy/au2-prod-frontend-1/ansible-templates/haproxy-prod-sqlreadonly.cfg.j2

sql_allowed:
  description: Rejects requests from non-WTG or non-Customer IPs
  order: 40
  actions:
    - tcp-request content reject if !wtg_src !customerreadonly_src !staff_src !aryaka_src

sql_backends_test:
  description: |
    TEST AU2
    Maps frontend ports (6000+) to specific SQL backends
  order: 50
  actions:
    - use_backend au2wtreadonly401l1-wisegrid-net if { dst_port 6000 }
