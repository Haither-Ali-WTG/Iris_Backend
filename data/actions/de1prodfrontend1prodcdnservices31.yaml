---
peppol_smp_deny_secure_path:
  description: |-
    SMP Prod secure path blocking
  order: 59
  actions:
    - http-request deny if peppol_smp_disallow_secure_path peppol-smp-prod_wisegrid_net

peppol_ap_allow_as4_path:
  description: |-
    AP Prod only allow access to /as4 path
  order: 59
  actions:
    - http-request deny if !peppol_ap_as4_allow_path peppol-ap-prod_wisegrid_net

wca_denied_actions:
  description: |-
    HTTP-request deny for WCA production services denied paths
  order: 59
  actions:
    - http-request deny if !wtg_src wca_denied_paths wca_prod_url

wtg_idp_redirect:
  description: |-
    Redirect requests to the Wisetech IDP to the /login path
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  order: 79
  actions:
    - >-
      redirect location /login if identity_wisetechglobal_com
      !wtg_idp_login_path
      !wtg_idp_account_path
      !wtg_idp_s2s_path

wtg_idp_backend:
  description: |-
    Direct requests for WTG IDP hostnames to the IDP backend
  order: 80
  actions:
    - use_backend de_identity_wisetechglobal_com-login if identity_wisetechglobal_com wtg_idp_login_path
    - use_backend de_identity_wisetechglobal_com-account if identity_wisetechglobal_com wtg_idp_account_path
    - use_backend de_identity_wisetechglobal_com-s2s if identity_wisetechglobal_com wtg_idp_s2s_path

cww_backend:
  description: |-
    Direct requests for CargoWise Web to the CWW catchall backend
  order: 80
  actions:
    - use_backend de_cww_wisegrid_net-catchall if star_cww_wisegrid_net

app_borderwise_backend:
  description: |-
    Direct regional requests for app.borderwise.com to the app borderwise backend
  order: 80
  actions:
    - use_backend app-de_borderwise_com if app_borderwise_com

portal_cwconnector_backend:
  description: |-
    Direct regional requests for portal.cwconnector.wisegrid.net to the portal CWConnector backend
  order: 80
  actions:
    - use_backend portal-de_cwconnector_wisegrid_net if portal_cwconnector_wisegrid_net

compliance_borderwise_backend:
  description: |-
    Direct regional requests for compliance.borderwise.com to the compliance borderwise backend
  order: 80
  actions:
    - use_backend compliance-de_borderwise_com if compliance_borderwise_com

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 80
  actions:
    - redirect scheme https if star_urs_wisegrid_net !{ ssl_fc }

proget_de_wisetechglobal_com_access_control:
  description: |-
    Deny rule for proget-de.wisetechglobal.com
  order: 59
  actions:
    - http-request deny if !wtg_src !azure_ext_controlled_src proget-de_wisetechglobal_com

de1prod2_prodexternal_catchall_backend:
  description: |-
    Direct requests for the openshift
  order: 80
  actions:
    - use_backend de1prod2-prodexternal-catchall if proget-de_wisetechglobal_com azure_ext_controlled_src wtg_src

cmb_de_backend:
  description: |-
    Direct requests for the cmb-prod
  order: 80
  actions:
    - use_backend cmb-de_wisegrid_net if cmb-de_wisegrid_net
