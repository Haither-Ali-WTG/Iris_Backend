---
secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_cfs_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webcampaign_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webprint_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webtracker_wisegrid_net !{ ssl_fc }

cw1_use_dynamic_backend_path:
  description: |-
    Redirect Glow webservice requests to the correct backend based on path
  order: 80
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-glow
        if glow_webservice_path www-star_wisegrid_net

custom_url_actions:
  description: |-
    Customurls for GLOW & Webtracker
  order: 80
  actions:
    ### GLOW
    - use_backend www-l77trn_wisegrid_net if { hdr(host),field(1,:) -i freighttracker-training.livingston.com }
    - use_backend www-mfitrn_wisegrid_net if { hdr(host),field(1,:) -i purchaseordermanagement-test.mainchain.net }
    ### Webtracker
    - use_backend dhxtrn_webtracker_wisegrid_net if { hdr(host),field(1,:) -i mytrnportal.dgxglobal.com }
    - use_backend maltsh_webtracker_wisegrid_net if { hdr(host),field(1,:) -i maltsh2.webtracker.wisegrid.net }
    - use_backend xxxtst_webtracker_wisegrid_net if { hdr(host),field(1,:) -i xxxtstnowwebtracker.wisegrid.net }
    - use_backend xxxtst_webtracker_wisegrid_net if { hdr(host),field(1,:) -i xxxtstschenkerwebtracker.wisegrid.net }
