---
# KEEP IN SYNC: haproxy/de1-prod-frontend-1/ansible-templates/haproxy-prod-sqlreadonly.cfg.j2

sql_allowed:
  description: Rejects requests from non-WTG or non-Customer IPs
  order: 40
  actions:
    - tcp-request content reject if !wtg_src !customerreadonly_src !staff_src !aryaka_src

sql_backends_test:
  description: |
    TEST DE1
    Maps frontend ports (3000+) to specific SQL backends
  order: 50
  actions:
    - use_backend de1wtreadonly401l1-wisegrid-net if { dst_port 3000 }
    - use_backend de1wtreadonly402l1-wisegrid-net if { dst_port 3001 }
    - use_backend de1wtreadonly403l1-wisegrid-net if { dst_port 3002 }
    - use_backend de1wtreadonly404l1-wisegrid-net if { dst_port 3003 }
    - use_backend de1wtreadonly405l1-wisegrid-net if { dst_port 3004 }
    - use_backend de1wtreadonly406l1-wisegrid-net if { dst_port 3005 }
    - use_backend de1wtreadonly407l1-wisegrid-net if { dst_port 3017 }
    - use_backend de1wtreadonly408l1-wisegrid-net if { dst_port 3027 }
    - use_backend de1wtreadonly409l1-wisegrid-net if { dst_port 3028 }

sql_backends_prod:
  description: |
    PROD De1
