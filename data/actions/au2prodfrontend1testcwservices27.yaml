---
secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_cfs_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webcampaign_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webprint_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webtracker_wisegrid_net !{ ssl_fc }

cw1_use_dynamic_backend_path:
  description: |-
    Redirect Glow webservice requests to the correct backend based on path
  order: 80
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-glow
        if glow_webservice_path www-star_wisegrid_net

custom_url_actions:
  description: |-
    Customurls for Webprint & Webtracker
  order: 80
  actions:
    ### Webprint
    - use_backend h43tr1_webprint_wisegrid_net if { hdr(host),field(1,:) -i h43tr1-cn.webprint.wisegrid.net }
    - use_backend h43tr2_webprint_wisegrid_net if { hdr(host),field(1,:) -i h43tr2-cn.webprint.wisegrid.net }
    - use_backend h43tr3_webprint_wisegrid_net if { hdr(host),field(1,:) -i h43tr3-cn.webprint.wisegrid.net }

    ### Webtracker
    - use_backend h43tr1_webtracker_wisegrid_net if { hdr(host),field(1,:) -i h43tr1webtracker.wisegrid.net }
    - use_backend h43tr2_webtracker_wisegrid_net if { hdr(host),field(1,:) -i h43tr2webtracker.wisegrid.net }
    - use_backend h43tr3_webtracker_wisegrid_net if { hdr(host),field(1,:) -i h43tr3webtracker.wisegrid.net }
    - use_backend h43trn_webtracker_wisegrid_net if { hdr(host),field(1,:) -i h43trnwebtracker.wisegrid.net }
    - use_backend zsotrn_webtracker_wisegrid_net if { hdr(host),field(1,:) -i zsotrnwebtracker.wisegrid.net }
