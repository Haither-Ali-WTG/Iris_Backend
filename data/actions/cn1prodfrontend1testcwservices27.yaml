---
capture_soapaction_header:
  description: |-
    Capture SOAPAction header for /eAdapterStreamedService.svc
  order: 50
  actions:
    - http-request set-var(txn.custom_log_soapaction) str()
    - http-request set-var(txn.custom_log_soapaction) req.hdr(SOAPAction) if eadapter_streamed_service_path

secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_wisetechglobal_cn !{ ssl_fc }

cw1_use_dynamic_backend_path:
  description: |-
    Redirect Glow webservice requests to the correct backend based on path
  order: 80
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-glow
        if glow_webservice_path www-star_wisetechglobal_cn
