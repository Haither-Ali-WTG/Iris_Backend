---
secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_cfs_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webcampaign_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webprint_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webtracker_wisegrid_net !{ ssl_fc }

cw1_use_dynamic_backend_path:
  description: |-
    Redirect Glow webservice requests to the correct backend based on path
  order: 80
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-glow
        if glow_webservice_path www-star_wisegrid_net

custom_url_actions:
  description: |-
    Customurls for GLOW & Webtracker
  order: 80
  actions:
    ### Webtracker
    - use_backend cvhven_webtracker_wisegrid_net if { hdr(host),field(1,:) -i dashboard.caroz.com }
    - use_backend gf6prd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i www.ecarrier.greencarrier.com }
    - use_backend gf6prd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i ecarrier.greencarrier.com }
    - use_backend gknrdd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i forwarding.gknfreightservices.com }
    - use_backend h47prd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i www.webtracker.hecksher.com }
    - use_backend jgshul_webtracker_wisegrid_net if { hdr(host),field(1,:) -i webtracker.johngood.co.uk }
    - use_backend je6lpr_webtracker_wisegrid_net if { hdr(host),field(1,:) -i webtrack.jenkar.com }
    - use_backend sozprd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i tracking.sozologistics.com }
    - use_backend vanhkf_webtracker_wisegrid_net if { hdr(host),field(1,:) -i vanhkfbts.webtracker.wisegrid.net }
    - use_backend vanhkf_webtracker_wisegrid_net if { hdr(host),field(1,:) -i vanhkfnvo.webtracker.wisegrid.net }
    - use_backend g42prd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i g42prd2.webtracker.wisegrid.net }
    - use_backend sllwho_webtracker_wisegrid_net if { hdr(host),field(1,:) -i sllwho2.webtracker.wisegrid.net }
    - use_backend gu1prd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i gu1prd2.webtracker.wisegrid.net }
    - use_backend gf6prd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i gf6prd2.webtracker.wisegrid.net }
    - use_backend gf6prd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i gf6prd3.webtracker.wisegrid.net }
    - use_backend zifprd_webtracker_wisegrid_net if { hdr(host),field(1,:) -i zifprd2.webtracker.wisegrid.net }

    ### Webprint
    - use_backend vanhkf_webprint_wisegrid_net if { hdr(host),field(1,:) -i vanhkfbts.webprint.wisegrid.net }
    - use_backend vanhkf_webprint_wisegrid_net if { hdr(host),field(1,:) -i vanhkfnvo.webprint.wisegrid.net }

    ### GLOW
    - use_backend www-dehprd_wisegrid_net if { hdr(host),field(1,:) -i customerportal.deugro.com }
    - use_backend www-icomik_wisegrid_net if { hdr(host),field(1,:) -i conexa.intercargo.com }
