xndt_url_workaround:
  description: |-
    Deny any connections to XNDT webservices if not from WTG or T89 allowed IPs
  order: 81
  actions:
    - http-request deny if { hdr(host),field(1,:) -i t89prdxndt.wisegrid.net } !t89_allowed_ips !wtg_src
