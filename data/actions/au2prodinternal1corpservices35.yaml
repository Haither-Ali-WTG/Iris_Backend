---
https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisetechglobal_com !{ ssl_fc }
    - redirect scheme https if star_wtg_zone !{ ssl_fc }
    - redirect scheme https if knowledge_mcp_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_cargowise_com !{ ssl_fc }
    - redirect scheme https if star_iris-stats_wtg_zone !{ ssl_fc }

restrict_iris_stats_url:
  description: |-
    Allow iris stats url only from jumphost src
  order: 6
  actions:
    - http-request deny if !jumphost_src iris_stats_urls
