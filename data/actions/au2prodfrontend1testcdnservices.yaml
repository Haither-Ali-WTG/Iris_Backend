---
wtg_idp_redirect:
  description: |-
    Redirect requests to the Wisetech IDP to the /login path
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  order: 79
  actions:
    - >-
      redirect location /login if staging_identity_wisetechglobal_com
      !wtg_idp_login_path
      !wtg_idp_account_path
      !wtg_idp_s2s_path

wtg_idp_backend:
  description: |-
    Direct requests for WTG IDP hostnames to the IDP backend
  order: 80
  actions:
    - use_backend staging-au_identity_wisetechglobal_com-login if staging_identity_wisetechglobal_com wtg_idp_login_path
    - >-
      use_backend staging-au_identity_wisetechglobal_com-account if
      staging_identity_wisetechglobal_com wtg_idp_account_path
    - >-
      use_backend staging-au_identity_wisetechglobal_com-s2s if
      staging_identity_wisetechglobal_com wtg_idp_s2s_path

cww_nonprd_backend:
  description: |-
    Direct requests for CargoWise Web to the CWW catchall backend
  order: 80
  actions:
    - use_backend au_cww-nonprd_wisegrid_net-catchall if star_cww-nonprd_wisegrid_net

cww_wisetechglobal_com_backend:
  description: |-
    Direct requests for CargoWise Web Corp sites to the CWW catchall backend
  order: 80
  actions:
    - >-
      use_backend au_cww_wisetechglobal_com-catchall if
      { hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww\.wisetechglobal\.com$ }
    - use_backend au_cww_wisetechglobal_com-catchall if { hdr(host),field(1,:) -i ediprod.cw.wisetechglobal.com }

app_test_borderwise_backend:
  description: |-
    Direct regional requests for app.borderwise.com to the app borderwise backend
  order: 80
  actions:
    - use_backend app-test-au_borderwise_com if app-test_borderwise_com

star_staging_transport_wisetechglobal_com_api_backend:
  description: |-
    Direct requests to the /api path for staging CTO transport portal to the /api backend
  order: 80
  actions:
    - >-
      use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-api if
      { hdr(host),field(1,:) -m reg -i ^([^\.]+)?-staging\.transport\.wisetechglobal\.com$ } { path_beg -i /api }

testtariff_management_portal_backend:
  description: |-
    Direct requests for the Test Borderwise Tariff Management Portal to the catchall backend
  order: 80
  actions:
    - use_backend testtmp_borderwise_com-catchall if star_testtmp_borderwise_com
