---
peppol_smp_deny_secure_path:
  description: |-
    SMP Test secure path blocking
  order: 59
  actions:
    - http-request deny if peppol_smp_disallow_secure_path peppol-smp-test_wisegrid_net

peppol_ap_allow_as4_path:
  description: |-
    AP Test only allow access to /as4 path
  order: 59
  actions:
    - http-request deny if !peppol_ap_as4_allow_path peppol-ap-test_wisegrid_net

wtg_idp_redirect:
  description: |-
    Redirect requests to the Wisetech IDP to the /login path
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  order: 79
  actions:
    - >-
      redirect location /login if staging_identity_wisetechglobal_com
      !wtg_idp_login_path
      !wtg_idp_account_path
      !wtg_idp_s2s_path

wtg_idp_backend:
  description: |-
    Direct requests for WTG IDP hostnames to the IDP backend
  order: 80
  actions:
    - use_backend staging-de_identity_wisetechglobal_com-login if staging_identity_wisetechglobal_com wtg_idp_login_path
    - >-
      use_backend staging-de_identity_wisetechglobal_com-account if
      staging_identity_wisetechglobal_com wtg_idp_account_path
    - >-
      use_backend staging-de_identity_wisetechglobal_com-s2s if
      staging_identity_wisetechglobal_com wtg_idp_s2s_path

cww_nonprd_backend:
  description: |-
    Direct requests for CargoWise Web to the CWW catchall backend
  order: 80
  actions:
    - use_backend de_cww-nonprd_wisegrid_net-catchall if star_cww-nonprd_wisegrid_net

app_test_borderwise_backend:
  description: |-
    Direct regional requests for app.borderwise.com to the app borderwise backend
  order: 80
  actions:
    - use_backend app-test-de_borderwise_com if app-test_borderwise_com
