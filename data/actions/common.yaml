---
# common actions
client_ip_vars:
  description: |-
    Populate txn.client_ip and txn.traffic_src for logging/ACLs.
    txn.client_ip represents the end-user IP (direct or via Cloudflare).
  order: 1
  actions:
    - >-
      http-request set-header X-WTG-Untrusted-Forwarded-For %[req.hdr(X-Forwarded-For)]
      if { req.hdr(X-Forwarded-For) -m found }
    - http-request set-var(txn.raw_client_ip) src
    - http-request set-var(txn.client_ip) src if !cloudflare_src
    - http-request set-var(txn.client_ip) hdr(CF-Connecting-IP) if cloudflare_src
    - http-request set-var(txn.traffic_src) str(direct) if !cloudflare_src
    - http-request set-var(txn.traffic_src) str(cloudflare) if cloudflare_src

transport_security:
  description: |-
    Transport security options
  order: 2
  actions:
    - http-response set-header Strict-Transport-Security max-age=31536000;\ includeSubdomains;\ preload
    - http-response set-header X-Content-Type-Options nosniff

omit_unnecessary_info:
  description: |-
    Remove X-Powered-By and Server headers, which are optional and leak information
    about our webservers that could potentially be used by attackers.
  order: 3
  actions:
    - http-response del-header X-Powered-By
    - http-response del-header Server

single_content_length:
  description: |-
    CVE-2021-40346 mitigation - https://nvd.nist.gov/vuln/detail/CVE-2021-40346
  order: 5
  actions:
    - http-request deny if { req.hdr_cnt(content-length) gt 1 }
    - http-response deny if { res.hdr_cnt(content-length) gt 1 }

forwarded_headers:
  description: |-
    Enforce X-Forwarded-Proto and X-Forwarded-Host
  order: 8
  actions:
    - http-request set-header X-Forwarded-Proto https if { ssl_fc }
    - http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    - http-request set-header X-Forwarded-Host %[req.hdr(Host)]

client_cert:
  description: |-
    Attributes required from client cert
    TODO work with customer to ensure SHA1 isn't in use
  order: 10
  actions:
    - http-request set-header X-SSL                       %[ssl_fc]
    - http-request set-header X-SSL-Client-Verify         %[ssl_c_verify]
    - http-request set-header X-SSL-Client-SHA1           %{+Q}[ssl_c_sha1,hex]
    - http-request set-header X-SSL-Client-DN             %{+Q}[ssl_c_s_dn]
    - http-request set-header X-SSL-Client-CN             %{+Q}[ssl_c_s_dn(cn)]
    - http-request set-header X-SSL-Issuer                %{+Q}[ssl_c_i_dn]
    - http-request set-header X-SSL-Client-Not-Before     %{+Q}[ssl_c_notbefore]
    - http-request set-header X-SSL-Client-Serial         %{+Q}[ssl_c_serial,hex]
    - http-request set-header X-SSL-Client-Version        %{+Q}[ssl_c_version]

default_backend:
  description: Default backend selection
  order: 99
  actions:
    - use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]

secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie
