---
wca_denied_actions:
  description: |-
    HTTP-request deny for WCA production services denied paths
  order: 59
  actions:
    - http-request deny if !wtg_src wca_denied_paths wca_prod_url

wtg_idp_redirect:
  description: |-
    Redirect requests to the Wisetech IDP to the /login path
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  order: 79
  actions:
    - >-
      redirect location /login if identity_wisetechglobal_com
      !wtg_idp_login_path
      !wtg_idp_account_path
      !wtg_idp_s2s_path

wtg_idp_backend:
  description: |-
    Direct requests for WTG IDP hostnames to the IDP backend
  order: 80
  actions:
    - use_backend us_identity_wisetechglobal_com-login if identity_wisetechglobal_com wtg_idp_login_path
    - use_backend us_identity_wisetechglobal_com-account if identity_wisetechglobal_com wtg_idp_account_path
    - use_backend us_identity_wisetechglobal_com-s2s if identity_wisetechglobal_com wtg_idp_s2s_path

cww_backend:
  description: |-
    Direct requests for CargoWise Web to the CWW catchall backend
  order: 80
  actions:
    - use_backend us_cww_wisegrid_net-catchall if star_cww_wisegrid_net

app_borderwise_backend:
  description: |-
    Direct regional requests for app.borderwise.com to the app borderwise backend
  order: 80
  actions:
    - use_backend app-us_borderwise_com if app_borderwise_com

portal_cwconnector_backend:
  description: |-
    Direct regional requests for portal.cwconnector.wisegrid.net to the portal CWConnector backend
  order: 80
  actions:
    - use_backend portal-us_cwconnector_wisegrid_net if portal_cwconnector_wisegrid_net

compliance_borderwise_backend:
  description: |-
    Direct regional requests for compliance.borderwise.com to the compliance borderwise backend
  order: 80
  actions:
    - use_backend compliance-us_borderwise_com if compliance_borderwise_com

# Umbraco admin path security
umbraco_admin_security:
  description: "Deny access to Umbraco admin paths across sites"
  order: 59
  actions:
    - http-request deny if !wtg_src umbraco_denied_path www_wisetechglobal_com
    - http-request deny if !wtg_src umbraco_denied_path dot_wisetechglobal_com
    - http-request deny if !wtg_src umbraco_denied_path www_local_wisetechglobal_com
    - http-request deny if !wtg_src umbraco_denied_path www_local_cargowise_com
    - http-request deny if !wtg_src umbraco_denied_path forms_wisetechglobal_com
    - http-request deny if !wtg_src umbraco_denied_path partners_wisetechglobal_com
    - http-request deny if !wtg_src umbraco_denied_path www_cargowise_com
    - http-request deny if !wtg_src umbraco_denied_path wisetechglobal_com
    - http-request deny if !wtg_src umbraco_denied_path cargowise_com
    - http-request deny if !wtg_src umbraco_denied_path smartfreight_com
    - http-request deny if !wtg_src umbraco_denied_path pierbridge_com
    - http-request deny if !wtg_src umbraco_denied_path www_pierbridge_com
    - http-request deny if !wtg_src umbraco_denied_path containerchain_com_urls
    - http-request deny if !wtg_src umbraco_denied_path bysoft_com_br
    - http-request deny if !wtg_src umbraco_denied_path cmslive_com_sg
    - http-request deny if !wtg_src umbraco_denied_path opdimize_com
    - http-request deny if !wtg_src umbraco_denied_path opdimize_net
    - http-request deny if !wtg_src umbraco_denied_path opdimizer_com
    - http-request deny if !wtg_src umbraco_denied_path opdimizer_net
    - http-request deny if !wtg_src umbraco_denied_path softship_com
    - http-request deny if !wtg_src umbraco_denied_path www_singeste_com
    - http-request deny if !wtg_src umbraco_denied_path singeste_com
    - http-request deny if !wtg_src umbraco_denied_path www_blumeglobal_com
    - http-request deny if !wtg_src umbraco_denied_path blumeglobal_com

# Special access restrictions
special_access_restrictions:
  description: "Restrict access to special services and internal resources"
  order: 59
  actions:
    - http-request deny if !wtg_src group_wisetechglobal_com
    - http-request deny if !wtg_src exchange_denied_path
    - http-request deny if !wtg_src sfb_denied_path
    - http-request deny if !wtg_src wpad_wisetechglobal_com_host
    - http-request deny if !wtg_src !awsr53_src star_identity_wisetechglobal_com

# Identity staging access control
identity_staging_access:
  description: "Allow access to identity staging endpoints"
  order: 59
  actions:
    - http-request allow if identity_staging_wisetechglobal_com idp_login_path
    - http-request allow if identity_staging_wisetechglobal_com idp_s2s_path
    - http-request allow if identity_staging_wisetechglobal_com idp_account_path

# External domain redirects
external_domain_redirects:
  description: "Redirect external domains to WiseTech sites"
  order: 79
  actions:
    - redirect location https://www.wisetechglobal.com if redirects_to_wisetechglobal_com
    - redirect location https://smartfreight.com if redirects_to_smartfreight_com_urls
    - >-
      redirect location https://www.linkedin.com/checkpoint/enterprise/login/75714794?application=learning
      if linkedinlearning_redirected_urls
    - redirect location https://stackoverflow.com/c/wisetechglobal if stackoverflow_redirected_urls
    - redirect location https://web.saastransportation.com code 307 if saas_transportation_redirect

# Identity staging default redirect
identity_staging_default_redirect:
  description: "Redirect identity staging to login page"
  order: 79
  actions:
    - >-
      redirect location /login if identity_staging_wisetechglobal_com
      !idp_login_path !idp_account_path !idp_s2s_path

# Domain normalization redirects - www to non-www
www_to_non_www_redirects:
  description: "Redirect www to non-www for specific domains"
  order: 79
  actions:
    - redirect prefix https://pierbridge.com code 301 if www_pierbridge_com
    - redirect prefix https://cargoguide.com code 301 if www_cargoguide_com
    - redirect prefix https://cargosphere.com code 301 if www_cargosphere_com
    - redirect prefix https://transportsystems.com.au code 301 if www_transportsystems_com_au
    - redirect prefix https://sistemaforward.com code 301 if www_sistemaforward_com
    - redirect prefix https://softcargo.com.uy code 301 if www_softcargo_com_uy

# Domain normalization redirects - non-www to www
non_www_to_www_redirects:
  description: "Redirect non-www to www for specific domains"
  order: 79
  actions:
    - redirect prefix https://www.bysoft.com.br code 301 if bysoft_com_br
    - redirect prefix https://www.containerchain.com code 301 if containerchain_com
    - redirect prefix https://www.cmslive.com.sg code 301 if cmslive_com_sg
    - redirect prefix https://www.sisa.ch code 301 if sisa_ch
    - redirect prefix https://www.smartfreight.co.za code 301 if smartfreight_co_za
    - redirect prefix https://www.softship.com code 301 if softship_com
    - redirect prefix https://www.opdimize.com code 301 if opdimize_com
    - redirect prefix https://www.opdimize.net code 301 if opdimize_net
    - redirect prefix https://www.opdimizer.com code 301 if opdimizer_com
    - redirect prefix https://www.opdimizer.net code 301 if opdimizer_net
    - redirect prefix https://www.intris.be code 301 if intris_be
    - redirect prefix https://www.datafreight.co.uk code 301 if datafreight_co_uk
    - redirect prefix https://www.abmdata.ie code 301 if abmdata_ie
    - redirect prefix https://www.abmdatasystems.com code 301 if abmdatasystems_com
    - redirect prefix https://www.customsware.com code 301 if customsware_com
    - redirect prefix https://www.acoinformatica.it code 301 if acoinformatica_it
    - redirect prefix https://www.cargoit.se code 301 if cargoit_se
    - redirect prefix https://www.customsmatters.com code 301 if customsmatters_com
    - redirect prefix https://www.depotsystems.com code 301 if depotsystems_com
    - redirect prefix https://www.depotmobile.com code 301 if depotmobile_com
    - redirect prefix https://www.easy-log.fr code 301 if easy-log_fr
    - redirect prefix https://www.fenix.com code 301 if fenix_com
    - redirect prefix https://www.lspsolutions.com code 301 if lspsolutions_com
    - redirect prefix https://www.microlistics.com.au code 301 if microlistics_com_au
    - redirect prefix https://www.pllink.com code 301 if pllink_com
    - redirect prefix https://www.readykorea.co.kr code 301 if readykorea_co_kr
    - redirect prefix https://www.readykorea.com code 301 if readykorea_com
    - redirect prefix https://www.systema.no code 301 if systema_no
    - redirect prefix https://www.ulukom.com.tr code 301 if ulukom_com_tr
    - redirect prefix https://www.xware.com code 301 if xware_com
    - redirect prefix https://www.xware.se code 301 if xware_se
    - redirect prefix https://www.znet-group.com code 301 if znet-group_com
    - redirect prefix https://www.inobiz.se code 301 if inobiz_se
    - redirect prefix https://www.sadec.pl code 301 if sadec_urls
    - redirect prefix https://www.singeste.com code 301 if singeste_com

# Taric and related domain redirects
taric_domain_redirects:
  description: "Redirect taric domains to www variants"
  order: 79
  actions:
    - redirect prefix https://www.taric.es code 301 if taric_urls
    - redirect prefix https://www.tarictrans.com code 301 if tarictrans_urls
    - redirect prefix https://www.taric.es code 301 if taric_es
    - redirect prefix https://www.taric.com code 301 if taric_com
    - redirect prefix https://www.tarictrans.com code 301 if tarictrans_com
    - redirect prefix https://www.tarictrans.es code 301 if tarictrans_es

# HTTP to HTTPS enforcement
http_to_https_redirects:
  description: "Force HTTPS for certificate-covered domains"
  order: 79
  actions:
    - redirect scheme https if group_wisetechglobal_com_certificate_covered_domains !{ ssl_fc }
    - redirect scheme https if star_wisetechglobal_com !{ ssl_fc }
    - redirect scheme https if star_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_shipamax_com !{ ssl_fc }
    - redirect scheme https if star_cargowise_net !{ ssl_fc } !cargowise_net_excluded_from_redirect
    - redirect scheme https if star_borderwise_com !{ ssl_fc }
    - redirect scheme https if star_cargowise_com !{ ssl_fc } !cargowise_excluded_from_redirect
    - redirect scheme https if star_identity_wisetechglobal_com !{ ssl_fc }

# Identity staging backend routing
identity_staging_backend_routing:
  description: "Route identity staging requests to appropriate backends"
  order: 80
  actions:
    - >-
      use_backend identity-staging_wisetechglobal_com_login
      if identity_staging_wisetechglobal_com idp_login_path
    - >-
      use_backend identity-staging_wisetechglobal_com_s2s
      if identity_staging_wisetechglobal_com idp_s2s_path
    - >-
      use_backend identity-staging_wisetechglobal_com_account
      if identity_staging_wisetechglobal_com idp_account_path
    - >-
      use_backend tailwindtransportationsoftware_com
      if www_tailwindtransportationsoftware_com

proget_us_wisetechglobal_com_access_control:
  description: |-
    Deny rule for proget-us.wisetechglobal.com
  order: 59
  actions:
    - http-request deny if !wtg_src !azure_ext_controlled_src proget-us_wisetechglobal_com

us2prod2_prodexternal_catchall_backend:
  description: |-
    Direct requests for the openshift
  order: 80
  actions:
    - use_backend us2prod2-prodexternal-catchall if proget-us_wisetechglobal_com azure_ext_controlled_src wtg_src

cmb_us_backend:
  description: |-
    Direct requests for the cmb-prod
  order: 80
  actions:
    - use_backend cmb-us_wisegrid_net if cmb-us_wisegrid_net
