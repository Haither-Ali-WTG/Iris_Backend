---
wca_denied_actions:
  description: |-
    HTTP-request deny for WCA production services denied paths
  order: 59
  actions:
    - http-request deny if !wtg_src wca_denied_paths wca_prod_url

wtg_idp_redirect:
  description: |-
    Redirect requests to the Wisetech IDP to the /login path
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  order: 79
  actions:
    - >-
      redirect location /login if identity_wisetechglobal_com
      !wtg_idp_login_path
      !wtg_idp_account_path
      !wtg_idp_s2s_path

wtg_idp_backend:
  description: |-
    Direct requests for WTG IDP hostnames to the IDP backend
  order: 80
  actions:
    - use_backend us_identity_wisetechglobal_com-login if identity_wisetechglobal_com wtg_idp_login_path
    - use_backend us_identity_wisetechglobal_com-account if identity_wisetechglobal_com wtg_idp_account_path
    - use_backend us_identity_wisetechglobal_com-s2s if identity_wisetechglobal_com wtg_idp_s2s_path

cww_backend:
  description: |-
    Direct requests for CargoWise Web to the CWW catchall backend
  order: 80
  actions:
    - use_backend us_cww_wisegrid_net-catchall if star_cww_wisegrid_net

app_borderwise_backend:
  description: |-
    Direct regional requests for app.borderwise.com to the app borderwise backend
  order: 80
  actions:
    - use_backend app-us_borderwise_com if app_borderwise_com

portal_cwconnector_backend:
  description: |-
    Direct regional requests for portal.cwconnector.wisegrid.net to the portal CWConnector backend
  order: 80
  actions:
    - use_backend portal-us_cwconnector_wisegrid_net if portal_cwconnector_wisegrid_net

compliance_borderwise_backend:
  description: |-
    Direct regional requests for compliance.borderwise.com to the compliance borderwise backend
  order: 80
  actions:
    - use_backend compliance-us_borderwise_com if compliance_borderwise_com

