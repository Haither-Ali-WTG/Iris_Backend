---
wca_denied_actions:
  description: |-
    HTTP-request deny for WCA production services denied paths
  order: 59
  actions:
    - http-request deny if !wtg_src wca_denied_paths wca_prod_url

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 80
  actions:
    - redirect scheme https if star_urs_wisegrid_net !{ ssl_fc }
