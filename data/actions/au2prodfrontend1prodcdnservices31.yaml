portconnect_wisegrid_net_backend:
  description: |-
    Direct requests for ca-webhooks.wisegrid.net to the PortConnect backend
  order: 80
  actions:
    - use_backend portconnect_wisegrid_net if { hdr(host),field(1,:) -i ca-webhooks.wisegrid.net }

cw_wisetechglobal_com_catch_all_backend:
  description: |-
    Direct requests for *.cw.wisetechglobal.com to the Winzor backend
  order: 80
  actions:
    - use_backend cw_wisetechglobal_com_catch_all if winzor_corp_urls

proget_au_wisetechglobal_com_access_control:
  description: |-
    Deny rule for proget-au.wisetechglobal.com
  order: 25
  actions:
    - http-request deny if !wtg_src !azure_ext_controlled_src proget-au_wisetechglobal_com

au2prod2_prodexternal_catchall_backend:
  description: |-
    Direct requests for the openshift
  order: 80
