external_service_redirects:
  description: |-
    Redirects to external authentication and service endpoints
  order: 79
  actions:
    - >-
      redirect location https://www.linkedin.com/checkpoint/enterprise/login/75714794?application=learning
      if linkedinlearning_redirected_urls
    - redirect location https://stackoverflow.com/c/wisetechglobal if stackoverflow_redirected_urls
    - redirect location https://www.wisetechglobal.com if redirects_to_wisetechglobal_com_urls
    - redirect location https://smartfreight.com if redirects_to_smartfreight_com_urls
    - redirect location https://web.saastransportation.com code 307 if saastransportation_urls
    - redirect location https://account.parkable.com if redirects_to_account_parkable_com_urls

https_redirects:
  description: |-
    Force HTTPS for corporate domains
  order: 79
  actions:
    - redirect scheme https if group_wisetechglobal_com_certificate_covered_domains !{ ssl_fc }
    - redirect scheme https if star_wisetechglobal_com !{ ssl_fc }
    - redirect scheme https if star_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_borderwise_com !{ ssl_fc }
    - redirect scheme https if star_shipamax_com !{ ssl_fc }
    - >-
      redirect scheme https if star_cargowise_com !{ ssl_fc }
      !cargowise_com_exluded_from_default_redirect !cargowise_com_myaccount_services_path
    - redirect scheme https if star_cargowise_net !{ ssl_fc } !cargowise_net_exluded_from_default_redirect

