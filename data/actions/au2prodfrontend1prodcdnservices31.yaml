---
cloudflare_ip:
  description: |-
    Set source IP based on cloudflare header for cloudflare traffic
  order: 1
  actions:
    - http-request set-src hdr(cf-connecting-ip) if cloudflare_src

wtg_true_client_ip_header:
  description: |-
    Set true client IP header for IP whitelisting in applications
  order: 59
  actions:
    - http-request set-header WTG-True-Client-IP %[src] if { hdr(host),field(1,:) -i gsswebhooks.wisegrid.net }

wtg_idp_redirect:
  description: |-
    Redirect requests to the Wisetech IDP to the /login path
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  order: 79
  actions:
    - >-
      redirect location /login if
      identity_wisetechglobal_com
      !wtg_idp_login_path
      !wtg_idp_account_path
      !wtg_idp_s2s_path

wtg_idp_backend:
  description: |-
    Direct requests for WTG IDP hostnames to the IDP backend
  order: 80
  actions:
    - use_backend au_identity_wisetechglobal_com-login if identity_wisetechglobal_com wtg_idp_login_path
    - use_backend au_identity_wisetechglobal_com-account if identity_wisetechglobal_com wtg_idp_account_path
    - use_backend au_identity_wisetechglobal_com-s2s if identity_wisetechglobal_com wtg_idp_s2s_path

cww_backend:
  description: |-
    Direct requests for CargoWise Web to the CWW catchall backend
  order: 80
  actions:
    - use_backend au_cww_wisegrid_net-catchall if star_cww_wisegrid_net

app_borderwise_backend:
  description: |-
    Direct regional requests for app.borderwise.com to the app borderwise backend
  order: 80
  actions:
    - use_backend app-au_borderwise_com if app_borderwise_com

portal_cwconnector_backend:
  description: |-
    Direct regional requests for portal.cwconnector.wisegrid.net to the portal CWConnector backend
  order: 80
  actions:
    - use_backend portal-au_cwconnector_wisegrid_net if portal_cwconnector_wisegrid_net

compliance_borderwise_backend:
  description: |-
    Direct regional requests for compliance.borderwise.com to the compliance borderwise backend
  order: 80
  actions:
    - use_backend compliance-au_borderwise_com if compliance_borderwise_com

tariff_management_portal_backend:
  description: |-
    Direct requests for the production Borderwise Tariff Management Portal to the catchall backend
  order: 80
  actions:
    - use_backend tmp_borderwise_com-catchall if star_tmp_borderwise_com

deny_myaccount_protected_paths:
  description: |-
    Deny access to MyAccount protected paths
  order: 25
  actions:
    - >-
      http-request deny if
      !wtg_src { hdr(host),field(1,:) -i myaccount-portal.cargowise.com } cargowise_com_myaccount_denied_paths
    - >-
      http-request deny if
      !wtg_src { hdr(host),field(1,:) -i myaccount.cargowise.com } { path_beg -i /SuperuserLogin.aspx }

myaccount_portal_cargowise_com_backend:
  description: |-
    Direct Glow or Portals requests for myaccount-portal.cargowise.com to the the right backend
  order: 80
  actions:
    - >-
      use_backend myaccount-portal_cargowise_com_glow if
      { hdr(host),field(1,:) -i myaccount-portal.cargowise.com } { path_beg -i /Glow/ }
    - >-
      use_backend myaccount-portal_cargowise_com_portals if
      { hdr(host),field(1,:) -i myaccount-portal.cargowise.com } { path_beg -i /Portals/ }
    - >-
      use_backend myaccount-portal_cargowise_com if
      { hdr(host),field(1,:) -m reg -i ^(www\.)?cargowise\.com$ } { path_beg -i /myaccount }
