---
# CS02301482 - Sistemas Casa HAProxy Configuration - ADUANAS MEX
transport_security:  # This is meant to override the default in common.yaml
  description: |-
    Modify transport security options based on previous instances
  order: 2
  actions:
    - http-response set-header X-Content-Type-Options nosniff
    - http-response set-header Referrer-Policy strict-origin-when-cross-origin
    - http-response set-header Strict-Transport-Security "max-age=63072000;\ includeSubdomains;\ preload"

set_frame_options:
  description: |-
    Prevent loading pages in a frame
  order: 11
  actions:
    - http-response set-header X-Frame-Options DENY

set_permissions_policy_header:
  description: |-
    Set Permissions-Policy header present in all previous Sistemas Casa HAProxy instances
  order: 12
  actions:
    - >-
      http-response set-header Permissions-Policy "geolocation=(), microphone=(),
      camera=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(),
      autoplay=(), fullscreen=(self), payment=(), clipboard-write=(self)"

set_content_security_policy:
  description: |-
    Limit frame ancestors
  order: 13
  actions:
    - >-
      http-response set-header Content-Security-Policy "frame-ancestors
      https://normativo.e-casa.com.mx https://www.casaonline.mx
      https://www.almer.com.mx"
    - http-response del-header Server

ssl_redirects:
  description: |-
    Do SSL redirects
  order: 79
  actions:
    - redirect scheme https if star_guia-aduanal_com_mx   !{ ssl_fc }
    - redirect scheme https if star_aduanas-mexico_com_mx !{ ssl_fc }
    - redirect scheme https if star_sistemascasa_com      !{ ssl_fc }
    - redirect scheme https if star_e-casa_com_mx         !{ ssl_fc }
backend_selection:
  description: |-
    Handle backend selection.
  order: 80
  actions:
    - use_backend us2mx0apppw011_sistemascasa_hosting       if host_server1_url
    - use_backend us2mx0apppl011_sistemascasa_hosting       if host_server12_url
