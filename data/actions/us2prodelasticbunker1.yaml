---
restrict_ip:
  description: |-
    Restrict http request based on IP
  order: 10
  actions:
    - http-request deny if !elastic_src

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 50
  actions:
    - redirect scheme https if star_us2s3-b1_wtg_ws !{ ssl_fc }

star_us2s3_b1_wtg_ws:
  description: |-
    Backend for backups targeting SY6 bunker from Elastic Nodes in US2
  order: 90
  actions:
    - use_backend star_us2s3-b1_wtg_ws if star_us2s3-b1_wtg_ws

star_us2s3_11_wtg_ws:
  description: |-
    Backend for Elastic monitoring NAS11 FB in US2
  order: 92
  actions:
    - use_backend star_us2s3-11_wtg_ws if star_us2s3-11_wtg_ws
