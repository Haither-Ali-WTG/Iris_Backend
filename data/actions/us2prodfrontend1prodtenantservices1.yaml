    - http-request deny                                     if !usq_akamai_src pulse-qa_livesource_com
    - http-request deny                                     if !usq_akamai_src pulse-demo_livesource_com
    - http-request deny                                     if !usq_akamai_src services02_livesource_com
    - http-request deny                                     if !usq_akamai_src services-api-qa_livesource_com
    - http-request deny                                     if !usq_akamai_src star-qa_livesource_com
    - http-request deny                                     if !usq_akamai_src star-demo_livesource_com
    - http-request deny                                     if !usq_akamai_src star-qa_livesource_com
