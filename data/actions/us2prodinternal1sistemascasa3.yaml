---
# CS02323124 - Sistemas Casa Prevalidador Dev
transport_security:
  description: |-
    Transport security options
  order: 2
  actions:
    - http-response set-header X-Content-Type-Options nosniff
    - http-response set-header Referrer-Policy strict-origin-when-cross-origin
    - http-response set-header Strict-Transport-Security "max-age=31536000;\ includeSubdomains;\ preload"

set_permissions_policy_header:
  description: |-
    Set Permissions-Policy header present in all previous Sistemas Casa HAProxy instances
  order: 11
  actions:
    - >-
      http-response set-header Permissions-Policy "geolocation=(), microphone=(),
      camera=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(),
      autoplay=(), fullscreen=(self), payment=(), clipboard-write=(self)"

remove_server_header:
  description: |-
    Remove "Server" header
  order: 12
  actions:
    - http-response del-header Server

frame_ancestors:
  description: |-
    Set frame ancestors
  order: 13
  actions:
    - >-
      http-response set-header Content-Security-Policy "frame-ancestors
      https://epreval-desarrollo.sistemascasa.com" if app_url

app_rejections:
  description: |-
    Reject app connection attempts under specific circumstances
  order: 14
  actions:
    - http-request deny if app_url is_sql_injection
    - http-request allow if app_url allowed_path

ssl_redirects:
  description: |-
    Do SSL redirects
  order: 79
  actions:
    - redirect scheme https if star_sistemascasa_com   !{ ssl_fc }

backend_selection:
  description: |-
    Handle backend selection.
  order: 80
  actions:
    - use_backend us2mx0appdl001_sistemascasa_hosting   if app_url
    - use_backend wsnodes-ssl_sistemascasa_hosting      if app_url port_7070
    - use_backend wsnodes_sistemascasa_hosting          if port_8060
    - use_backend us2mx0gradl001_sistemascasa_hosting   if graylogbk_url port_9878
    - use_backend us2mx0pgadl002_sistemascasa_hosting   if monitor_pgadmin_url port_40
