---
secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisetechglobal_com !{ ssl_fc }
    - redirect scheme https if star_wtg_zone !{ ssl_fc }

corp_password_rdg_rpc:
  description: |-
    RPC RDG connections need to be funneled to separate backends, this will 
    direct RPC RDG connections to the corp password rdg RPC backend
  order: 90
  actions:
    - use_backend corp-password-rdg-rpc if rdg_rpc_path corp_rdg_password_host

corp_password_rdg_http:
  description: |-
    RPC RDG connections need to be funneled to separate backends, this will 
    direct HTTP RDG connections to the corp password rdg http backend
  order: 91
  actions:
    - use_backend corp-password-rdg-http if !rdg_rpc_path corp_rdg_password_host

corp_token_rdg_rpc:
  description: |-
    RPC RDG connections need to be funneled to separate backends, this will 
    direct RPC RDG connections to the corp token rdg http backend
  order: 92
  actions:
