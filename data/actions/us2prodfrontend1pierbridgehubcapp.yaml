---
ssl_redirects:
  description: |-
    Do SSL redirects for Pierbridge domains; not all subdomains need SSL redirects
  order: 79
  actions:
    - redirect scheme https if star_transtream_com !{ ssl_fc }
    - redirect scheme https if star_transtreamqa_com !{ ssl_fc }
    - redirect scheme https if star_transtreamxb_com !{ ssl_fc }
    - redirect scheme https if star_logistyxtme_com !{ ssl_fc }
    - redirect scheme https if star_logistyxtmeqa_com !{ ssl_fc }
    - redirect scheme https if star_logistyxtmexb_com !{ ssl_fc }
    - redirect scheme https if star_sendproenterprise_com !{ ssl_fc }
    - redirect scheme https if star_sendproenterpriseqa_com !{ ssl_fc }
    - redirect scheme https if star_sendproenterprisexb_com !{ ssl_fc }

backend_selection:
  description: |-
    Handle backend selection. The order of these operations matters
  order: 80
  actions:
    - use_backend hubcapp-qa_pierbridge_net if qa_domains
    - use_backend hubcapp-sandbox_pierbridge_net if sandbox_domains
    - use_backend hubcapp-prod_pierbridge_net if production_domains
