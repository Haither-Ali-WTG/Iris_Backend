---
https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_borderwise_com !{ ssl_fc }
    - redirect scheme https if star_cwconnector_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_wisetechacademy_com !{ ssl_fc }
    - redirect scheme https if lms_staging_wisetechacademy_com !{ ssl_fc }

au2s3_3_secondary_backend_selection:
  description: |-
    Use secondary backend in local DC for au2s3-3
  order: 10
  actions:
    - use_backend au2s3-3-secondary if au2s3-3-primary_not_enough_capacity au2s3-3_wtg_ws_and_subdomains

au2s3_3_primary_backend_selection:
  description: |-
    Use primary backend in local DC for au2s3-3
  order: 11
  actions:
    - use_backend au2s3-3-primary if au2s3-3_wtg_ws_and_subdomains
