---
secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

cw_rdg_backend_selection_password:
  description: |-
    Select correct backend based on host requested and connection type - Password
  order: 81
  actions:
    - use_backend cn1-cw-prod-password-rdg-rpc if cw-prod-password-rdg_host rdg_rpc_path
    - use_backend cn1-cw-prod-password-rdg-http if cw-prod-password-rdg_host !rdg_rpc_path
