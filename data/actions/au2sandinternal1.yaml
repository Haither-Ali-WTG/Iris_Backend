---
restrict_ip:
  description: |-
    Restrict http request based on IP
  order: 2
  actions:
    - >-
      http-request deny if
      !wtg_src !shipamax_src !hackerrank_src !talogy_src !bsm_blume_src !impexdocs_uat_src
    - http-request deny if bsm_blume_src !ocmbe_sand_wtg_zone
    - http-request deny if impexdocs_uat_src !ocmbe_sand_wtg_zone

secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisetechglobal_com !{ ssl_fc }
    - redirect scheme https if star_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_bolero_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_testrig_sand_wtg_zone !{ ssl_fc } !excluded_from_redirect_paths
    - redirect scheme https if star_cargowise_com !{ ssl_fc }
    - redirect scheme https if star_webprint_testrig_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_localtransport_testrig_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_edirf_testrig_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_webcampaign_testrig_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_webtracker_testrig_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_cfs_testrig_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_scim_testrig_sand_wtg_zone !{ ssl_fc }
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_wtatestrig_sand_wtg_zone !{ ssl_fc }

bolero_backend_redirect:
  description: |-
    Redirect bolero webservices to the correct port based on hostname
    requests to *5001.bolero.sand.wtg.zone should go to the 5001 backend and so on
  order: 90
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g),'regsub("^.*(50[0-9]{2}_)","\1")']
        if star_bolero_sand_wtg_zone

cw1_use_dynamic_backend_path:
  description: |-
    Redirect testrig webservices eadaptor/Glow/Portals requests to the correct backend based on path
    Exclude requests to healthchecks which will go to the default backend so even if portals or glow
    is marked down devs can still troubleshoot
  order: 80
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-%[path,field(2,/),lower]
        if cw1_dynamic_backend_webservice_path star_testrig_sand_wtg_zone !testrig_healthcheck
        !star-webserver_testrig_sand_wtg_zone
    - >-
        use_backend
        %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g),'regsub("(^[0-9]{3}[abc]?)","\1")']-wildcard-https
        if star-webserver_testrig_sand_wtg_zone star_testrig_sand_wtg_zone { path_beg -i /Services/ }
    - >-
        use_backend
        %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g),'regsub("(^[0-9]{3}[abc]?)","\1")']-wildcard
        if star-webserver_testrig_sand_wtg_zone star_testrig_sand_wtg_zone

campaign_hyeuat_sand_wtg_zone:
  description: |-
    Custom Webcampaign URL for HYEUAT
  order: 80
  actions:
    - >-
        use_backend www-hyeuat_sand_wtg_zone if { hdr(host),field(1,:) -i campaign-hyeuat.sand.wtg.zone }

myaccount_umbraco_temp_sand_wtg_zone:
  description: |-
    use catchall myaccount umbraco backend for myau-*.temp.sand.wtg.zone
  order: 79
  actions:
    - >-
        use_backend myaccount-umbraco-temp-sand-wtg-zone-catchall
        if { hdr(host),field(1,:) -m reg -i ^myau-([^\.])+\.temp\.sand\.wtg\.zone$ }

star_wtatestrig_sand_wtg_zone:
  description: |-
    use catchall wtatestrig backend for *.wtatestrig.sand.wtg.zone
  order: 80
  actions:
    - >-
        use_backend wtatestrig-sand-wtg-zone-catchall
        if star_wtatestrig_sand_wtg_zone

au2prod_sand_ocp_backend_selection:
  description: |-
    Backend selection for sand au2prod OCP internal services
  order: 80
  actions:
    - use_backend au2prod1-sandinternal-ingress if custom_sandinternal_au2prod1_ocp_wtg_ws
