---
https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_cwconnector_wisegrid_net !{ ssl_fc }

us2s3_3_secondary_backend_selection:
  description: |-
    Use secondary backend in local DC for us2s3-3
  order: 10
  actions:
    - use_backend us2s3-3-secondary if us2s3-3-primary_not_enough_capacity us2s3-3_wtg_ws_and_subdomains

us2s3_3_primary_backend_selection:
  description: |-
    Use primary backend in local DC for us2s3-3
  order: 11
  actions:
    - use_backend us2s3-3-primary if us2s3-3_wtg_ws_and_subdomains

us2prod_ocp_backend_selection:
  description: |-
    Backend selection for us2prod OCP internal corp services
  order: 80
  actions:
    - use_backend us2prod1-prodinternalcorp-ingress if custom_internal_corp_us2prod1_ocp_wtg_ws
    - use_backend us2prod1-prodinternalcorp-ingress if star_k8s_sand_wtg_zone
