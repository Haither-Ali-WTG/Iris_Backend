---
secure_cookie:
  description: |-
    Set secure attribute
  order: 60
  actions:
    - http-response replace-header Set-Cookie (.*) "\1; Secure" if https !secured_cookie

https_redirect:
  description: |-
    Redirect HTTP to HTTPS (worth redirecting http to https for the domains
    covered by wildcard certificates)
  order: 79
  actions:
    - redirect scheme https if star_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_cfs_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webcampaign_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webprint_wisegrid_net !{ ssl_fc }
    - redirect scheme https if star_webtracker_wisegrid_net !{ ssl_fc }

cw1_use_dynamic_backend_path:
  description: |-
    Redirect Glow webservice requests to the correct backend based on path
  order: 80
  actions:
    - >-
        use_backend %[req.hdr(Host),field(1,:),lower,regsub(\.,_,g)]-glow
        if glow_webservice_path www-star_wisegrid_net

svc_jjlawson_com_au:
  description: |-
    Custom GLOW URL for JJLSYD
  order: 80
  actions:
    - >-
        use_backend www-jjlsyd.wisegrid.net if { hdr(host),field(1,:) -i svc.jjlawson.com.au }

track_oceania_kln_com:
  description: |-
    Custom Webtracker URL for LEAAKL
  order: 80
  actions:
    - >-
        use_backend leaakl.webtracker.wisegrid.net if { hdr(host),field(1,:) -i track.oceania.kln.com }

tracking_allports_syd_com_au:
  description: |-
    Custom Webtracker URL for AP3SYD
  order: 80
  actions:
    - >-
        use_backend ap3syd.webtracker.wisegrid.net if { hdr(host),field(1,:) -i tracking.allports-syd.com.au }

 tracking_citotransport_com_au:
  description: |-
    Custom Webtracker URL for CITMEL
  order: 80
  actions:
    - >-
        use_backend citmel.webtracker.wisegrid.net if { hdr(host),field(1,:) -i tracking.citotransport.com.au }
