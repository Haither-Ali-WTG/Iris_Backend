# Dynamic Backends
# ################

backend b89rnd_webprint_wisegrid_net
option httpchk
http-check send meth HEAD uri / ver HTTP/1.1 hdr Host b89rnd.webprint.wisegrid.net hdr X-Forwarded-Proto https
http-check expect rstatus 200|401|403|302|405
cookie WEBSVC insert indirect nocache dynamic httponly secure attr "SameSite=None"
default-server inter 10000
server sa1wt-sweb-1 10.96.65.11:80 check

