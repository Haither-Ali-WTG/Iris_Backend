# Dynamic Backends
# ################

backend b89prd_webprint_wisegrid_net
option httpchk
http-check send meth HEAD uri / ver HTTP/1.1 hdr Host b89prd.webprint.wisegrid.net hdr X-Forwarded-Proto https
http-check expect rstatus 200|401|403|302|405
cookie WEBSVC insert indirect nocache dynamic httponly secure attr "SameSite=None"
default-server inter 10000
server sa1wp-sweb-1a 10.96.65.17:80 check
server sa1wp-sweb-1b 10.96.64.12:80 check

