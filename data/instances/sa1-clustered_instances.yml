---
# TODO figure out how to spread the definition over multiple files
clustered_instances:
  hosts:
    sa1sandinternal1testservices0:
      # sa1-sand-internal-1-test-services-0
      dc: SA1
      defaults:
        health_check_interval: 51000
      frontend:
        maxconn: 2000
        ports:
          plaintext: [2003]
          ssl: [2004]
      machine_cluster: sa1-prod-frontend-1
      iis_servers: []
      certificates:
        - name: star-wtg-zone
          cms_resource_group: RG-AU-Corp
      container:
        resources:
          production:
            cpu: 500m
            memory: 2000Mi
      stats:
        ports:
          web: 2037
          socket: 2036

    sa1prodfrontend1prodrdgproxy:
      # sa1-prod-frontend-1-prod-rdg-proxy
      dc: SA1
      frontend:
        proxy_ports:
          ssl: [2005]
        ports:
          ssl: [2007]
      stats:
        ports:
          web: 2038
          socket: 2039
      container:
        resources:
          production:
            cpu: 1000m
            memory: 2000Mi
      machine_cluster: sa1-prod-frontend-1
      iis_servers: []
      certificates:
        - name: star-wisegrid-net
          cms_resource_group: RG-AU-Prod

    sa1prodfrontend1testrdgproxy:
      # sa1-prod-frontend-1-test-rdg-proxy
      dc: SA1
      frontend:
        proxy_ports:
          ssl: [2006]
        ports:
          ssl: [2008]
      stats:
        ports:
          web: 2040
          socket: 2041
      container:
        resources:
          production:
            cpu: 1000m
            memory: 2000Mi
      machine_cluster: sa1-prod-frontend-1
      iis_servers: []
      certificates:
        - name: star-wisegrid-net
          cms_resource_group: RG-AU-Prod
