---
# TODO figure out how to spread the definition over multiple files
clustered_instances:
  hosts:
    cn1prodfrontend1sqltcp9:
      dc: CN1
      defaults:
        mode: tcp
      frontend:
        maxconn: 20000
        ports:
          plaintext:
            # KEEP IN SYNC: haproxy/de1-prod-frontend-1/ansible-inventories/inventory.yml

            # 3000..3999 is reserved by the billing collector:
            # https://devops.wisetechglobal.com/wtg/eServices/_git/eServices?path=Billing/Collector/Misc/WindowsService/Deployment/Profiles/Production/Files/plugins_settings.xml

            - 3001  # cn1WP-SSQL-2a/b i1
            - 3002  # cn1WT-SSQL-2a/b i1
            # ..3999

      iis_servers: []
      certificates: []
      sqlbilling_acl:
        - acl_name: customerreadonly_src
          file: cn1-prod-frontend-1.acl
      machine_cluster: cn1-prod-frontend-1
      stats:
        ports:
          web: 2048
          socket: 2049
      container:
        resources:
          production:
            cpu: 1000m
            memory: 2000Mi

    cn1prodfrontend1prodcwservices26:
      # cn1-prod-frontend-1-prodcw-services-26
      dc: CN1
      defaults:
        health_check_interval: 30s
      frontend:
        maxconn: 20000
        ports:
          plaintext: [2011]
          ssl: [2012]
      stats:
        ports:
          web: 2051
          socket: 2050
      container:
        resources:
          production:
            cpu: 1000m
            memory: 2000Mi
      machine_cluster: cn1-prod-frontend-1
      iis_servers: []
      iis_servers_local:
        - CN1WP-SWEB-1A.wisecloud.zone
        - CN1WP-SWEB-1B.wisecloud.zone
      iis_user_local: s_lbwinrmquerier
      websites_config: prodcwservices.yml
      certificates:
        - name: star-wisegrid-net
          cms_resource_group: RG-AU-Prod
        - name: star-wisetechglobal-cn
          cms_resource_group: RG-AU-Corp
      cipher:
        profiles:
          - best_practice_2023
      timeouts:
        http_keep_alive: 15

    cn1prodfrontend1testcwservices27:
      # cn1-prod-frontend-1-testcw-services-27
