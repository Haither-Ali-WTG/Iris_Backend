    option httpchk HEAD /wtg/status
    cookie CWWA insert indirect nocache dynamic
    http-check expect status 200
    default-server agent-check agent-port 8098
    server DE1WP-SBLZ-001 10.3.72.11:80
    server DE1WP-SBLZ-002 10.3.72.12:80
    server DE1WP-SBLZ-003 10.3.72.13:80
