de.identity.wisetechglobal.com-login:
  clustered_instances: [de1prodfrontend1prodcdnservices31]
  full_override: |
    backend de_identity_wisetechglobal_com-login
    option httpchk HEAD /wtg/ready
    http-check expect status 200
    http-request replace-path /login(/)?(.*) /\2
    http-request set-header X-Forwarded-Prefix /login
    cookie ISL insert indirect nocache dynamic
    server de1wp-sidi-501a 10.3.143.11:3001 check ssl
    server de1wp-sidi-501b 10.3.143.12:3001 check ssl

