  cookie:
    name: APPB
  http_health_check:
    enabled: true
    http_path: /api/wtg/ready
  servers:
    - name: AU2WP-SDKR-1
      ip: 10.2.67.111
      port: 50035
    - name: AU2WP-SDKR-2
      ip: 10.2.67.112
      port: 50035

au.identity.wisetechglobal.com-login:
  clustered_instances: [au2prodfrontend1prodcdnservices31]
  full_override: |
    backend au_identity_wisetechglobal_com-login
    option httpchk HEAD /wtg/ready
    http-check expect status 200
    http-request replace-path /login(/)?(.*) /\2
    http-request set-header X-Forwarded-Prefix /login
    cookie ISL insert indirect nocache dynamic
    server au2wp-sidi-501a 10.2.143.11:3001 check ssl
    server au2wp-sidi-501b 10.2.143.12:3001 check ssl

