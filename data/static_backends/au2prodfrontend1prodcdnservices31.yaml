---
addressvalidation.wisegrid.net:
  clustered_instances: [au2prodfrontend1prodcdnservices31]
  cookie:
    name: AVS
  http_health_check:
    enabled: true
    http_path: /wtg/status
  servers:
    - name: AU2WP-SIIS-401A
      ip: 10.2.69.12
      port: 80
    - name: AU2WP-SIIS-401B
      ip: 10.2.69.13
      port: 80

au.cww.wisegrid.net-catchall:
  clustered_instances: [au2prodfrontend1prodcdnservices31]
  full_override: |
    backend au_cww_wisegrid_net-catchall
    option httpchk HEAD /wtg/status
    cookie CWWA insert indirect nocache dynamic
    http-check expect status 200
    default-server agent-check agent-port 8098
    server AU2WP-SBLZ-001 10.2.72.11:80
    server AU2WP-SBLZ-002 10.2.72.12:80
    server AU2WP-SBLZ-003 10.2.72.13:80
    server AU2WP-SBLZ-404 10.2.72.21:80
    server AU2WP-SBLZ-405 10.2.72.23:80
    server AU2WP-SBLZ-406 10.2.72.24:80

app-au.borderwise.com:
