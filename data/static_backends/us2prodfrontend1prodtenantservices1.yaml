usq-pulse-global_livesource_com:
  clustered_instances: [us2prodfrontend1prodtenantservices1]
  full_override: |
    backend pulse-global_livesource_com
    mode http
    option forwardfor
    option httplog
    option httpchk
    http-check send meth GET uri /SysHealthCheck/healthcheck.jspf hdr Host "%s"
    http-check expect string OK
    balance roundrobin
    cookie PULSEGLOBALCOOKIE insert indirect nocache dynamic secure maxlife 3600
    default-server inter 5s rise 2 fall 3 maxconn 10000 resolve-prefer ipv4
    server chghbo01 10.4.203.15:80 check
    server chghbo02 10.4.203.16:80 check

