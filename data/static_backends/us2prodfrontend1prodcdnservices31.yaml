---
addressvalidation-us2.wisegrid.net:
  clustered_instances: [us2prodfrontend1prodcdnservices31]
  cookie:
    name: AVS
  http_health_check:
    enabled: true
    http_path: /wtg/ready
  servers:
    - name: US2WP-SIIS-401A
      ip: 10.4.66.27
      port: 80
    - name: US2WP-SIIS-401B
      ip: 10.4.66.28
      port: 80

us.cww.wisegrid.net-catchall:
  clustered_instances: [us2prodfrontend1prodcdnservices31]
  full_override: |
    backend us_cww_wisegrid_net-catchall
    option httpchk HEAD /wtg/status
    cookie CWWA insert indirect nocache dynamic
    http-check expect status 200
    default-server agent-check agent-port 8098
    server US2WP-SBLZ-001 10.4.72.11:80
    server US2WP-SBLZ-002 10.4.72.12:80
    server US2WP-SBLZ-003 10.4.72.13:80
    server US2WP-SBLZ-406 10.4.72.21:80
    server US2WP-SBLZ-407 10.4.72.22:80
    server US2WP-SBLZ-408 10.4.72.23:80

app-us.borderwise.com:
  clustered_instances: [us2prodfrontend1prodcdnservices31]
  cookie:
    name: APPB
  http_health_check:
    enabled: true
    http_path: /api/wtg/ready
  servers:
    - name: AU2WP-SDKR-1
      ip: 10.2.67.111
      port: 50035
    - name: AU2WP-SDKR-2
      ip: 10.2.67.112
      port: 50035

us.identity.wisetechglobal.com-login:
  clustered_instances: [us2prodfrontend1prodcdnservices31]
  full_override: |
    backend us_identity_wisetechglobal_com-login
    option httpchk HEAD /wtg/ready
    http-check expect status 200
    http-request replace-path /login(/)?(.*) /\2
    http-request set-header X-Forwarded-Prefix /login
    cookie ISL insert indirect nocache dynamic
    server us2wp-sidi-501a 10.4.143.11:3001 check ssl
    server us2wp-sidi-501b 10.4.143.12:3001 check ssl

