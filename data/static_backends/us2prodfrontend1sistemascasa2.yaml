---
# CS02301485 - Sistemas Casa HAProxy Configuration - CTARNET
us2mx0adml043.sistemascasa.hosting:
  clustered_instances: [us2prodfrontend1sistemascasa]
  full_override: |
    backend us2mx0adml043_sistemascasa_hosting
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Port  %[dst_port]
    http-request add-header X-Forwarded-Proto https if { ssl_fc }
    server us2mx0adml043 10.16.106.21:80 check

us2mx0bdpl043.sistemascasa.hosting:
