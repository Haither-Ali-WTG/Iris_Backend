# CS02301486 - Sistemas Casa HAProxy Configuration - PEMEX
us2mx0ptl00001-8085.sistemascasa.hosting:
  clustered_instances: [us2prodfrontend1sistemascasa]
  full_override: |
    backend us2mx0ptl00001-8085_sistemascasa_hosting
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Port  %[dst_port]
    http-request add-header X-Forwarded-Proto https if { ssl_fc }
    server us2mx0ptl00001 10.16.104.8:8088 check

