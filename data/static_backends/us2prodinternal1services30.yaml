us.cs.wtg.zone:
  clustered_instances: [us2prodinternal1services30]
  full_override: |
    backend cs_wtg_zone
    option httpchk
    http-check send meth HEAD uri /wtg/ready ver HTTP/1.1 hdr Host cs.wtg.zone hdr X-Forwarded-Proto https
    http-check expect rstatus 200|401|403|302|405
    default-server inter 10000 ssl
    server us2wp-siis-407a 10.4.67.90:443 check
    server us2wp-siis-407b 10.4.67.91:443 check

