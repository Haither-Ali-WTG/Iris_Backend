---
integration-hub.sand.wtg.zone:
  clustered_instances: [au2prodinternal1grpcservices]
  full_override: |
    backend integration-hub_sand_wtg_zone
    option httpchk
    http-check connect port 30201
    http-check send meth GET uri /healthz/ready ver HTTP/1.1 hdr Host localhost
    cookie INTHUBS insert indirect nocache dynamic
    http-check expect rstatus 200|301|302|400|403
    # gRPC/HTTP2 specific timeouts for long-running requests
    timeout tunnel 3600s
    timeout server 3600s
    timeout client-fin 30s
    timeout server-fin 30s
    # Ensure proper connection cleanup on client disconnect
    option abortonclose
    # HTTP/2 specific settings for gRPC
    http-reuse safe
    server w1.au2prod1 10.2.213.15:30101 check ssl proto h2
    server w2.au2prod1 10.2.213.16:30101 check ssl proto h2
    server w3.au2prod1 10.2.213.17:30101 check ssl proto h2
    server w4.au2prod1 10.2.213.18:30101 check ssl proto h2
    server w5.au2prod1 10.2.213.19:30101 check ssl proto h2
