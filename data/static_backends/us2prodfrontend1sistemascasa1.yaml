---
# CS02301482 - Sistemas Casa HAProxy Configuration - ADUANAS MEX
us2mx0apppw011.sistemascasa.hosting:
  clustered_instances: [us2prodfrontend1sistemascasa]
  full_override: |
    backend us2mx0apppw011_sistemascasa_hosting
    mode http
    option forwardfor
    cookie JSESSIONID prefix nocache
    server us2mx0apppw011 10.16.106.6:80 check cookie https849001

us2mx0apppl011.sistemascasa.hosting:
  clustered_instances: [us2prodfrontend1sistemascasa]
  full_override: |
    backend us2mx0apppl011_sistemascasa_hosting
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Port  %[dst_port]
    http-request add-header X-Forwarded-Proto https if { ssl_fc }
    server us2mx0apppl011 10.16.106.7:80 check
