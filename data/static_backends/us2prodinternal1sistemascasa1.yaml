---
us2mx0apppw011-internal.sistemascasa.hosting:
  clustered_instances: [us2prodinternal1sistemascasa1]
  # full_override needed becuase we cannot set X-Forwarded-Port header
  # and we can't specify "prefix" for cookies
  full_override: |
    backend us2mx0apppw011-internal_sistemascasa_hosting
    http-request set-header X-Forwarded-Port  %[dst_port]
    cookie JSESSIONID prefix nocache secure
    server us2mx0apppw011 10.16.106.6:9001 check cookie https9001

