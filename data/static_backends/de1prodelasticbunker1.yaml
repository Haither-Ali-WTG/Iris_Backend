---
de1.bunker.downloadrate:
  clustered_instances: [de1prodelasticbunker1]
  full_override: |
    backend downloadrate
    stick-table type integer size 1m expire 3600s store bytes_out_rate(1s)

de1.bunker.uploadrate:
  clustered_instances: [de1prodelasticbunker1]
  full_override: |
    backend uploadrate
    stick-table type integer size 1m expire 3600s store bytes_in_rate(1s)

star.de1s3-b1.wtg.ws:
  clustered_instances: [de1prodelasticbunker1]
  full_override: |
    backend star_de1s3-b1_wtg_ws
    option httpchk
    http-check send meth HEAD uri /
    http-check expect rstatus 200|401|403|302|405|400
    cookie DE1S3BUNKER insert indirect nocache dynamic secure
    default-server inter 10000 ssl
    server de1nas12-s3-01 10.3.30.31:443 check check-ssl ssl verify none
    filter bwlim-out mydownloadlimit limit 312500000 key be_id table downloadrate
    filter bwlim-in myuploadlimit limit 312500000 key be_id table uploadrate
    http-response set-bandwidth-limit mydownloadlimit
    http-request set-bandwidth-limit myuploadlimit

star.de1s3-11.wtg.ws:
  clustered_instances: [de1prodelasticbunker1]
  full_override: |
    backend star_de1s3-11_wtg_ws
    option httpchk
    http-check send meth HEAD uri /
    http-check expect rstatus 200|401|403|302|405|400
    cookie DE1NAS11 insert indirect nocache dynamic secure
    default-server inter 30000 ssl
    server de1nas11-s3 10.3.30.41:443 check check-ssl ssl verify none
