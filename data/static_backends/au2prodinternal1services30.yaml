au2prod1-prodinternal-ingress:
  clustered_instances: [au2prodinternal1services30]
  full_override: |
    backend au2prod1-prodinternal-ingress
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr host console-openshift-console.apps.au2prod1.ocp.wtg.ws
    cookie AU2PROD1INT insert indirect nocache dynamic
    http-check expect rstatus 200|301|302|400|403
    server w1.au2prod1 10.2.213.15:30100 check ssl send-proxy-v2
