---
admin-us2.wisecloud.zone:
  clustered_instances: [us2corptcp1]
  full_override: |
    backend admin-us2_wisecloud_zone
    load-server-state-from-file none
    option tcp-check
    tcp-check connect port 3389 ssl
    server us2wp-srdp-405 10.4.86.35:3389 check
    server us2wp-srdp-406 10.4.86.36:3389 check

