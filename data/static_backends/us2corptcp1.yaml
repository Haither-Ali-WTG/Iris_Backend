redis.uat.urs.wisegrid.net:
  clustered_instances: [us2corptcp1]
  full_override: |
    backend redis_uat_urs_wisegrid_net
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send "info replication\r\n"
    tcp-check expect string role:master
    server w1.us2prod1 10.4.237.15:30279 check inter 2s fall 3 rise 2
    server w2.us2prod1 10.4.237.16:30279 check inter 2s fall 3 rise 2
    server w3.us2prod1 10.4.237.17:30279 check inter 2s fall 3 rise 2
    server w4.us2prod1 10.4.237.18:30279 check inter 2s fall 3 rise 2
    server w5.us2prod1 10.4.237.19:30279 check inter 2s fall 3 rise 2
