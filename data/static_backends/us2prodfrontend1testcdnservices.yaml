---
us.cww-nonprd.wisegrid.net-catchall:
  clustered_instances: [us2prodfrontend1testcdnservices]
  full_override: |
    backend us_cww-nonprd_wisegrid_net-catchall
    option httpchk
    http-check send meth HEAD uri /wtg/status
    balance random
    cookie CWWA insert indirect nocache dynamic
    http-check expect status 200
    http-request replace-header Host ^([^.]+)\.cww-nonprd\.wisetechglobal\.cn$ \1.cww-nonprd.wisegrid.net
    default-server agent-check agent-port 8098
    server US2WT-SBLZ-404 10.4.73.24:80
    server US2WT-SBLZ-405 10.4.73.25:80

app-test-us.borderwise.com:
  clustered_instances: [us2prodfrontend1testcdnservices]
  cookie:
    name: APPTB
  http_health_check:
    enabled: true
    http_path: /api/wtg/ready
  servers:
    - name: US2WP-SDKR-1
      ip: 10.4.67.111
      port: 40035

staging-us.identity.wisetechglobal.com-login:
  clustered_instances: [us2prodfrontend1testcdnservices]
  full_override: |
    backend staging-us_identity_wisetechglobal_com-login
    option httpchk
    http-check send meth HEAD uri /wtg/ready
    http-check expect status 200
    http-request replace-path /login(/)?(.*) /\2
    http-request set-header X-Forwarded-Prefix /login
    cookie ISL insert indirect nocache dynamic
    server us2wt-sidi-501a 10.4.139.11:3001 check ssl
    server us2wt-sidi-501b 10.4.139.12:3001 check ssl

