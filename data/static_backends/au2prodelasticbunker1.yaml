---
au2.bunker.downloadrate:
  clustered_instances: [au2prodelasticbunker1]
  full_override: |
    backend downloadrate
    stick-table type integer size 1m expire 3600s store bytes_out_rate(1s)

au2.bunker.uploadrate:
  clustered_instances: [au2prodelasticbunker1]
  full_override: |
    backend uploadrate
    stick-table type integer size 1m expire 3600s store bytes_in_rate(1s)

star.au2s3-b1.wtg.ws:
  clustered_instances: [au2prodelasticbunker1]
  full_override: |
    backend star_au2s3-b1_wtg_ws
    option httpchk
    http-check send meth HEAD uri /
    http-check expect rstatus 200|401|403|302|405|400
    cookie AU2S3BUNKER insert indirect nocache dynamic secure
    default-server inter 10000 ssl
    server au2nas12-s3-01 10.2.30.31:443 check check-ssl ssl verify none
    filter bwlim-out mydownloadlimit limit 800000000 key be_id table downloadrate
    filter bwlim-in myuploadlimit limit 800000000 key be_id table uploadrate
    http-response set-bandwidth-limit mydownloadlimit
    http-request set-bandwidth-limit myuploadlimit
