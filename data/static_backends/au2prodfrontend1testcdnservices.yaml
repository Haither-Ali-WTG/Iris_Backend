addressvalidation-test.wisegrid.net:
  clustered_instances: [au2prodfrontend1testcdnservices, au2prodfrontend1prodcdnservices31]
  cookie:
    name: AVS
  http_health_check:
    enabled: true
    http_path: /wtg/status
  servers:
    - name: AU2WT-SIIS-401A
      ip: 10.2.69.19
      port: 80
    - name: AU2WT-SIIS-401B
      ip: 10.2.69.20
      port: 80

au.cww-nonprd.wisegrid.net-catchall:
  clustered_instances: [au2prodfrontend1testcdnservices]
  full_override: |
    backend au_cww-nonprd_wisegrid_net-catchall
    option httpchk HEAD /wtg/status
    cookie CWWA insert indirect nocache dynamic
    http-check expect status 200
    default-server agent-check agent-port 8098
    server AU2WT-SBLZ-001 10.2.73.11:80
    server AU2WT-SBLZ-404 10.2.73.24:80

