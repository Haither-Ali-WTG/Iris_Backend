---
star_cww_wisegrid_net:
  description: "*.cww.wisegrid.net blazor production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww\.wisegrid\.net$
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww-prod\.wisetechglobal\.cn$

star_wisetechglobal_com:
  description: "*.wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisetechglobal\.com$

identity_wisetechglobal_com:
  description: |-
    hostnames for production WTG IDP
  tests:
    - hdr(host),field(1,:) -i identity.wisetechglobal.com
    - hdr(host),field(1,:) -i us.identity.wisetechglobal.com

wtg_idp_login_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /login
    - path_beg -i /login/

wtg_idp_account_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /account
    - path_beg -i /account/

wtg_idp_s2s_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /s2s
    - path_beg -i /s2s/

app_borderwise_com:
  description: |-
    hostnames for production Borderwise App
  tests:
    - hdr(host),field(1,:) -i app.borderwise.com
    - hdr(host),field(1,:) -i app-us.borderwise.com
    - hdr(host),field(1,:) -i app-cf.borderwise.com

portal_cwconnector_wisegrid_net:
  description: |-
    hostnames for production CWConnector App
  tests:
    - hdr(host),field(1,:) -i portal.cwconnector.wisegrid.net
    - hdr(host),field(1,:) -i portal-us.cwconnector.wisegrid.net

compliance_borderwise_com:
  description: "compliance borderwise"
  tests:
    - hdr(host),field(1,:) -i compliance.borderwise.com

star_cargowise_com:
  description: "*.cargowise.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cargowise\.com$

wca_denied_paths:
  description: |-
    Disallow wtg paths for WCA production services
  tests:
    - path_reg -i ^\/wtg(.*?)$

wca_prod_url:
  description: |-
    Hostnames for WCA production services
  tests:
    - hdr(host),field(1,:) -i chiwca.wisegrid.net
    - hdr(host),field(1,:) -i us2wcatoken.wisegrid.net

