# Path-based ACLs for security
umbraco_denied_path:
  description: "Umbraco admin paths"
  tests:
    - path_reg -i ^/umbraco.*

admin_denied_path:
  description: "Various admin paths"
  tests:
    - path_reg -i ^/admin.*
    - path_reg -i ^/ecp.*
    - path_reg -i ^/cscp.*

exchange_denied_path:
  description: "Exchange admin paths"
  tests:
    - path_reg -i ^/ecp.*

sfb_denied_path:
