# Path-based ACLs for security
umbraco_denied_path:
  description: "Umbraco admin paths"
  tests:
    - path_reg -i ^/umbraco.*

admin_denied_path:
  description: "Various admin paths"
  tests:
    - path_reg -i ^/admin.*
    - path_reg -i ^/ecp.*
    - path_reg -i ^/cscp.*

exchange_denied_path:
  description: "Exchange admin paths"
  tests:
    - path_reg -i ^/ecp.*

sfb_denied_path:
  description: "Skype for Business admin paths"
  tests:
    - path_reg -i ^/cscp.*

# Identity service path ACLs
identity_staging_login_path:
  description: "Identity staging login paths"
  tests:
    - path /login
    - path_beg /login/

identity_staging_s2s_path:
  description: "Identity staging s2s paths"
  tests:
    - path /s2s
    - path_beg /s2s/

identity_staging_account_path:
  description: "Identity staging account paths"
  tests:
    - path /account
    - path_beg /account/

# Redirect target ACLs
redirects_to_wisetechglobal_com:
  description: "Domains that should redirect to wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^edi\.com\.au$
    - hdr(host),field(1,:) -m reg -i ^realwiseholdings\.com$
    - hdr(host),field(1,:) -m reg -i ^transit\.com\.au$
    - hdr(host),field(1,:) -m reg -i ^translogix\.co\.nz$
    - hdr(host),field(1,:) -m reg -i ^www\.translogix\.co\.nz$
    - hdr(host),field(1,:) -m reg -i ^translogix\.com\.au$
    - hdr(host),field(1,:) -m reg -i ^www\.translogix\.com\.au$
    - hdr(host),field(1,:) -m reg -i ^wisetechglobal\.co\.za$
    - hdr(host),field(1,:) -m reg -i ^wisetechglobal\.com\.au$
    - hdr(host),field(1,:) -m reg -i ^(www\.)?corefreight\.com$
    - hdr(host),field(1,:) -m reg -i ^(.+\.)?tradewise\.net$

cargowise_excluded_from_redirect:
  description: "Cargowise domains excluded from default redirects"
  tests:
    - hdr(host),field(1,:) -m reg -i ^updates\.cargowise\.com$

cargowise_net_excluded_from_redirect:
  description: "Cargowise.net domains excluded from default redirects"
  tests:
    - hdr(host),field(1,:) -m reg -i ^webservices\.cargowise\.net$
    - hdr(host),field(1,:) -m reg -i ^webservices-ausyd\.cargowise\.net$

# SAAS Transportation redirect ACL
saas_transportation_redirect:
  description: "SAAS Transportation domains for special redirect"
  tests:
    - hdr(host),field(1,:) -m reg -i ^(www\.)?saastransportation\.com$
