  description: "*.uat.ad.impexdocs.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?uat\.ad\.impexdocs\.com$

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wtg\.zone$

star_cchain_local:
  description: "*.cchain.local"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?cchain\.local$

star_test_cchain_local:
  description: "*.test.cchain.local"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?test\.cchain\.local$

star_sand_cchain_local:
  description: "*.sand.cchain.local"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?sand\.cchain\.local$
