---
star_cww_wisegrid_net:
  description: "*.cww.wisegrid.net blazor production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww\.wisegrid\.net$

star_wisetechglobal_com:
  description: "*.wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisetechglobal\.com$

identity_wisetechglobal_com:
  description: |-
    hostnames for production WTG IDP
  tests:
    - hdr(host),field(1,:) -i identity.wisetechglobal.com
    - hdr(host),field(1,:) -i de.identity.wisetechglobal.com

peppol-smp-prod_wisegrid_net:
  description: |-
    hostname for Peppol SMP production service
  tests:
    - hdr(host),field(1,:) -i peppol-smp-prod.wisegrid.net

peppol-ap-prod_wisegrid_net:
  description: |-
    hostname for Peppol AP production service
  tests:
    - hdr(host),field(1,:) -i peppol-ap-prod.wisegrid.net

wtg_idp_login_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /login
    - path_beg -i /login/

wtg_idp_account_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /account
    - path_beg -i /account/

wtg_idp_s2s_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /s2s
    - path_beg -i /s2s/

app_borderwise_com:
  description: |-
    hostnames for production Borderwise App
  tests:
    - hdr(host),field(1,:) -i app.borderwise.com
    - hdr(host),field(1,:) -i app-de.borderwise.com
    - hdr(host),field(1,:) -i app-cf.borderwise.com

portal_cwconnector_wisegrid_net:
  description: |-
    hostnames for production CWConnector App
  tests:
    - hdr(host),field(1,:) -i portal.cwconnector.wisegrid.net
    - hdr(host),field(1,:) -i portal-de.cwconnector.wisegrid.net

compliance_borderwise_com:
  description: "compliance borderwise"
  tests:
    - hdr(host),field(1,:) -i compliance.borderwise.com

peppol_smp_disallow_secure_path:
  description: |-
    Disallow secure path for Peppol SMP service
  tests:
    - path_beg -i /secure

peppol_ap_as4_allow_path:
  description: |-
    Allow path for Peppol AP service AS4 path
  tests:
    - path_beg -i /as4

star_urs_wisegrid_net:
  description: "*.urs.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?urs\.wisegrid\.net$
