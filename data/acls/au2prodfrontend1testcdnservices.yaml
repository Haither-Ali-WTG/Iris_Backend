---
star_cww-nonprd_wisegrid_net:
  description: "*.cww-nonprd.wisegrid.net blazor non production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww-nonprd\.wisegrid\.net$
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww-nonprd\.wisetechglobal\.cn$

staging_identity_wisetechglobal_com:
  description: |-
    hostnames for staging WTG IDP
  tests:
    - hdr(host),field(1,:) -i staging.identity.wisetechglobal.com
    - hdr(host),field(1,:) -i staging-au.identity.wisetechglobal.com

wtg_idp_login_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /login
    - path_beg -i /login/

wtg_idp_account_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /account
    - path_beg -i /account/

wtg_idp_s2s_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /s2s
    - path_beg -i /s2s/

app-test_borderwise_com:
  description: |-
    hostnames for staging Borderwise App
  tests:
    - hdr(host),field(1,:) -i app-test.borderwise.com
    - hdr(host),field(1,:) -i app-test-au.borderwise.com

star_testtmp_borderwise_com:
  description: "*.tmp.borderwise.com borderwise tariff management test service"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?tmp\.borderwise\.com$
