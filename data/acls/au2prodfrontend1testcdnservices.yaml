---
star_cww-nonprd_wisegrid_net:
  description: "*.cww-nonprd.wisegrid.net blazor non production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww-nonprd\.wisegrid\.net$
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww-nonprd\.wisetechglobal\.cn$

star_identity_wisetechglobal_com:
  description: "*.identity.wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?identity\.wisetechglobal\.com$

staging_identity_wisetechglobal_com:
  description: |-
    hostnames for staging WTG IDP
  tests:
    - hdr(host),field(1,:) -i staging.identity.wisetechglobal.com
    - hdr(host),field(1,:) -i staging-au.identity.wisetechglobal.com
    - hdr(host),field(1,:) -i staging.identity.wisetechglobal.cn
    - hdr(host),field(1,:) -i staging-au.identity.wisetechglobal.cn

wtg_idp_login_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /login
    - path_beg -i /login/

wtg_idp_account_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /account
    - path_beg -i /account/

wtg_idp_s2s_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /s2s
    - path_beg -i /s2s/

app-test_borderwise_com:
  description: |-
    hostnames for staging Borderwise App
  tests:
    - hdr(host),field(1,:) -i app-test.borderwise.com
    - hdr(host),field(1,:) -i app-test-au.borderwise.com

star_testtmp_borderwise_com:
  description: "*.tmp.borderwise.com borderwise tariff management test service"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?tmp\.borderwise\.com$

abe_test_wisegrid_net:
  description: |-
    Host match for abe-test.wisegrid.net
  tests:
    - hdr(host),field(1,:) -i abe-test.wisegrid.net

xforwarderfor_excempt_urls:
  description: |-
    Hosts where client IP forwarding headers must be stripped
  tests:
    - hdr(host),field(1,:) -i abe-test.wisegrid.net

cmb-test-au_wisegrid_net:
  description: |-
    hostnames for cmb-test
  tests:
    - hdr(host),field(1,:) -i cmb-test-au.wisegrid.net
    - hdr(host),field(1,:) -i cmb-test.wisegrid.net

star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisegrid\.net$

star_transport_wisetechglobal_com:
  description: "*.transport.wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?transport\.wisetechglobal\.com$

cto_api_path:
  description: |-
    CTO API paths for MCP oauth and related endpoints
  tests:
    - path_beg -i /.well-known/oauth-authorization-server/mcp
    - path_beg -i /.well-known/oauth-protected-resource/mcp
    - path_beg -i /mcp
    - path_beg -i /api
