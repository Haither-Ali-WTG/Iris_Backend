---
star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisegrid\.net$

au2s3-3_wtg_ws_and_subdomains:
  description: "*.au2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?au2s3-3\.wtg\.ws$

de1s3-3_wtg_ws_and_subdomains:
  description: "*.de1s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?de1s3-3\.wtg\.ws$

us2s3-3_wtg_ws_and_subdomains:
  description: "*.us2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?us2s3-3\.wtg\.ws$

us2s3-3-primary_not_enough_capacity:
  description: "us2s3-3.wtg.ws Primary backends unavailable"
  tests:
    - nbsrv(us2s3-3-primary) lt 1

star_cwconnector_wisegrid_net:
  description: "*.cwconnector.wisegrid.net cwconnector production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cwconnector\.wisegrid\.net$

custom_internal_corp_us2prod1_ocp_wtg_ws:
  description: "Custom internal us2prod1 OCP WTG WS hosts"
  tests:
    - hdr(host) -i puremetrics-us.wtg.zone
    # *.k8s.sand.wtg.zone is already included in backend selection
