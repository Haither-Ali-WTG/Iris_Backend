  description: "au2 iris stats urls"
  tests:
    - hdr(host),field(1,:) -i au2corprdg.wtg.zone
    - hdr(host),field(1,:) -i au2prodelasticbunker1.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1corpservices1.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1prodcdnservices31.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1prodcwservices26.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1prodidp.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1prodservices.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1sqltcp9.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1tcp.wtg.zone
    - hdr(host),field(1,:) -i au2prodfrontend1testcwservices27.wtg.zone
    - hdr(host),field(1,:) -i au2prodinternal1corpservices35.wtg.zone
    - hdr(host),field(1,:) -i au2prodinternal1services30.wtg.zone
    - hdr(host),field(1,:) -i au2prodinternaltcp.wtg.zone
    - hdr(host),field(1,:) -i au2sandinternal1.wtg.zone
    - hdr(host),field(1,:) -i au2sandinternal2testservices0.wtg.zone
    - hdr(host),field(1,:) -i au2sandinternalrdg.wtg.zone
    - hdr(host),field(1,:) -i au2sandinternaltcp.wtg.zone

knowledge_mcp_wtg_zone:
  description: "au2 knowledge urls"
  tests:
    # mcp
    ## main
    - hdr(host) -i knowledge.mcp.wtg.zone
    - hdr(host) -i knowledge-staging.mcp.wtg.zone
    ## borderwise
    - hdr(host) -i borderwise.mcp.wtg.zone
    - hdr(host) -i borderwise-staging.mcp.wtg.zone
    ## ediprod
    - hdr(host) -i ediprod.mcp.wtg.zone
    - hdr(host) -i ediprod-staging.mcp.wtg.zone
    ## wta
    - hdr(host) -i wta.mcp.wtg.zone
    - hdr(host) -i wta-staging.mcp.wtg.zone
    # knowledge
    ## main
    - hdr(host) -i admin.knowledge.wtg.zone
    - hdr(host) -i internal.knowledge.wtg.zone
    - hdr(host) -i web.knowledge.wtg.zone
    - hdr(host) -i admin-staging.knowledge.wtg.zone
    - hdr(host) -i internal-staging.knowledge.wtg.zone
    - hdr(host) -i web-staging.knowledge.wtg.zone
    ## borderwise
    - hdr(host) -i borderwise.knowledge.wtg.zone
    - hdr(host) -i borderwise-admin.knowledge.wtg.zone
    - hdr(host) -i borderwise-staging.knowledge.wtg.zone
    - hdr(host) -i borderwise-admin-staging.knowledge.wtg.zone
    ## wta
    - hdr(host) -i wta.knowledge.wtg.zone
    - hdr(host) -i wta-admin.knowledge.wtg.zone
    - hdr(host) -i wta-staging.knowledge.wtg.zone
    - hdr(host) -i wta-admin-staging.knowledge.wtg.zone

llm_manager_wtg_zone:
  description: "au2 llm-manager urls"
  tests:
    ## litellm
    - hdr(host) -i litellm.wtg.zone
    - hdr(host) -i litellm.sand.wtg.zone
    ## llm-manager
    - hdr(host) -i llm-manager.wtg.zone
    - hdr(host) -i llm-manager.sand.wtg.zone
    ## langfuse
    - hdr(host) -i langfuse.wtg.zone
    - hdr(host) -i langfuse.sand.wtg.zone
    ## llm-gateway
    - hdr(host) -i llm-gateway.wtg.zone
    - hdr(host) -i llm-gateway.sand.wtg.zone
    - hdr(host) -i llm-manager.wtg.zone
    - hdr(host) -i llm-manager.sand.wtg.zone

star_cargowise_com:
  description: "*.cargowise.com"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?cargowise\.com$
