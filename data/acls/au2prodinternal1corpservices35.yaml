star_iris-stats_wtg_zone:
  description: "*.iris-stats.wtg.zone"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?iris-stats\.wtg\.zone$

knowledge_mcp_wtg_zone:
  description: "au2 knowledge urls"
  tests:
    # mcp
    ## main
    - hdr(host) -i knowledge.mcp.wtg.zone
    - hdr(host) -i knowledge-staging.mcp.wtg.zone
    ## ediprod
    - hdr(host) -i ediprod.mcp.wtg.zone
    - hdr(host) -i ediprod-staging.mcp.wtg.zone
    ## ai-acceleration
    - hdr(host) -i ai-acceleration.mcp.wtg.zone
    - hdr(host) -i ai-acceleration-staging.mcp.wtg.zone
    # knowledge
    ## main
    - hdr(host) -i admin.knowledge.wtg.zone
    - hdr(host) -i internal.knowledge.wtg.zone
    - hdr(host) -i web.knowledge.wtg.zone
    - hdr(host) -i admin-staging.knowledge.wtg.zone
    - hdr(host) -i internal-staging.knowledge.wtg.zone
    - hdr(host) -i web-staging.knowledge.wtg.zone
    ## borderwise
    - hdr(host) -i borderwise.knowledge.wtg.zone
    - hdr(host) -i borderwise-admin.knowledge.wtg.zone
    - hdr(host) -i borderwise-staging.knowledge.wtg.zone
    - hdr(host) -i borderwise-admin-staging.knowledge.wtg.zone
    ## triage-agent
    - hdr(host) -i triage-agent.knowledge.wtg.zone
    - hdr(host) -i triage-agent-staging.knowledge.wtg.zone
    - hdr(host) -i triage-agent-admin.knowledge.wtg.zone
    - hdr(host) -i triage-agent-admin-staging.knowledge.wtg.zone
    ## wta
    - hdr(host) -i wta.knowledge.wtg.zone
    - hdr(host) -i wta-admin.knowledge.wtg.zone
    - hdr(host) -i wta-staging.knowledge.wtg.zone
    - hdr(host) -i wta-admin-staging.knowledge.wtg.zone

llm_manager_wtg_zone:
  description: "au2 llm-manager urls"
  tests:
    ## litellm
    - hdr(host) -i litellm.wtg.zone
    - hdr(host) -i litellm.sand.wtg.zone
    ## llm-manager
    - hdr(host) -i llm-manager.wtg.zone
    - hdr(host) -i llm-manager.sand.wtg.zone
    - hdr(host) -i llm-manager-staging.wtg.zone
    ## llm-gateway
    - hdr(host) -i llm-gateway.wtg.zone
    - hdr(host) -i llm-gateway.sand.wtg.zone
    - hdr(host) -i llm-gateway-staging.wtg.zone
    - hdr(host) -i llm-gateway.knowledge.wtg.zone
    - hdr(host) -i llm-gateway-staging.knowledge.wtg.zone
    ## task-automation
    - hdr(host) -i task-automation.wtg.zone
    - hdr(host) -i task-automation-staging.wtg.zone

temporal_grpc_wtg_zone:
  description: "au2 temporal urls"
  tests:
    # frontend (grpc)
    - hdr(host) -i temporal.wtg.zone
    - hdr(host) -i temporal.sand.wtg.zone
    - hdr(host) -i temporal-staging.wtg.zone
    - hdr(host) -i temporal-au.wtg.zone
    - hdr(host) -i temporal-au.sand.wtg.zone
    - hdr(host) -i temporal-au-staging.wtg.zone
temporal_http_wtg_zone:
  description: "au2 temporal urls"
  tests:
    # web (http)
    - hdr(host) -i temporal-ui.wtg.zone
    - hdr(host) -i temporal-ui.sand.wtg.zone
    - hdr(host) -i temporal-ui-staging.wtg.zone
    - hdr(host) -i temporal-ui-au.wtg.zone
    - hdr(host) -i temporal-ui-au.sand.wtg.zone
    - hdr(host) -i temporal-ui-au-staging.wtg.zone

spire_wtg_zone:
  description: "au2 spire urls"
  tests:
    ## spire
    - hdr(host) -i spire-au-dev.wtg.zone

star_cargowise_com:
  description: "*.cargowise.com"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?cargowise\.com$

custom_internal_corp_au2prod1_ocp_wtg_ws:
  description: "Custom internal au2prod1 OCP WTG WS hosts"
  tests:
    - hdr(host) -i polaris.k8s.wtg.zone
    - hdr(host) -i polaris.wtg.zone
