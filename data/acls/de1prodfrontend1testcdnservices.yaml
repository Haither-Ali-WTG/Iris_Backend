---
star_cww-nonprd_wisegrid_net:
  description: "*.cww-nonprd.wisegrid.net blazor non production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww-nonprd\.wisegrid\.net$
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cww-nonprd\.wisetechglobal\.cn$

star_identity_wisetechglobal_com:
  description: "*.identity.wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?identity\.wisetechglobal\.com$

staging_identity_wisetechglobal_com:
  description: |-
    hostnames for staging WTG IDP
  tests:
    - hdr(host),field(1,:) -i staging.identity.wisetechglobal.com
    - hdr(host),field(1,:) -i staging-de.identity.wisetechglobal.com
    - hdr(host),field(1,:) -i staging.identity.wisetechglobal.cn
    - hdr(host),field(1,:) -i staging-de.identity.wisetechglobal.cn

peppol-smp-test_wisegrid_net:
  description: |-
    hostname for Peppol SMP test service
  tests:
    - hdr(host),field(1,:) -i peppol-smp-test.wisegrid.net

peppol-ap-test_wisegrid_net:
  description: |-
    hostname for Peppol AP test service
  tests:
    - hdr(host),field(1,:) -i peppol-ap-test.wisegrid.net

wtg_idp_login_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /login
    - path_beg -i /login/

wtg_idp_account_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /account
    - path_beg -i /account/

wtg_idp_s2s_path:
  description: |-
    Wisetech IDP path based routing
    see https://dev.azure.com/WTGEngineeringOps/EngineeringOps-wiki/_wiki/wikis/EngineeringOps-wiki.wiki/53/idp-design
  tests:
    - path -i /s2s
    - path_beg -i /s2s/

app-test_borderwise_com:
  description: |-
    hostnames for staging Borderwise App
  tests:
    - hdr(host),field(1,:) -i app-test.borderwise.com
    - hdr(host),field(1,:) -i app-test-de.borderwise.com

peppol_smp_disallow_secure_path:
  description: |-
    Disallow secure path for Peppol SMP service
  tests:
    - path_beg -i /secure

peppol_ap_as4_allow_path:
  description: |-
    Allow path for Peppol AP service AS4 path
  tests:
    - path_beg -i /as4

cmb-test-de_wisegrid_net:
  description: |-
    hostnames for cmb-test
  tests:
    - hdr(host),field(1,:) -i cmb-test-de.wisegrid.net
    - hdr(host),field(1,:) -i cmb-test.wisegrid.net
