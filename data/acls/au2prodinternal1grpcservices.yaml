---
star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wtg\.zone$

star_sand_wtg_zone:
  description: "*.sand.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?sand\.wtg\.zone$

star_k8s_sand_wtg_zone:
  description: "*.k8s.sand.wtg.zone"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?k8s\.sand\.wtg\.zone$
