---
haproxy_stats_urls:
  description: URLs for old HAProxy stats pages
  tests:
    - hdr(host) -i us2pi1-corp-internal.wtg.zone
    - hdr(host) -i us2pi1-corp-tcp.wtg.zone
    - hdr(host) -i us2pi1-prod-internal.wtg.zone
    - hdr(host) -i us2pi1-prod-internaltenantservices.wtg.zone
    - hdr(host) -i us2pi1-prod-tcptenantservices.wtg.zone
    - hdr(host) -i us2pf1-prod-legacyservices.wtg.zone
    - hdr(host) -i us2pf1-prod-pierbridge.wtg.zone
    - hdr(host) -i us2pf1-prod-services.wtg.zone
    - hdr(host) -i us2pf1-prod-sqlreadonly.wtg.zone
    - hdr(host) -i us2pf1-prod-tenantservices.wtg.zone
    - hdr(host) -i us2pf1-prod-customurls.wtg.zone
    - hdr(host) -i us2pf1-prod-customurls2.wtg.zone
    - hdr(host) -i us2pf1-prod-rdg.wtg.zone
    - hdr(host) -i us2pf1-prod-legacyrdg.wtg.zone
    - hdr(host) -i us2pf2-prod-rdg.wtg.zone
    - hdr(host) -i us2pf2-prod-legacyrdg.wtg.zone
    - hdr(host) -i us2pf2-prod-proxy.wtg.zone
    - hdr(host) -i us2pf2-test-proxy.wtg.zone
    - hdr(host) -i stats-uscloud-us2.wtg.zone
    - hdr(host) -i stats-rdg-us2.wtg.zone

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wtg\.zone$

iris_stats_urls:
  description: "us2 iris stats urls"
  tests:
    - hdr(host) -i us2corpinternal1.wtg.zone
    - hdr(host) -i us2corptcp1.wtg.zone
    - hdr(host) -i us2prodelasticbunker1.wtg.zone
    - hdr(host) -i us2prodfrontend1prodcdnservices31.wtg.zone
    - hdr(host) -i us2prodfrontend1prodcwservices26.wtg.zone
    - hdr(host) -i us2prodfrontend1prodtenantservices1.wtg.zone
    - hdr(host) -i us2prodfrontend1sqltcp9.wtg.zone
    - hdr(host) -i us2prodfrontend1testcwservices27.wtg.zone
    - hdr(host) -i us2prodinternal1services30.wtg.zone

star_iris-stats_wtg_zone:
  description: "*.iris-stats.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?iris-stats\.wtg\.zone$
