---
star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisegrid\.net$

au2s3-3_wtg_ws_and_subdomains:
  description: "*.au2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?au2s3-3\.wtg\.ws$

de1s3-3_wtg_ws_and_subdomains:
  description: "*.de1s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?de1s3-3\.wtg\.ws$

us2s3-3_wtg_ws_and_subdomains:
  description: "*.us2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?us2s3-3\.wtg\.ws$

de1s3-3-primary_not_enough_capacity:
  description: "de1s3-3.wtg.ws Primary backends unavailable"
  tests:
    - nbsrv(de1s3-3-primary) lt 1

peppol-smp-admin_wisetechglobal_com:
  description: "Peppol Internal Admin Portal"
  tests:
    - hdr(host),field(1,:) -i peppol-smp-test-admin.wisetechglobal.com
    - hdr(host),field(1,:) -i peppol-smp-prod-admin.wisetechglobal.com

peppol-smp-test-service_wisetechglobal_com:
  description: "Peppol SMP Test Service Endpoint"
  tests:
    - hdr(host),field(1,:) -i peppol-smp-test-service.wisetechglobal.com

peppol-smp-prod-service_wisetechglobal_com:
  description: "Peppol SMP Prod Service Endpoint"
  tests:
    - hdr(host),field(1,:) -i peppol-smp-prod-service.wisetechglobal.com

peppol-ap-service_wisetechglobal_com:
  description: "Peppol AP Service Endpoint"
  tests:
    - hdr(host),field(1,:) -i peppol-ap-test-service.wisetechglobal.com
    - hdr(host),field(1,:) -i peppol-ap-prod-service.wisetechglobal.com

iris_stats_urls:
  description: "de1 iris stats urls"
  tests:
    - hdr(host),field(1,:) -i de1prodelasticbunker1.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1prodcdnservices31.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1prodcwservices26.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1prodproxy.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1sqltcp1.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1testcwservices27.wtg.zone
    - hdr(host),field(1,:) -i de1prodinternal1services30.wtg.zone

star_cwconnector_wisegrid_net:
  description: "*.cwconnector.wisegrid.net cwconnector production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cwconnector\.wisegrid\.net$

peppol_smp_disallow_secure_path:
  description: |-
    Disallow secure path for Peppol SMP service
  tests:
    - path_beg -i /secure

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wtg\.zone$
