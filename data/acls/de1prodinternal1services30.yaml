---
star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisegrid\.net$

au2s3-3_wtg_ws_and_subdomains:
  description: "*.au2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?au2s3-3\.wtg\.ws$

de1s3-3_wtg_ws_and_subdomains:
  description: "*.de1s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?de1s3-3\.wtg\.ws$

us2s3-3_wtg_ws_and_subdomains:
  description: "*.us2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?us2s3-3\.wtg\.ws$

de1s3-3-primary_not_enough_capacity:
  description: "de1s3-3.wtg.ws Primary backends unavailable"
  tests:
    - nbsrv(de1s3-3-primary) lt 1

iris_stats_urls:
  description: "de1 iris stats urls"
  tests:
    - hdr(host),field(1,:) -i de1prodelasticbunker1.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1prodcdnservices31.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1prodcwservices26.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1prodproxy.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1sqltcp1.wtg.zone
    - hdr(host),field(1,:) -i de1prodfrontend1testcwservices27.wtg.zone
    - hdr(host),field(1,:) -i de1prodinternal1services30.wtg.zone
