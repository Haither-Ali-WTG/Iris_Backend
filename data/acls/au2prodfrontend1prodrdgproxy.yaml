---
rdg_rpc_path:
  description: RPC rdg path /rpc
  tests:
    - path_beg -i /rpc

cw_prod_password_rdg_host:
  description: host address for password auth PROD RD Gateway
  tests:
    - hdr(host),field(1,:) -i rd-au2wp-pss-4-1.wisegrid.net
    - hdr(host),field(1,:) -i aucloud-au2.wisetechglobal.cn

cw_prod_token_rdg_host:
  description: host address for token auth PROD RD Gateway
  tests:
    - hdr(host),field(1,:) -i rd-au2wp-tkn-4-1.wisegrid.net
    - hdr(host),field(1,:) -i aucloud-au2-token.wisetechglobal.cn
