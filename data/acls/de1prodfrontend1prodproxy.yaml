---
star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisegrid\.net$

remote_desktop_gateway_rpc_path:
  description: |-
    Identify if RDG connection type is RPC
  tests:
    - path_beg -i /rpc

cw-prod-token-rdg_host:
  description: |-
    Host address for token auth RD Gateway
  tests:
    - hdr(host),field(1,:) -i rd-de1wp-tkn-4-1.wisegrid.net

cw-prod-password-rdg_host:
  description: |-
    Host address for password auth RD Gateway
  tests:
    - hdr(host),field(1,:) -i rd-de1wp-pss-4-1.wisegrid.net
