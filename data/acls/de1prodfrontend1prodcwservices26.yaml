---
star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisegrid\.net$

star_cfs_wisegrid_net:
  description: "*.cfs.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cfs\.wisegrid\.net$

star_edirf_wisegrid_net:
  description: "*.edirf.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?edirf\.wisegrid\.net$

star_webcampaign_wisegrid_net:
  description: "*.webcampaign.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?webcampaign\.wisegrid\.net$

star_webprint_wisegrid_net:
  description: "*.webprint.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^[A-Za-z0-9]{6}(?:-cn)?[-.]?webprint\.wisegrid\.net$

star_webtracker_wisegrid_net:
  description: "*.webtracker.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^[A-Za-z0-9]{6}(?:-cn)?[-.]?webtracker\.wisegrid\.net$

www-star_wisegrid_net:
  description: "www-*.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^www-[A-Za-z0-9]{6}(-cn)?\.wisegrid\.net$

glow_webservice_path:
  description: |-
    Glow webservice paths that get routed to specific dynamic backend
  tests:
    - path_beg -i /Glow/

t89_xndt:
  description: "t89prdxndt.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -i t89prdxndt.wisegrid.net

t89_allowed_ips:
  description: these IPs that are specifically allowed to connect to T89 XNDT webservice
  tests:
    - src 195.235.205.0/27
    - src 195.235.205.5
    - src 213.4.19.245
    # Sam Test
    - src 220.233.32.106
