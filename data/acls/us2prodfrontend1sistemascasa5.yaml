---
# CS02322985 - Sistemas Casa HAProxy Configuration - Ctraweb
star_sistemascasa_com:
  description: "*.sistemascasa.com"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?sistemascasa\.com$

port_8080:
  description: "Destination port of 8080 in the original request"
  tests:
    - dst_port 2100

port_8081:
  description: "Destination port of 8081 in the original request"
  tests:
    - dst_port 2101

