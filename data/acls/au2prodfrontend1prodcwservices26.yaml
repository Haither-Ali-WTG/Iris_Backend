---
star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisegrid\.net$

star_cfs_wisegrid_net:
  description: "*.cfs.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?cfs\.wisegrid\.net$

star_edirf_wisegrid_net:
  description: "*.edirf.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?edirf\.wisegrid\.net$

star_webcampaign_wisegrid_net:
  description: "*.webcampaign.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?webcampaign\.wisegrid\.net$

star_webprint_wisegrid_net:
  description: "*.webprint.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?webprint\.wisegrid\.net$

star_webtracker_wisegrid_net:
  description: "*.webtracker.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?webtracker\.wisegrid\.net 

star_wisetechglobal_cn:
  description: "*.wisetechglobal.cn"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisetechglobal\.cn$

www-star:
  description: "www-*.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^www-[A-Za-z0-9]{6}(-cn)?\.(wisegrid|wisetechglobal)\.(net|cn)$

Glow_webservice_path:
  description: |-
    CW1 webservice paths that get routed to specific dynamic backends
  tests:
    - path_beg -i /Glow/
