---
star_wisetechglobal_com:
  description: "*.wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisetechglobal\.com$

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wtg\.zone$

rdg_rpc_path:
  description: RPC rdg path /rpc
  tests:
    - path_beg -i /rpc

corp_rdg_password_host:
  description: hostnames used by password CORP rdg endpoints (ediprod)
  tests:
    - hdr(host),field(1,:) -i rdg.wisetechglobal.cn
    - hdr(host),field(1,:) -i rdg-au2.wisetechglobal.cn
    - hdr(host),field(1,:) -i rdg.wisetechglobal.com
    - hdr(host),field(1,:) -i rdg-au2.wisetechglobal.com

corp_rdg_token_host:
  description: hostnames used by token auth CORP rdg endpoints (ediprod)
  tests:
    - hdr(host),field(1,:) -i rdg-au2-token.wisetechglobal.com
    - hdr(host),field(1,:) -i rdg-au2-token.wisetechglobal.cn
