---
star_wisetechglobal_com:
  description: "*.wisetechglobal.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisetechglobal\.com$

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wtg\.zone$

sand_rdg_endpoints:
  description: SAND RDG endpoints
  tests:
    - hdr(host),field(1,:) -m reg -i ^((sandtsg|sandtsg-token-based)\.)wtg\.zone$

rdg_http_path:
  description: HTTP rdg path /rdweb
  tests:
    - path_beg -i /rdweb

rdg_rpc_path:
  description: RPC rdg path /rpc
  tests:
    - path_beg -i /rpc
