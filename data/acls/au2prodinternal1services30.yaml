---
star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisegrid\.net$

star_borderwise_com:
  description: "*.borderwise.com"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?borderwise\.com$

au2s3-3_wtg_ws_and_subdomains:
  description: "*.au2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?au2s3-3\.wtg\.ws$

de1s3-3_wtg_ws_and_subdomains:
  description: "*.de1s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?de1s3-3\.wtg\.ws$

us2s3-3_wtg_ws_and_subdomains:
  description: "*.us2s3-3.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^(.*)?us2s3-3\.wtg\.ws$

au2s3-3-primary_not_enough_capacity:
  description: "au2s3-3.wtg.ws Primary backends unavailable"
  tests:
    - nbsrv(au2s3-3-primary) lt 1

star_cwconnector_wisegrid_net:
  description: "*.cwconnector.wisegrid.net cwconnector production services"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?cwconnector\.wisegrid\.net$

star_wisetechacademy_com:
  description: "Staging Wisetechacademy"
  tests:
    - hdr(host),field(1,:),lower -m reg -i ^([^\.]+\.)?wisetechacademy\.com$

lms_staging_wisetechacademy_com:
  description: "LMS Staging Wisetechacademy"
  tests:
    - hdr(host),field(1,:) -i lms.staging.wisetechacademy.com

custom_internal_au2prod1_ocp_wtg_ws:
  description: "Custom internal au2prod1 OCP WTG WS hosts"
  tests:
    - hdr(host) -i proget-au.wtg.zone
    - hdr(host) -i proget-au.wisetechglobal.com
    - hdr(host) -i cwbot-corp.wtg.zone

ocp_grpc_domains:
  description: "OCP gRPC domains for internal au2prod1"
  tests:
    - hdr(host) -i wtg-ih-msgapi-1-messagesgateway.internal.au2prod1.ocp.wtg.ws
    - hdr(host) -i wtg-ih-msgapi-1-noauth-messagesgateway.internal.au2prod1.ocp.wtg.ws
    - hdr(host) -i wtg-ih-msgapi-1-noauth-messagesapi.internal.au2prod1.ocp.wtg.ws

star_internal_au2prod1_ocp_wtg_ws:
  description: "*.internal.au2prod1.ocp.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?internal\.au2prod1\.ocp\.wtg\.ws$

star_internal_au2prod2_ocp_wtg_ws:
  description: "*.internal.au2prod2.ocp.wtg.ws"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?internal\.au2prod2\.ocp\.wtg\.ws$
