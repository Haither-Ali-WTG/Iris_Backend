---
star_wisetechglobal_com:
  description: "*.wisetechglobal.com"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisetechglobal\.com$

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wtg\.zone$

star_bolero_sand_wtg_zone:
  description: "*.bolero.sand.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?bolero\.sand\.wtg\.zone$

star_testrig_sand_wtg_zone:
  description: |-
    *.testrig.sand.wtg.zone
    *.testrig3.sand.wtg.zone
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?testrig3?\.sand\.wtg\.zone$

