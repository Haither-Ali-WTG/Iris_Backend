---
star_wisetechglobal_com:
  description: "*.wisetechglobal.com"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisetechglobal\.com$

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wtg\.zone$

star_bolero_sand_wtg_zone:
  description: "*.bolero.sand.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?bolero\.sand\.wtg\.zone$

star_testrig_sand_wtg_zone:
  description: |-
    *.testrig.sand.wtg.zone
    *.testrig3.sand.wtg.zone
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?testrig3?\.sand\.wtg\.zone$

excluded_from_redirect_paths:
  description: |-
    Paths that should be excluded from the HTTPS redirect because
    the webservices don't support HTTPS
  tests:
    - path_beg -i /Warehouse/webservice

cw1_dynamic_backend_webservice_path:
  description: |-
    CW1 webservice paths that get routed to specific dynamic backends
  tests:
    - path_beg -i /Services/
    - path_beg -i /Glow/
    - path_beg -i /Portals/

testrig_healthcheck:
  description: |-
    Route healthchecks for testrig to default backend so even if a service goes down
    the healthcheck can still be reached for troubleshooting
  tests:
    - path_end -i /wtg/ready
    - path_end -i /wtg/status

star_sand_wtg_zone:
  description: "*.sand.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?sand\.wtg\.zone$

talogy_src:
  description: source IP is Talogy (3rd party vendor external) CS01854184
  tests:
    - src 40.118.100.127/32
    - src 13.81.68.134/32
    - src 13.81.68.146/32
    - src 13.81.68.81/32
    - src 13.81.64.194/32
    - src 13.81.64.243/32
    - src 13.81.65.246/32

BSM_Blume_src:
  description: source IP is BSM/Blume, requested by Ryken Song in CS01954112 for OCMBE (ocean carrier messaging) 
  tests:
    - src 34.105.17.140/32
    - src 34.82.183.200/32  
    - src 34.168.249.100/32
    - src 34.105.0.45/32

star_cargowise_com:
  description: "*.cargowise.com"
  tests:
    - hdr(host),field(1,:),lower -m reg -i ^([^\.]+\.)?cargowise\.com$

scim-test_wisetechglobal_com:
  description: "scim-test.wisetechglobal.com"
  tests:
    - hdr(host) -i scim-test.wisetechglobal.com

ocmbe_sand_wtg_zone:
  description: "ocmbe.sand.wtg.zone"
  tests:
    - hdr(host),field(1,:) -i ocmbe.sand.wtg.zone

star_wisegrid_net:
  description: "*.wisegrid.net"
  tests:
    - hdr(host),field(1,:) -m reg -i ^([^\.]+\.)?wisegrid\.net$
