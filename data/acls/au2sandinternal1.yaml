---
star_wisetechglobal_com:
  description: "*.wisetechglobal.com"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wisetechglobal\.com$

star_wtg_zone:
  description: "*.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?wtg\.zone$

star_bolero_sand_wtg_zone:
  description: "*.bolero.sand.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?bolero\.sand\.wtg\.zone$

star_testrig_sand_wtg_zone:
  description: |-
    *.testrig.sand.wtg.zone
    *.testrig3.sand.wtg.zone
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?testrig3?\.sand\.wtg\.zone$

excluded_from_redirect_paths:
  description: |-
    Paths that should be excluded from the HTTPS redirect because
    the webservices don't support HTTPS
  tests:
    - path_beg -i /Warehouse/webservice

token_validation_service_path:
  description: |-
    Token Validation Service owned by the security and identity
    team
  tests:
    - path_beg -i /certificates/

login-staging_wisetechglobal_com_host:
  description: "login-staging.wisetechglobal.com"
  tests:
    - hdr(host) -m reg -i ^login-staging\.wisetechglobal\.com$
