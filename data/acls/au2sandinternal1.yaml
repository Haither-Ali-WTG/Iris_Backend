    *.cfs.testrig.sand.wtg.zone
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?cfs\testrig\.sand\.wtg\.zone$

star_scim_testrig_sand_wtg_zone:
  description: |-
    *.scim.testrig.sand.wtg.zone
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?scim\testrig\.sand\.wtg\.zone$

excluded_from_redirect_paths:
  description: |-
    Paths that should be excluded from the HTTPS redirect because
    the webservices don't support HTTPS
  tests:
    - path_beg -i /Warehouse/webservice

cw1_dynamic_backend_webservice_path:
  description: |-
    CW1 webservice paths that get routed to specific dynamic backends
  tests:
    - path_beg -i /Services/
    - path_beg -i /Glow/
    - path_beg -i /Portals/

testrig_healthcheck:
  description: |-
    Route healthchecks for testrig to default backend so even if a service goes down
    the healthcheck can still be reached for troubleshooting
  tests:
    - path_end -i /wtg/ready
    - path_end -i /wtg/status

star_sand_wtg_zone:
  description: "*.sand.wtg.zone"
  tests:
    - hdr(host) -m reg -i ^([^\.]+\.)?sand\.wtg\.zone$

talogy_src:
  description: source IP is Talogy (3rd party vendor external) CS01854184
  tests:
    - src 40.118.100.127/32
    - src 13.81.68.134/32
    - src 13.81.68.146/32
    - src 13.81.68.81/32
    - src 13.81.64.194/32
    - src 13.81.64.243/32
    - src 13.81.65.246/32

star_cargowise_com:
  description: "*.cargowise.com"
  tests:
    - hdr(host),field(1,:),lower -m reg -i ^([^\.]+\.)?cargowise\.com$

scim-test_wisetechglobal_com:
  description: "scim-test.wisetechglobal.com"
  tests:
    - hdr(host) -i scim-test.wisetechglobal.com
