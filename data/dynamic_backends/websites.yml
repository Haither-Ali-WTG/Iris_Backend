---
- name_like:
    - glow
  starts_with:
    - www-
  encryption: true
  health_check: /Glow/wtg/ready
  port: 443
  balance: first
  cookie:
    enabled: false
  maintenance_page: example.html
  name_suffix: ''

- name_like:
    - glow
  starts_with:
    - www-
  encryption: true
  health_check: /Glow/wtg/another_healthcheck
  port: 4443
  balance: first
  cookie:
    enabled: false
  name_suffix: '-backend2'

- name_like:
    - services
    - accounting
  starts_with:
    - svc-
  encryption: true
  health_check: "/"
  port: 443
  cookie:
    enabled: false
  name_suffix: ''

- name_like:
    - neo-
  starts_with:
    - neo-
  encryption: true
  health_check: "/Glow/wtg/ready"
  port: 443
  balance: first
  cookie:
    enabled: true
    name: GLOW
  name_suffix: ''

- name_like:
    - iris-test-
  starts_with:
    - iris-test-
  encryption: false
  health_check: "/ready"
  port: 80
  balance: first
  cookie:
    enabled: false
  name_suffix: ''

- name_regex: '\.testrig.*\.sand\.wtg\.zone$'
  server_regex: '^au2sp'
  encryption: false
  health_check: "/ready"
  port: 80
  balance: first
  cookie:
    enabled: false
  name_suffix: ''
