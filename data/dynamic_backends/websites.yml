---
- name_regex: glow|^www-
  encryption: true
  health_check: /Glow/wtg/ready
  port: 443
  balance: first
  cookie:
    enabled: false
  maintenance_page: example.html
  name_suffix: ''

- name_regex: glow|^www-
  encryption: true
  health_check: /Glow/wtg/another_healthcheck
  port: 4443
  balance: first
  cookie:
    enabled: false
  name_suffix: '-backend2'

- name_regex: services|accounting|^svc-
  encryption: true
  health_check: "/"
  port: 443
  cookie:
    enabled: false
  name_suffix: ''

- name_regex: neo-
  encryption: true
  health_check: "/Glow/wtg/ready"
  port: 443
  balance: first
  cookie:
    enabled: true
    name: GLOW
  name_suffix: ''

- name_regex: iris-test-
  encryption: false
  health_check: "/ready"
  port: 80
  balance: first
  cookie:
    enabled: false
  name_suffix: ''
