---
# Glow
- name_regex: ^www-[A-Za-z0-9]{6,8}(-cn)?\.(wisegrid|wisetechglobal)\.(net|cn)$
  encryption: true
  http_health_check:
    enabled: true
    http_path: /Glow/wtg/ready
    check_expect: "200|401|403|302|405"
  port: 443
  balance: first
  cookie:
    name: WEBSVC
    enabled: true
  name_suffix: '-glow'

