---
- name_regex: '\.testrig.*\.sand\.wtg\.zone$'
  encryption: false
  health_check: /Glow/wtg/ready
  check_expect: '200'
  port: 80
  cookie:
    enabled: true
    name: 'CW1'
  name_suffix: '-glow'

- name_regex: '\.testrig.*\.sand\.wtg\.zone$'
  encryption: false
  health_check: /Portals/wtg/ready
  check_expect: '200'
  port: 80
  cookie:
    enabled: true
    name: 'CW1'
  name_suffix: '-portals'

- name_regex: '\.testrig.*\.sand\.wtg\.zone$'
  server_regex: '^au2sp-tweb'
  encryption: true
  health_check: "/"
  check_expect: '200|401|403|302|405|500'
  port: 443
  cookie:
    enabled: true
    name: 'CW1'
  name_suffix: '-services'

- name_regex: '\.testrig.*\.sand\.wtg\.zone$'
  server_regex: '^au2sp'
  encryption: false
  health_check: "/"
  check_expect: '200|401|403|302|405|500'
  port: 80
  balance: first
  cookie:
    enabled: true
    name: 'CW1'
  name_suffix: ''
