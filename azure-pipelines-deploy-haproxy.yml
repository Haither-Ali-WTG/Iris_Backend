---
trigger:
  - master

variables:
  - template: artifacts.yml
  - name: user
    value: dante
  - name: cert_kv_name
    value: kv-wtg-iris-prod
  - name: key_vault_name
    value: kv-wtg-iris-prod

parameters:
  - name: matrix
    type: object
    default:
      - agent_dc: AU2
        agent_hall: A
        s3_host: au2s3-1.wtg.ws
      - agent_dc: DE1
        agent_hall: A
        s3_host: de1s3-1.wtg.ws
      - agent_dc: US2
        agent_hall: A
        s3_host: us2s3-1.wtg.ws

stages:
  - ${{ each run in parameters.matrix }}:
      - stage: Deploy_Haproxy_${{ run.agent_dc }}
        pool:
          name: dante
          demands:
            - WTG_DC -equals ${{ run.agent_dc }}
            - WTG_HALL -equals ${{ run.agent_hall }}
        lockBehavior: sequential
        dependsOn: []
        jobs:
          - deployment: Deploy_Haproxy_${{ run.agent_dc }}
            condition: or(eq('${{ run.agent_dc }}', variables['dc']), eq(variables['dc'], 'all'))
            environment: iris_${{ run.agent_dc }}_pipeline_lock
            workspace:
              clean: all
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self

                    - script: |
                        set -euxo pipefail
                        pip install -r requirements.txt
                      displayName: 'Install requirements'

                    - script: |
                        set -euxo pipefail
                        test "$(Build.SourceBranchName)" = "master"
                        cp ansible/ansible.cfg .
                      displayName: 'Prepare to run playbooks'

                    - task: DownloadPipelineArtifact@2
                      displayName: 'Download dante artifact'
                      inputs:
                        buildType: 'specific'
                        project: 'InfrastructureAutomation'
                        # dante build artifact pipeline Id
                        pipeline: 26
                        buildVersionToDownload: 'specific'
                        buildId: '$(dante_build_id)'
                        path: $(Build.SourcesDirectory)

                    - task: CopyFiles@2
                      displayName: 'Merge artifacts to a single roles folder'
                      inputs:
                        sourceFolder: nested_virt
                        targetFolder: ansible

                    - task: AzureKeyVault@2
                      displayName: 'Get secrets from Azure KV'
                      inputs:
                        azureSubscription: 'sc-azuredevops2dante-vaults'
                        KeyVaultName: '$(key_vault_name)'
                        SecretsFilter: secretAppIdDf4b4604e176
                        RunAsPreJob: false

                    - task: Ansible@0
                      displayName: 'Check and save certificates'
                      inputs:
                        ansibleInterface: 'agentMachine'
                        playbookPathOnAgentMachine: 'ansible/check_and_save_certificates.yml'
                        inventoriesAgentMachine: 'file'
                        inventoryFileOnAgentMachine: 'instances'
                        failOnStdErr: false
                        args: >-
                          -u $(user) --diff
                          -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                          -e="simulation=true" -e="azure_kv_name=$(cert_kv_name)"
                          -e="target_dc=${{ run.agent_dc }}"
                      env:
                        secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)

                    - task: Ansible@0
                      displayName: 'Deploy haproxy'
                      inputs:
                        ansibleInterface: 'agentMachine'
                        playbookPathOnAgentMachine: 'ansible/deploy_haproxy.yml'
                        inventoriesAgentMachine: 'file'
                        inventoryFileOnAgentMachine: 'instances'
                        failOnStdErr: false
                        # TODO: Support other DCs
                        args: >-
                          -u $(user) --diff
                          -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                          -e="simulation="
                          -e="winrm_password=$(winrm_password)"
                          -e="s3_host=${{ run.s3_host }}"
                          -e="key_vault_name=$(key_vault_name)"
                          -e="target_dc=${{ run.agent_dc }}"
                      env:
                        secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
