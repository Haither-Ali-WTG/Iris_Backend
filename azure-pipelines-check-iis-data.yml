---
trigger: none

schedules:
  - cron: "*/30 * * * *"
    displayName: Every 30 minutes check iis data for dynamic backends
    always: true
    branches:
      include:
        - master

variables:
  - template: artifacts.yml
  - name: user
    value: dante
  - name: key_vault_name
    value: kv-wtg-iris-prod

parameters:
  - name: matrix
    type: object
    default:
      - target_dc: AU2
        agent_dc: AU2
        agent_hall: A
        s3_host: au2s3-2.wtg.ws
        s3_iris_bucket: s3://au-iscore-iris-prod-1/
        pure_usernames: au-iscore-iris-prod-1-ro
      - target_dc: DE1
        agent_dc: DE1
        agent_hall: A
        s3_host: de1s3-2.wtg.ws
        s3_iris_bucket: s3://de-iscore-iris-prod-1/
        pure_usernames: de-iscore-iris-prod-1-ro
      - target_dc: US2
        agent_dc: US2
        agent_hall: A
        s3_host: us2s3-2.wtg.ws
        s3_iris_bucket: s3://us-iscore-iris-prod-1/
        pure_usernames: us-iscore-iris-prod-1-ro
      - target_dc: CN1
        agent_dc: AU2
        agent_hall: A
        s3_host: au2s3-2.wtg.ws
        s3_iris_bucket: s3://au-iscore-iris-prod-1/
        pure_usernames: au-iscore-iris-prod-1-ro
      - target_dc: SA1
        agent_dc: AU2
        agent_hall: A
        s3_host: au2s3-2.wtg.ws
        s3_iris_bucket: s3://au-iscore-iris-prod-1/
        pure_usernames: au-iscore-iris-prod-1-ro

stages:
  - ${{ each run in parameters.matrix }}:
      - stage: Check_IIS_data_${{ run.target_dc }}
        pool:
          name: dante
          demands:
            - WTG_DC -equals ${{ run.agent_dc }}
            - WTG_HALL -equals ${{ run.agent_hall }}
        lockBehavior: sequential
        dependsOn: []
        jobs:
          - deployment: Check_IIS_data_${{ run.target_dc }}
            condition: or(eq('${{ run.agent_dc }}', variables['dc']), eq(variables['dc'], 'all'))
            environment: iris_${{ run.target_dc }}_check_iis_pipeline_lock
            workspace:
              clean: all
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self

                    - task: InstallSSHKey@0
                      displayName: 'Install an SSH key'
                      inputs:
                        knownHostsEntry: 'StrictHostKeyChecking no'
                        sshKeySecureFile: 'id_rsa_dante'

                    - script: |
                        set -euxo pipefail
                        pip install -r requirements.txt
                      displayName: 'Install requirements'

                    - script: |
                        set -euxo pipefail
                        test "$(Build.SourceBranchName)" = "master"
                        cp ansible/ansible.cfg .
                      displayName: 'Prepare to run playbooks'

                    - task: DownloadPipelineArtifact@2
                      displayName: 'Download dante artifact'
                      inputs:
                        buildType: 'specific'
                        project: 'InfrastructureAutomation'
                        # dante build artifact pipeline Id
                        pipeline: 26
                        buildVersionToDownload: 'specific'
                        buildId: '$(dante_build_id)'
                        path: $(Build.SourcesDirectory)

                    - task: CopyFiles@2
                      displayName: 'Merge artifacts to a single roles folder'
                      inputs:
                        sourceFolder: iris
                        targetFolder: ansible

                    - task: AzureKeyVault@2
                      displayName: 'Get secrets from Azure KV'
                      inputs:
                        azureSubscription: 'sc-azuredevops2dante-vaults'
                        KeyVaultName: '$(key_vault_name)'
                        SecretsFilter: secretAppIdDf4b4604e176
                        RunAsPreJob: false

                    - task: Ansible@0
                      displayName: 'Check IIS data'
                      inputs:
                        ansibleInterface: 'agentMachine'
                        playbookPathOnAgentMachine: 'ansible/check_iis_data.yml'
                        inventoriesAgentMachine: 'file'
                        inventoryFileOnAgentMachine: 'data/instances'
                        failOnStdErr: false
                        args: >-
                          -u $(user) --diff
                          -e="build_id=$(Build.BuildId)$(System.JobAttempt)"
                          -e="{simulation: false}"
                          -e="winrm_password=$(winrm_password)"
                          -e="s3_host=${{ run.s3_host }}" -e="pure_usernames='${{ run.pure_usernames }}'"
                          -e="s3_iris_bucket=${{ run.s3_iris_bucket }}"
                          -e="key_vault_name=$(key_vault_name)"
                          -e="target_dc=${{ run.target_dc }}"
                          -e="target_hall=${{ run.agent_hall }}"
                      env:
                        secretAppIdDf4b4604e176: $(secretAppIdDf4b4604e176)
                        azure_devops_token: $(System.AccessToken)

                    - task: Ansible@0
                      displayName: 'Check site collection result'
                      inputs:
                        ansibleInterface: 'agentMachine'
                        playbookPathOnAgentMachine: 'ansible/check_collection_result.yml'
                        inventoriesAgentMachine: 'file'
                        inventoryFileOnAgentMachine: 'data/instances'
                        args: >-
                          -u $(user) --diff
